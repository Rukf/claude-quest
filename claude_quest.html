m wants the review to finish as fast as possible while still keeping each subagent's exploration out of the main conversation. What should they do?","o":["Invoke the three subagents so they run concurrently, since independent subtasks then finish in the time of the slowest one rather than the sum of all three","Invoke the three subagents sequentially in a fixed order, since subagents are only supported one at a time within a single main-agent turn","Merge all three review responsibilities into one subagent's system prompt so a single subagent invocation covers everything in one pass","Run the three checks directly in the main agent's own tool calls instead of subagents, since only the main agent can run tools concurrently"],"a":[0],"m":false,"x":"Correct. Multiple subagents can run concurrently, so independent subtasks like style, security, and coverage checks finish in the time of the slowest one rather than sequentially, while each subagent's exploration still stays isolated from the main conversation."},{"d":"prompt","diff":3,"q":"A team defines a doc-reviewer subagent that should only ever read and search documentation files, never modify them, to reduce both risk and the context devoted to unused tool schemas. How should they configure it?","o":["Set the tools field on its AgentDefinition to a read-only set such as Read and Grep, so it can examine files but cannot edit or write them","Omit the tools field entirely so the subagent inherits every tool from the parent, then rely on its prompt text to ask it not to edit files","Set permission_mode to bypassPermissions on the subagent so every tool call it makes is automatically approved without restriction","Give the subagent the Edit and Write tools but set effort to low so it is less likely to choose to use them"],"a":[0],"m":false,"x":"Correct. Specifying a restricted tools list such as Read and Grep on the AgentDefinition limits what the subagent can do at the tool level, both reducing risk and avoiding the context cost of schemas for tools it will never use."},{"d":"prompt","diff":3,"q":"A main agent session compacts because it has accumulated a large amount of conversation history over a long refactor. A subagent was invoked earlier in that same session to investigate a separate issue. What happens to that subagent's own transcript when the main conversation compacts?","o":["It is unaffected, because subagent transcripts are stored in separate files independent of the main conversation's compaction","It is compacted at the same time as the main conversation, since all transcripts within a session share one context window","It is permanently deleted, since compaction of the parent session invalidates any subagent transcripts spawned during it","It is merged into the main conversation's post-compaction summary so both are represented in a single combined transcript"],"a":[0],"m":false,"x":"Correct. Subagent transcripts persist independently of the main conversation; when the main conversation compacts, subagent transcripts are unaffected because they are stored in separate files."},{"d":"prompt","diff":3,"q":"An agent is tasked only with listing directory contents and locating a handful of files by name, a routine and well-scoped job. Which setting should the team tune to reduce token usage and cost for this specific task without changing what tools are available?","o":["Set effort to low, since minimal reasoning is well suited to simple file lookups and listing directories and reduces tokens spent per turn","Set effort to max, since more reasoning depth always reduces the total number of turns and therefore total token usage","Disable automatic compaction, since compaction is what adds most of the token overhead in short, well-scoped tasks","Remove the Agent tool from allowed_tools, since subagent invocation is what consumes the majority of tokens in simple tasks"],"a":[0],"m":false,"x":"Correct. Low effort applies minimal reasoning and is recommended for tasks like file lookups and listing directories, reducing tokens spent per turn without removing any tool access."},{"d":"prompt","diff":3,"q":"A subagent finished a first pass of analysis and the team wants to ask a follow-up question that depends on that subagent's full prior reasoning and tool calls, rather than starting a new subagent from scratch. What must the team do to continue that specific subagent's work?","o":["Capture the session ID and the agentId from the first invocation's Agent tool result, then resume the same session and reference that agent ID in the follow-up prompt","Simply send a new query() call with the same subagent name defined identically, since matching names automatically resume the previous subagent's transcript","Enable settingSources for the session, since that is what causes a subagent's prior transcript to be reloaded on the next query() call","Increase maxTurns on the follow-up query, since a higher turn limit is what allows a subagent to recall its earlier reasoning"],"a":[0],"m":false,"x":"Correct. Resuming a subagent requires capturing session_id from the first query and the agentId from the Agent tool result text, then passing resume: sessionId with the agent ID referenced in the follow-up prompt, within the same session."},{"d":"prompt","diff":3,"q":"A workflow needs to coordinate around 150 short, independent data-extraction subtasks across a large document set, far more than a handful of turn-by-turn subagent delegations. Sending all 150 as Agent tool calls from a single conversation would overwhelm that conversation's context. What should the team use instead?","o":["The Workflow tool, which moves orchestration of many subagents into a script the runtime executes outside the conversation context","A single subagent with maxTurns raised to 150, since one subagent can absorb an arbitrarily large number of sequential extraction turns","The PreCompact hook, since it is designed specifically to coordinate large numbers of parallel subagent invocations","Nested subagents five levels deep, since each additional nesting level is designed to add capacity for roughly 30 more subtasks"],"a":[0],"m":false,"x":"Correct. Subagents work well for a few delegated tasks per turn; for runs coordinating dozens to hundreds of agents, the Workflow tool moves orchestration into a script executed outside the conversation context, avoiding the overhead of tracking every delegation as a turn in one conversation."},{"d":"prompt","diff":3,"q":"A team deploying an autonomous production agent is worried that an open-ended prompt could cause a session to run unpredictably long, consuming excessive context and cost before it finishes. Which options directly guard against this? (Select all that apply)","o":["Set max_turns / maxTurns to cap the number of tool-use round trips before the loop stops","Set max_budget_usd / maxBudgetUsd to cap total spend before the loop stops","Set a lower effort level for turns that only need simple, well-scoped reasoning, reducing tokens spent per turn","Set permission_mode to bypassPermissions, since automatically approving every tool call is what limits how long a session can run","Rely on automatic compaction alone, since compaction guarantees the session cannot exceed a fixed total cost regardless of how many turns it takes","Switch to the most capable available model, since a more capable model is what caps a runaway session's total turns"],"a":[0,1,2],"m":true,"x":"Correct. Max turns counts tool-use turns only and stops the loop once the limit is hit, directly bounding how long an open-ended session can run."},{"d":"prompt","diff":3,"q":"A long-running agent session has read many large files and executed many verbose Bash commands over dozens of turns. Which statements about this session's context window are accurate? (Select all that apply)","o":["The full conversation history keeps growing each turn with prior prompts, responses, tool inputs, and tool outputs","The content of large files read and the verbose output of executed commands can each use thousands of tokens in a single turn","The system prompt is a small fixed cost present on every single request throughout the session","Full content for every skill defined in the project loads into context at session start, regardless of whether that skill was ever invoked","Tool results generated inside a subagent's own exploration flow into the main conversation's context the same way the main agent's own tool calls do","History already summarized by an earlier compaction event is restored to its original full form the next time the window nears its limit"],"a":[0,1,2],"m":true,"x":"Correct. Conversation history accumulates over turns, growing with each turn's prompts, responses, tool inputs, and tool outputs."},{"d":"prompt","diff":3,"q":"A team is designing a long-running production agent and wants to keep its context window usage efficient without sacrificing task quality. Which strategies are documented ways to achieve this? (Select all that apply)","o":["Delegate isolated subtasks to subagents so the main agent's context grows only by their final summaries, not their full exploration","Scope each subagent's tools field to the minimum set it actually needs, since every tool definition takes context space","Set effort to low for agents or subagents doing simple, well-scoped tasks like file lookups or listing directories","Disable MCP tool search entirely so every MCP tool schema loads upfront before the session starts, guaranteeing predictable latency","Increase maxBudgetUsd substantially so the agent has more room to accumulate history before hitting a spending limit","Disable the ResultMessage entirely so token usage and cost are never computed at the end of the session"],"a":[0,1,2],"m":true,"x":"Correct. Using subagents for subtasks means each starts a fresh conversation, and only its final response returns to the parent, so the main context grows by that summary rather than the full subtask transcript."},{"d":"prompt","diff":3,"q":"Detecting whether a task was actually handled by a defined code-reviewer subagent versus answered directly by the main agent matters for a monitoring dashboard the team is building. Which signals in the message stream reliably indicate that a subagent handled part of the work? (Select all that apply)","o":["A tool_use content block whose name is \"Agent\" (or, on older SDK versions, \"Task\")","A message carrying a parent_tool_use_id field, indicating it originated from within a subagent's execution context","Any AssistantMessage at all, since every AssistantMessage in a session is emitted from inside a subagent's context by definition","A ResultMessage with subtype \"success\", since only subagent-handled tasks are able to reach that particular subtype","The Agent tool result text containing an agentId trailer, which appears once the invoked subagent completes"],"a":[0,1,4],"m":true,"x":"Correct. Claude invokes subagents through the Agent tool, so a tool_use block with name \"Agent\" (or \"Task\" on older SDK releases and in certain compatibility fields) signals a subagent invocation."},{"d":"model","diff":3,"q":"A document-analysis pipeline caches a 40,000-token reference manual using an ephemeral cache_control breakpoint with the default TTL. Analysts submit follow-up questions against the manual in bursts, but gaps between bursts are frequently 8 to 10 minutes. The team observes that cache reads are not occurring for most follow-up bursts, so they keep paying the full cache-write price again. What change best fits this usage pattern?","o":["Set the cache_control ttl to \"1h\" so the manual stays cached across the longer gaps between analyst bursts, avoiding repeated 5-minute cache writes","Send a max_tokens: 0 pre-warming request every 5 minutes to keep the existing cache entry perpetually refreshed regardless of gap length","Split the 40,000-token manual into four separate 10,000-token cache_control breakpoints so each chunk is billed as a smaller, cheaper cache write","Increase the model's context window setting so the manual is retained in server-side memory between analyst sessions"],"a":[0],"m":false,"x":"Correct. The default ephemeral cache TTL is 5 minutes, which is shorter than the observed 8-10 minute gaps, so the cache expires between bursts. The 1-hour TTL option (2x base input price for the write) covers that gap and lets later bursts hit the cache instead of re-writing it."},{"d":"model","diff":3,"q":"A finance team wants a monthly cost model for an internal Claude-powered summarization service. They know the average input tokens per call, average output tokens per call, and call volume, but the engineering team also plans to introduce prompt caching for a shared instruction block. Which combination of usage fields should the cost model consume from the API responses to produce an accurate blended cost once caching is live?","o":["input_tokens, cache_creation_input_tokens, cache_read_input_tokens, and output_tokens, applying each field's own per-token rate since they are billed at different prices","Only the total of input_tokens plus output_tokens, since caching does not change how usage fields are reported once a request completes","Only output_tokens, since cached input segments are provided to the customer at no charge and therefore need not appear in a cost model","input_tokens and output_tokens averaged across the month, ignoring cache_creation_input_tokens and cache_read_input_tokens since these are internal diagnostic fields not tied to billing"],"a":[0],"m":false,"x":"Correct. With caching enabled, the usage object separately reports input_tokens (uncached, post-breakpoint), cache_creation_input_tokens (billed at the write multiplier), and cache_read_input_tokens (billed at roughly 0.1x base price), each with distinct pricing; a cost model must apply each field's rate separately, plus output_tokens at the output rate, to be accurate."},{"d":"model","diff":3,"q":"A latency-sensitive voice assistant relies on a large cached system prompt to keep response times low. Product wants to guarantee the cache is always warm the instant a user starts speaking, even after periods with no traffic, without waiting for an actual user request to trigger the cache write. Which technique addresses this directly?","o":["Issue a periodic request with max_tokens: 0 that includes the cached prefix and its cache_control breakpoint, refreshing the cache before it expires so it is warm when real traffic arrives","Increase the model's temperature parameter so cached content is retained in memory for a longer duration between requests","Enable extended thinking on every request so Claude proactively pre-loads the system prompt into a persistent cache that never expires","Set stream to true on all requests, since streaming responses automatically extend the TTL of any cache entries touched during the request"],"a":[0],"m":false,"x":"Correct. Pre-warming with a max_tokens: 0 request that includes the cached prefix and its breakpoint writes or refreshes the cache entry ahead of real traffic, which is the documented technique for keeping latency-sensitive, large cached prompts ready without waiting on an actual user request."},{"d":"model","diff":3,"q":"An engineering lead is reviewing a colleague's caching design for a document Q&A tool. The design places cache_control on the final message of each request, where the final message is the user's newest question, which is different on every request. Static content such as the system prompt and the large source document appears earlier in the request and is never marked with cache_control. What is the most likely outcome of this design?","o":["Little to no cache benefit will be realized, because the breakpoint is placed on content that changes every request, so the cache is effectively rewritten from scratch each time rather than being reused","The design is optimal, because placing cache_control on the most recent content guarantees the freshest possible cache entry for every request","The design will cause an API error, because cache_control cannot be applied to the final block in a request under any circumstances","The design will still cache the static system prompt and document automatically, because cache_control breakpoints apply retroactively to all earlier stable content regardless of where they are placed"],"a":[0],"m":false,"x":"Correct. Best practice is to place cache_control on stable content so subsequent requests can match the cached prefix; here the breakpoint sits on the ever-changing final user question, so the prefix hash differs every request, preventing reuse of the cache for the static system prompt and document."},{"d":"model","diff":3,"q":"A platform team is designing observability for Claude API cost control across several product teams. They want dashboards that can distinguish, per request, how much of the input cost came from newly written cache entries versus cache hits versus fully uncached tokens, so they can identify which teams have poorly designed cache breakpoints. Which of the following statements about the usage response fields available for this dashboard are accurate? (Select all that apply.)","o":["cache_creation_input_tokens reports the number of tokens newly written to cache on a given request, billed at the cache write multiplier","cache_read_input_tokens reports the number of tokens served from an existing cache entry on a given request, billed at the discounted cache read rate","input_tokens on a cached request reports only the tokens after the last cache breakpoint that were neither written to nor read from cache","A single total_tokens field already separates cache-write, cache-read, and uncached segments, making the other usage fields unnecessary for this dashboard","stop_reason must be cross-referenced with model to determine whether a given request's input tokens came from a cache read or a cache write"],"a":[0,1,2],"m":true,"x":"Correct. cache_creation_input_tokens specifically reports tokens newly written to the cache on that request, and those tokens are billed at the cache write multiplier (1.25x or 2x base input price depending on TTL)."},{"d":"model","diff":3,"q":"A company operates an internal coding assistant on Claude Opus. The finance team asks engineering to identify which combinations of usage patterns would most reduce cost without changing the model or degrading answer quality. Which of the following changes would plausibly reduce spend? (Select all that apply.)","o":["Adding a cache_control breakpoint after a large, unchanging repository context block that is resent with every request in a session","Switching from the 5-minute ephemeral cache TTL to the 1-hour TTL for a workflow where requests against the same cached context are spaced 20-30 minutes apart","Using the token counting endpoint during development to trim an oversized system prompt down to only the instructions actually needed","Increasing the max_tokens parameter on every request well beyond what responses typically need, to avoid truncation on rare long answers","Reordering the request so that the tool definitions and system prompt come after the frequently changing user message rather than before it"],"a":[0,1,2],"m":true,"x":"Correct. Caching a large stable context block that is repeated across requests within a session is the core caching use case, converting most of those repeated tokens from full input price to the much cheaper cache-read price."},{"d":"model","diff":3,"q":"A team is deciding how to structure cache breakpoints for an agentic workflow that includes: (1) a fixed set of tool definitions, (2) a system prompt combining static instructions with a per-user personalization snippet that changes for every user, and (3) a growing conversation history. They want to maximize cache reuse across requests from the same user while keeping the personalization snippet accurate. Which design best satisfies this goal?","o":["Place the static instructions before the personalization snippet in the system prompt, put a cache_control breakpoint at the end of the static instructions block only, and leave the personalization snippet and everything after it uncached","Concatenate the personalization snippet before the static instructions at the very start of the system prompt so the entire system block can be cached as one unit for maximum coverage","Apply a cache_control breakpoint to the personalization snippet itself, since caching should always target the most recently added content in a request","Avoid using any cache breakpoints in the system prompt and instead rely exclusively on caching the conversation history, since system prompts are not eligible for partial caching"],"a":[0],"m":false,"x":"Correct. Placing the breakpoint after the stable static instructions and before the per-user snippet lets the static portion be cached and reused across every request from that user (and potentially across users), while the personalization snippet, which changes per user, stays outside the cached prefix and is always evaluated fresh, keeping it accurate."},{"d":"model","diff":3,"q":"A team building a customer-facing chatbot on Claude wants to reduce ongoing operating cost while keeping quality high. They are evaluating several changes together as part of a cost governance review: (1) enabling prompt caching for the shared system prompt and tool schema, (2) periodically using the token counting endpoint to audit prompt bloat introduced by recent feature additions, (3) monitoring cache_creation_input_tokens and cache_read_input_tokens over time to verify caching is actually being hit rather than rewritten every request, and (4) manually recalculating cost using a fixed word count assumption instead of the usage object returned by the API. Which of these should be part of a sound cost-management practice? (Select all that apply.)","o":["Enabling prompt caching for the shared system prompt and tool schema so repeated static content is billed at the discounted cache-read rate on subsequent requests","Periodically auditing prompt size with the token counting endpoint to catch prompt bloat introduced by new features before it silently increases per-request cost","Monitoring cache_creation_input_tokens versus cache_read_input_tokens over time to confirm the cache is actually being reused and not being rewritten on most requests","Replacing usage-object-based cost tracking with a fixed word-count-to-cost conversion applied uniformly across all requests","Always applying the 1-hour cache TTL to the shared system prompt and tool schema, since a longer TTL is guaranteed to cost less than the 5-minute default regardless of request cadence"],"a":[0,1,2],"m":true,"x":"Correct. Caching stable, repeated content is a core, directly applicable technique for reducing per-request input cost in a chatbot with a shared system prompt and tool schema."},{"d":"prompt","diff":3,"q":"A developer prompts Claude with the bare request \"Create an analytics dashboard\" and consistently gets a minimal, bare-bones implementation. The team wants a fully-featured result with rich interactions on the first attempt, without relying on multiple follow-up turns. What change to the prompt best achieves this?","o":["Rewrite the request to state the desired scope explicitly, such as asking for as many relevant features and interactions as possible and to go beyond the basics, rather than leaving scope for Claude to infer","Resend the identical request in all capital letters so Claude interprets the wording with greater urgency and produces a more thorough response","Raise the sampling temperature for the request so Claude generates more elaborate and creative dashboard markup than it would at default settings","Move the same wording from the user turn into the system prompt without adding any further detail, since system-prompt placement alone signals higher priority"],"a":[0],"m":false,"x":"Correct. Claude responds well to explicit, specific instructions; if you want above-and-beyond behavior, you need to request it directly rather than relying on the model to infer elevated scope from a vague prompt."},{"d":"prompt","diff":3,"q":"A team is building a multishot prompt to classify support tickets into categories, but Claude's output format is inconsistent across different ticket inputs. They want to revise the example set to follow Anthropic's guidance on using examples effectively. Select the changes that align with that guidance.","o":["Wrap each individual example in <example> tags, with the full set inside an outer <examples> tag, so Claude can clearly distinguish examples from surrounding instructions","Ensure the examples are diverse and cover edge cases so Claude does not pick up an unintended, overly narrow pattern from a repetitive set","Reduce the example count to a single example so Claude cannot overfit to any one example's exact wording","Make every example nearly identical in structure and content so Claude reliably converges on one rigid output template","Include three to five well-crafted examples that closely mirror the actual use case rather than a single loosely related one","Randomize the category labels used inside the examples so they never match any of the real ticket categories"],"a":[0,1,4],"m":true,"x":"Correct. Structuring examples in <example> tags (with an outer <examples> tag for multiple examples) helps Claude distinguish examples from instructions."},{"d":"prompt","diff":3,"q":"An application sends identical tone-and-role guidance on every single request, along with per-request text that varies from call to call. Which prompt structure best matches the recommended separation of fixed versus variable content?","o":["Place the static tone-and-role guidance in the system prompt and pass only the request-specific, varying text in the user message, keeping fixed content separate from variable content","Place both the static guidance and the varying text together inside a single user message rebuilt from scratch on every call, since only user-turn content is read by the model","Place the varying, request-specific text in the system prompt and the static tone-and-role guidance in the user turn, since system prompts are reserved for content that changes turn to turn","Alternate which turn holds the static guidance on each call so the model does not over-fit to a fixed system prompt across a long-running session"],"a":[0],"m":false,"x":"Correct. Fixed content such as role and tone guidance belongs in the system prompt, while variable, per-request content belongs in the user message; this separation is the recommended prompt template pattern."},{"d":"prompt","diff":3,"q":"A downstream parser needs to reliably locate the final prose answer within Claude's response, separate from any surrounding commentary. Which approach best achieves consistent, parseable separation?","o":["Instruct Claude to place the prose answer inside a specific XML tag, such as <answer> tags, so the target section can be located unambiguously","Ask Claude to prefix the final answer with the literal text \"ANSWER:\" and rely on that exact string appearing consistently across every response","Increase max_tokens substantially so Claude has enough room to write both commentary and answer without truncation affecting parsing","Ask Claude to separate sections using three blank lines and rely on consistent whitespace patterns for programmatic parsing"],"a":[0],"m":false,"x":"Correct. Using XML format indicators, such as asking Claude to wrap the target content in a specific tag, is a documented way to make a section of the response reliably identifiable for parsing."},{"d":"prompt","diff":3,"q":"A translation application rebuilds its entire prompt string from scratch for every call, mixing fixed translation instructions together with a single variable field for the source text, which makes it hard to test edge-case inputs in isolation. What is the recommended fix?","o":["Separate the prompt into a fixed template with a placeholder, such as double-curly-brace {{text}}, for the variable content, so the instructional structure is reused and only the variable text changes between calls","Store ten pre-written, fully assembled prompt strings covering common inputs and select whichever one most closely matches the request at runtime","Hard-code the source text directly into the fixed instructions each time and rely on manual find-and-replace before every deployment","Send the fixed instructions as one API call and the variable source text as a separate, unrelated API call, then concatenate the two responses"],"a":[0],"m":false,"x":"Correct. Prompt templates combine fixed and variable content using placeholders, commonly shown as double-bracket variables, which improves consistency, testability, and easier iteration on edge cases."},{"d":"prompt","diff":3,"q":"For a task where output quality matters more than latency, and the team needs to inspect and log an intermediate draft before it is finalized, which prompting pattern best fits this requirement?","o":["Break the task into separate sequential calls: generate a draft, have Claude review that draft against explicit criteria, then have Claude refine the draft based on the review, so each stage can be logged or branched on independently","Combine every instruction, criterion, and the request for a final answer into a single call at a very high effort setting, since higher effort is documented as a substitute for explicit multi-step chaining when intermediate output is needed","Send the identical single prompt several times in parallel and keep only the shortest resulting response, since output length is documented to correlate with error rate","Ask Claude to draft and finalize the response within one call, then discard the model's own stated confidence and randomly sample which version to keep"],"a":[0],"m":false,"x":"Correct. Explicit prompt chaining into separate sequential calls, most commonly a draft-review-refine pattern, is the documented approach when intermediate outputs need to be inspected, logged, or branched on."},{"d":"prompt","diff":3,"q":"An application inserts untrusted, user-submitted text directly alongside its instructions in the same prompt. Testers found that certain crafted inputs sometimes caused Claude to follow directions embedded in the user text rather than the app's intended behavior. Select the practices that directly help mitigate this at the level of prompt construction.","o":["Wrap the untrusted content in its own XML tags, such as <user_input>, so there is a clear boundary between instructions and untrusted data","Explicitly instruct Claude to treat the tagged content strictly as data to evaluate, not as instructions to follow","Keep the untrusted content in a clearly separated section rather than interleaving it directly inside the instruction text itself","Convert the untrusted text to uppercase before inserting it, since capitalized text is treated as a lower-priority signal than instructions","Remove all XML and markdown structure from the prompt, since any structure is what allows untrusted text to be mistaken for instructions","Place the untrusted content before the system prompt within the same user turn, since ordering alone is documented as sufficient to mark it non-authoritative"],"a":[0,1,2],"m":true,"x":"Correct. Wrapping untrusted content in its own XML tags gives Claude a clear structural boundary between instructions and data, which is a documented use of XML tags to reduce misinterpretation."},{"d":"prompt","diff":3,"q":"A legacy pipeline used to prefill the assistant's response with an opening brace to force JSON output. On current models, prefilled responses on the last assistant turn are no longer supported and the call now returns an error. What is the recommended replacement to reliably get JSON-shaped output?","o":["Use structured outputs, or a tool call with a defined schema, so Claude's response is constrained directly to the target JSON schema instead of relying on a forced partial completion","Ask Claude in the user message to imagine it already began its answer with an opening brace, without changing anything else, and hope the completion continues naturally in that shape","Send two separate calls per request, discard the first response entirely, and infer the JSON fields only from the plain-text pattern of the second response","Lower the effort setting to its minimum value, since lower-effort responses are documented to default to raw JSON formatting without additional prose"],"a":[0],"m":false,"x":"Correct. Structured outputs (or tools with a schema) are the documented migration path for prefill-based JSON forcing, constraining Claude's response to the desired schema directly."},{"d":"prompt","diff":3,"q":"A prompt written for a legal-document summarizer produces inconsistent structure across runs, and engineers on the team disagree about why. Before tuning the prompt further, which practice would most directly reveal ambiguity in the current wording?","o":["Show the prompt to a colleague who has minimal context on the task and ask them to follow it exactly as written, since confusion for a human reader tends to predict confusion for Claude","Rerun the identical, unedited prompt against the model twenty times and keep only the most common resulting structure, treating majority voting as a substitute for locating the ambiguity","Ask Claude to explain its own instructions back in a separate call, treating the model's paraphrase of the prompt as a reliable substitute for a human comprehension check","Reduce the temperature to zero for the summarizer's requests, on the assumption that ambiguity in phrasing is resolved by lower-variance sampling rather than by clearer instructions"],"a":[0],"m":false,"x":"Correct. The golden rule for clarity is to show the prompt to a colleague with minimal context and have them follow it; if they are confused, Claude is likely to be confused too."},{"d":"prompt","diff":3,"q":"A report-generation tool keeps producing heavy markdown formatting that the team wants reduced. They are evaluating several changes to the prompt. Select the approaches that are documented techniques for controlling Claude's output formatting.","o":["Phrase the instruction as what Claude should do, e.g. \"write in flowing prose paragraphs,\" instead of only stating what to avoid","Ask Claude to place the prose portion of its response inside a specific XML tag so the target section is unambiguous","Remove markdown formatting from the prompt itself, since the style used in the prompt tends to influence the style of the response","Give only a single blanket instruction and skip detailed guidance, since brevity alone is documented as sufficient to prevent markdown regardless of task","Insert zero-width characters between markdown symbols in the prompt so the tokenizer cannot recognize markdown syntax","Set the temperature parameter to its maximum value, since higher temperature is documented to suppress markdown usage"],"a":[0,1,2],"m":true,"x":"Correct. Telling Claude what to do instead of what not to do is a documented, effective way to steer output formatting."},{"d":"prompt","diff":3,"q":"An application needs Claude to correctly state its own identity and the specific model in use whenever a user asks \"what model are you,\" rather than giving a vague or outdated answer. What is the recommended way to achieve this?","o":["Add an explicit identity statement to the prompt, such as \"The assistant is Claude, created by Anthropic. The current model is [model name],\" since Claude does not reliably self-identify without it","Rely on Claude's default behavior without adding any identity statement, since accurate model self-identification is documented to work correctly out of the box on every request","Pass the model string only through the API's model parameter and omit it from the prompt text entirely, since the API parameter alone is documented to populate in-conversation self-identification","Ask the identity question from the system role instead of the user role, since only questions asked from the system role are documented to trigger accurate self-identification"],"a":[0],"m":false,"x":"Correct. Anthropic's guidance provides a sample prompt for model self-knowledge that explicitly states Claude's identity and the current model name, since this is not something Claude reliably infers unprompted."},{"d":"prompt","diff":3,"q":"A team wants its few-shot examples to teach Claude a specific step-by-step reasoning style before it produces a final answer, not just the surface output format. What is the recommended technique for conveying this?","o":["Include <thinking> tags inside the few-shot examples that show the desired reasoning pattern step by step, so Claude generalizes that style into its own responses","Add a longer natural-language description of the reasoning process to the system prompt only, and omit any reasoning from the examples themselves","Provide ten near-identical examples that vary only in the final answer, since uniform repetition is documented as the way to teach a reasoning pattern","Replace the multi-step examples with a single very long example, since including more than one example is documented to reduce consistency of reasoning style"],"a":[0],"m":false,"x":"Correct. Using <thinking> tags inside multishot examples to demonstrate a reasoning pattern is a documented technique; Claude generalizes that style into its own extended thinking or reasoning."},{"d":"prompt","diff":3,"q":"A team builds a pipeline that extracts contact fields (name, email, plan) from support tickets and feeds them directly into a database insert without any try/except around the JSON parsing step. The pipeline occasionally crashes because Claude's response includes explanatory text before the JSON or omits a required field. What is the most effective fix to guarantee schema conformance without relying on prompt wording alone?","o":["Add a system-prompt instruction telling Claude to output only JSON and no other text","Configure Structured Outputs with a JSON schema in the API's output format field","Raise max_tokens so Claude has enough room to finish writing the full JSON object","Have Claude wrap the JSON in triple backticks and strip them during post-processing"],"a":[1],"m":false,"x":"Correct. Structured Outputs constrains generation to a declared JSON schema, guaranteeing valid, schema-conforming JSON in the response text and removing the need for prompt-based hoping."},{"d":"prompt","diff":3,"q":"A summarization service parses the response text as JSON. For very long transcripts, the JSON string is occasionally cut off mid-object and the parser raises a decode error. Investigating, the engineer finds stop_reason is \"max_tokens\" on every one of the failing calls. What should the defensive parsing logic do?","o":["Catch the decode error, check stop_reason for max_tokens, and treat the response as incomplete","Ignore stop_reason and retry parsing with a lenient JSON parser that tolerates trailing commas","Lower max_tokens further so Claude is forced to produce shorter, safer completions","Treat every JSON decode error as a transient network issue and resend the identical request"],"a":[0],"m":false,"x":"Correct. stop_reason \"max_tokens\" is the documented signal that the response was cut off before completion; defensive code should branch on it and handle the response as incomplete rather than as malformed JSON."},{"d":"prompt","diff":3,"q":"A weather tool occasionally fails because an upstream API times out. The integration currently returns a bare tool_result of \"error\" with is_error: true, and Claude keeps repeating the same failing call in a loop. What change to the tool_result content would most likely stop the repeated failing calls?","o":["Replace the generic \"error\" text with a specific message describing the failure and a retry delay","Remove is_error entirely so Claude treats the repeatedly failing call as if it had succeeded","Stop returning any tool_result at all and let the conversation end without a response","Switch the tool from a client tool to a server tool so Anthropic retries it automatically"],"a":[0],"m":false,"x":"Correct. Instructive error messages that name the failure and suggest a concrete next step give Claude the context needed to adapt, such as waiting before retrying, instead of repeating the identical call."},{"d":"prompt","diff":3,"q":"A document-analysis feature needs Claude to output a nested tree of sections with arbitrary depth, which Structured Outputs cannot express because recursive schemas aren't supported. What is a recommended way to keep the output consistently parseable in this situation?","o":["Define custom XML tags for each section level and give Claude a worked example of the exact nesting","Ask Claude to output valid JSON without specifying a schema and hope it infers reasonable nesting","Flatten the requirement by asking Claude to produce a single paragraph summary instead of a tree","Retry the request repeatedly with the same prompt until the output happens to parse correctly"],"a":[0],"m":false,"x":"Correct. When guaranteed schema conformance isn't available for recursive structures, precisely specifying custom tags and providing a worked example is the documented prompt-engineering technique for increasing output consistency."},{"d":"prompt","diff":3,"q":"A dev team wants to force Claude Opus 4.8 to start its answer with an opening JSON brace by prefilling the assistant turn with \"{\". Testing shows this has no effect on Opus 4.8's output. Why does prefilling fail here, and what should the team use instead?","o":["Prefilling is not supported on Opus 4.8, so use Structured Outputs or system-prompt instructions instead","Prefilling only works when max_tokens exceeds 4096, so the team should raise that limit","Prefilling requires the assistant turn to end with a newline character, so append one","Prefilling only applies to server tools, so convert the workflow into a tool call instead"],"a":[0],"m":false,"x":"Correct. Prefilling is documented as unsupported on several current models including Claude Opus 4.8; the recommended alternatives are Structured Outputs on models that support it, or clear system-prompt instructions."},{"d":"prompt","diff":3,"q":"A content-moderation pipeline uses Structured Outputs to extract a risk_score field. For one batch of requests, response.stop_reason comes back as \"refusal\" and the returned text does not match the declared schema. What should the defensive parsing code do?","o":["Detect stop_reason \"refusal\" before validation and route those cases to a separate fallback path","Force json.loads on the refusal text since Structured Outputs supposedly guarantees conformance","Treat the refusal the same as a successful risk_score of zero and continue the pipeline","Retry the identical request in a tight loop until the schema happens to validate"],"a":[0],"m":false,"x":"Correct. Refusals are a documented edge case where the output may not match the schema; code should check stop_reason first and handle refusals through a distinct fallback path rather than assuming schema conformance."},{"d":"prompt","diff":3,"q":"A legal research assistant built on Claude answers case-law questions with confident, well-formatted citations, but a review finds several citations reference cases that do not exist. What is the most effective way to reduce this specific failure mode?","o":["Ground answers using Citations or retrieval so claims tie to verifiable source documents, not memory","Add a stronger system-prompt instruction telling Claude to always double-check its citations","Increase the extended-thinking budget so Claude reasons longer before the final citation list","Lower the temperature parameter so citations become more consistent across repeated runs"],"a":[0],"m":false,"x":"Correct. Fabricated citations are a hallucination risk from relying on parametric memory; grounding responses in retrieved or cited source documents ties each claim to something verifiable, directly addressing the failure mode."},{"d":"prompt","diff":3,"q":"After Claude returns two tool_use blocks in one turn, a developer's code sends back a user message containing a short text comment first (\"Here are the results:\") followed by the two tool_result blocks. The API rejects the request with a 400 error. What is the correct fix?","o":["Reorder the message so both tool_result blocks come first, with any text placed after them","Remove the text entirely, since tool_result messages can never include any text in that turn","Split the two tool_result blocks into separate user messages sent one after another","Move the text into a system message instead of keeping it in the user message"],"a":[0],"m":false,"x":"Correct. The API requires tool_result blocks to come first in the content array, with any accompanying text placed after them; reordering resolves the 400 error."},{"d":"prompt","diff":3,"q":"Claude calls a create_ticket tool but omits the required priority field. The engineering team wants Claude to self-correct rather than having the pipeline crash. What is the recommended way to handle this within the existing conversation?","o":["Return a tool_result with is_error: true describing the missing field so Claude retries with it supplied","Silently insert a default priority value into the tool input without informing Claude","Terminate the conversation and require the user to manually resubmit the entire request","Remove the priority field from the tool schema so it can never be reported missing again"],"a":[0],"m":false,"x":"Correct. Continuing the conversation with an is_error tool_result naming the missing parameter lets Claude retry the call with the field filled in, which is the documented recovery pattern for invalid tool calls."},{"d":"prompt","diff":3,"q":"A team defines a JSON schema for Structured Outputs requiring a \"sku\" string field with minLength: 8 and maxLength: 12, expecting the API to reject any output outside that range. The compiled schema unexpectedly permits shorter strings. What is the underlying cause?","o":["Structured Outputs doesn't support minLength/maxLength constraints, so validate those bounds separately","The schema needs a strict: true flag added at the top level to activate length enforcement","Length constraints only apply to array fields, not string fields, in Structured Outputs","The cached compiled grammar expired, so the length constraints stopped applying after 24 hours"],"a":[0],"m":false,"x":"Correct. String constraints such as minLength and maxLength are documented as unsupported JSON Schema features in Structured Outputs, so those bounds silently have no effect and must be checked in application code after the response."},{"d":"prompt","diff":3,"q":"A classification pipeline defines an enum field \"sentiment\" with allowed values \"positive\", \"negative\", \"neutral\" via Structured Outputs. Downstream code does an exact string match against these lowercase values, but occasionally the match fails even though the JSON parses successfully. What is the most likely cause and appropriate fix?","o":["The returned value may differ in capitalization, so normalize case before the downstream comparison","The JSON schema itself is invalid, so Structured Outputs is silently falling back to free text","The enum only enforces conformance on the first request per session, requiring later re-validation","A tool_result block was returned instead of a JSON output block, so the parser reads the wrong field"],"a":[0],"m":false,"x":"Correct. Enum casing is a documented edge case for Structured Outputs: values may differ in capitalization from the schema, so downstream code should normalize case rather than assume an exact literal match."},{"d":"prompt","diff":3,"q":"A financial-analysis feature enables extended thinking so Claude reasons step by step before giving a final recommendation. A reviewer notices the visible thinking block correctly identifies a risk, but the final answer omits mentioning that risk entirely. What should the defensive design account for?","o":["Thinking blocks aren't guaranteed to match the final answer, so validate the final answer directly","Extended thinking blocks are always identical to the final answer, so a mismatch signals an API bug","Enabling extended thinking removes the need for further validation, since reasoning already checks it","The mismatch means max_tokens was reached, so simply increasing the token budget fixes it"],"a":[0],"m":false,"x":"Correct. The visible reasoning in a thinking block is not a guarantee about the content of the final answer; defensive systems should treat the final answer as the artifact requiring independent validation, not assume it faithfully carries every point raised in reasoning."},{"d":"prompt","diff":3,"q":"A single prompt asks Claude to read a 40-page contract, extract obligations, classify risk, and draft a summary email in one pass. Output quality and structure vary significantly between runs. What restructuring is most likely to improve consistency?","o":["Split into separate prompts, one per subtask, so each gets Claude's full attention","Keep the single prompt but raise max_tokens so there's more room for all three subtasks","Ask Claude to think longer via extended thinking without changing the prompt structure","Add more emphatic wording like \"be consistent\" to the existing single prompt"],"a":[0],"m":false,"x":"Correct. Chaining prompts so each subtask (extraction, risk classification, drafting) is handled in its own focused pass is the documented technique for reducing inconsistency in complex, multi-part tasks."},{"d":"prompt","diff":3,"q":"An IT-support bot occasionally gives different password-reset steps to different users asking the same question, because it answers from general training knowledge rather than company-specific procedure. What change would most directly fix this consistency problem?","o":["Ground answers in a fixed knowledge-base entry retrieved per query, and check that entry first","Lower the temperature parameter to zero for every password-reset related request","Ask users to phrase their questions more precisely so there is less room for variation","Cache the very first response ever given and replay it for all future matching questions"],"a":[0],"m":false,"x":"Correct. Grounding responses in a fixed, retrieved knowledge-base entry and instructing Claude to check it first is the documented technique for consistent, contextually grounded answers to recurring questions."},{"d":"prompt","diff":3,"q":"An agent's response includes both a client tool_use block for get_customer_record and a server_tool_use block for web_search that has no result yet. The developer's code sends a tool_result only for get_customer_record, but also appends a follow-up text message in the same content array before that reply completes. The next API call fails. What is wrong with this handling?","o":["The reply must hold only the client tool's tool_result with no extra text, since the server call is unresolved","The server tool_use block requires its own is_error tool_result even though Anthropic runs it internally","The tools array must be omitted entirely once any server tool has been called in the conversation","Client and server tool calls can never appear together in the same assistant turn at all"],"a":[0],"m":false,"x":"Correct. When a server tool call in the same turn has no result block yet, the reply must contain only the tool_result blocks for the client tools; adding text ends the turn early and produces an error naming the unresolved server tool."},{"d":"prompt","diff":3,"q":"A team is designing defensive-parsing logic around Claude's outputs for a production pipeline. Which of the following signals should trigger the pipeline to treat a response as unreliable and route it to a fallback path rather than accepting it at face value? (Select all that apply)","o":["The API reports stop_reason \"refusal\", meaning safety constraints blocked normal completion","The API reports stop_reason \"max_tokens\" when a complete structured object was expected","The text parses as valid JSON but a required business field is missing from the object","The API reports stop_reason \"end_turn\" and the JSON parses without any validation errors","The response contains a tool_use block whose input already matches its declared schema","Extended thinking was enabled and produced a visible reasoning block before the answer"],"a":[0,1,2],"m":true,"x":"Correct. A refusal stop_reason is a documented case where output may not match the expected schema, so it should route to a fallback rather than be accepted as normal output."},{"d":"prompt","diff":3,"q":"Claude's response contains three tool_use blocks in a single turn: two client tools and one server tool that already includes its result inline. Which of the following describe correct construction of the next user message? (Select all that apply)","o":["Include a tool_result block for each client tool_use block, matched by its tool_use_id","Place both tool_result blocks before any plain text content within that same user message","Add a tool_result block for the server tool too, even though Anthropic already returned it inline","Include one combined tool_result block covering both client calls under a single shared tool_use_id","Add explanatory text after the tool_result blocks if any commentary for Claude is needed","Send the tool_result blocks in a new assistant-role message rather than a user-role message"],"a":[0,1,4],"m":true,"x":"Correct. Each client tool_use block needs its own matching tool_result, identified by tool_use_id, so Claude can associate each result with the correct call."},{"d":"prompt","diff":3,"q":"A team is building a feature on a model or schema combination where Structured Outputs cannot be used, for example an unsupported model, or a schema needing recursive nesting. Which of the following are valid prompt-engineering techniques to still increase output-format consistency? (Select all that apply)","o":["Precisely define the output format using custom XML tags or a JSON template in the prompt","Provide one or more worked examples showing the exact structure Claude should follow","Ground responses in a fixed retrieved context so repeated similar queries answer consistently","Remove all formatting instructions so Claude has maximum freedom to choose its own structure","Randomize the system-prompt wording on every request to prevent overfitting to one phrasing","Repeat the same instruction three times in one prompt instead of restructuring it into smaller steps"],"a":[0,1,2],"m":true,"x":"Correct. Precisely specifying the desired format with tags or a template is a documented technique for making Claude's output structure more consistent."},{"d":"prompt","diff":3,"q":"During testing, an agent occasionally calls a create_ticket tool while omitting the required priority field. Which of the following are appropriate ways to handle this within the conversation, according to recommended tool-use error handling? (Select all that apply)","o":["Return a tool_result with is_error: true naming the missing field so Claude retries with it supplied","Add strict: true to the tool definition so input is validated against the schema before your handler","Improve the tool's description so the priority-field requirement is stated more explicitly","Automatically terminate the session and require the user to start an entirely new conversation","Log the omission silently and proceed with ticket creation using a null priority value","Rewrite the schema to make priority optional so it can never be reported as missing again"],"a":[0,1,2],"m":true,"x":"Correct. Returning an is_error tool_result that describes the missing parameter lets Claude retry the call with the field filled in, which is the documented recovery pattern for invalid tool calls."},{"d":"sec","diff":3,"q":"A team is building a public-facing chatbot and wants to pre-screen user messages for jailbreak attempts before they reach the main conversation, without adding significant latency or cost. Which approach best fits this goal?","o":["Route each user message through a lightweight model call, such as Claude Haiku 4.5, constrained with structured outputs to return a simple harmful/not-harmful classification","Send every user message through the same large model used for the main conversation twice, once to classify intent and once to generate the actual reply","Store a denylist of banned words and reject any message containing one of those words before it is ever sent to a model for classification","Require users to complete a CAPTCHA before every message so that only verified humans can submit prompts to the chatbot"],"a":[0],"m":false,"x":"Correct. A harmlessness screen using a lightweight model with structured output constraints is the pattern Anthropic recommends for fast, low-cost pre-screening of user input."},{"d":"sec","diff":3,"q":"After a tool call returns data to Claude, a developer needs to give Claude a follow-up instruction about how to use that data. Where should this instruction be placed to avoid it being ignored or flagged as a possible injection attempt?","o":["In a user turn sent after the tool_result block, since Claude treats tool_result content itself as untrusted data rather than as directives","Appended as an extra text field inside the same tool_result block, right after the returned data, so both are delivered in a single message","Embedded as a comment within the tool's raw output string before the tool response is returned to the conversation","Inside the tool's description field, so the instruction is always attached to that tool no matter what data it returns"],"a":[0],"m":false,"x":"Correct. Anthropic's guidance is to send follow-up instructions in a user turn that follows the tool_result block, since Claude is trained to treat tool_result content as untrusted data rather than commands."},{"d":"sec","diff":3,"q":"A team is deploying an agent that processes untrusted third-party documents and has access to internal APIs that can send emails and transfer funds. To limit the damage a successful prompt injection could cause, what should the team do when configuring the agent's capabilities?","o":["Apply the principle of least privilege by scoping the agent's tool access narrowly, excluding secrets and sensitive actions it does not need for the task","Grant the agent access to every internal API up front so that engineers do not need to update its permissions as new document-processing features are added","Give the agent a single shared service account with administrator rights, since narrower scoping would slow down future feature development","Disable all tool access entirely and have a human manually complete every action the agent would otherwise have performed"],"a":[0],"m":false,"x":"Correct. Limiting an agent's access to sensitive data and actions under the principle of least privilege is the recommended way to reduce the blast radius of a successful injection."},{"d":"sec","diff":3,"q":"An agent has been in production for six months processing untrusted web content. The security team wants an ongoing process, not a one-time check, to catch injection attempts that slip past current defenses. What should this ongoing process consist of?","o":["Continuously analyze agent outputs for signs of successful injection, and use those findings to iteratively refine prompts, validation, and filtering strategies","Re-run the original pre-launch red-team test suite once a year and treat an unchanged pass rate as sufficient ongoing assurance","Freeze the system prompt and screening logic permanently once it passes the initial security review, since further changes introduce more risk than they remove","Rotate the model version used by the agent every quarter, since newer model releases alone are assumed to close any injection gaps automatically"],"a":[0],"m":false,"x":"Correct. Continuous monitoring of outputs for successful injection, feeding back into refined prompts and filtering, is the documented ongoing practice."},{"d":"sec","diff":3,"q":"A developer wants to keep the Bash tool available to Claude for most commands but ensure that destructive deletion commands are always blocked, even if the session later switches to `bypassPermissions`. Which configuration achieves exactly this?","o":["`disallowed_tools=[\"Bash(rm *)\"]`, which keeps Bash available but denies calls matching `rm *` in every permission mode, including `bypassPermissions`","`disallowed_tools=[\"Bash\"]`, which removes the Bash tool definition entirely so Claude can no longer see or attempt any Bash command","`allowed_tools=[\"Bash\"]` combined with `permission_mode=\"default\"`, which lets every Bash call reach the `canUseTool` callback for manual review","`permission_mode=\"acceptEdits\"`, which auto-approves filesystem commands like `rm` while still requiring a prompt for other Bash invocations"],"a":[0],"m":false,"x":"Correct. A scoped deny rule like `Bash(rm *)` keeps the Bash tool usable while blocking only the matching destructive pattern, and deny rules apply even in `bypassPermissions` mode."},{"d":"sec","diff":3,"q":"A main agent is configured with `permission_mode=\"bypassPermissions\"` and spawns a subagent with a narrower, safety-focused system prompt to review untrusted code. What is the security implication of this setup?","o":["The subagent inherits `bypassPermissions` from the parent and cannot have that mode overridden per subagent, so it also gets full, autonomous system access despite its narrower prompt","The subagent automatically runs in `default` mode instead, since subagents always start with the most restrictive permission mode available regardless of the parent's setting","The subagent's narrower system prompt overrides the inherited permission mode, effectively restricting it to only the tools its prompt mentions","Permission mode has no effect on subagents at all, since subagents are sandboxed into a separate process with its own independent tool access"],"a":[0],"m":false,"x":"Correct. When the parent uses `bypassPermissions`, `acceptEdits`, or `auto`, subagents inherit that mode and it cannot be overridden per subagent, so a narrowly-prompted subagent still gets full autonomous access unless an explicit ask rule forces a prompt."},{"d":"sec","diff":3,"q":"A support agent built on Claude has access to a customer database tool and forwards conversation transcripts to a third-party analytics vendor for quality monitoring. Transcripts routinely contain customers' full names, emails, and account numbers. Which of these actions should the team take to prevent unnecessary PII exposure? (Select all that apply.)","o":["Redact or mask personally identifiable information in the transcripts before they leave the system, sending the vendor only the fields it actually needs","Apply the same PII minimization to data logged internally for debugging, not just to data sent to the external vendor","Send the full unredacted transcripts as-is, since the analytics vendor's contract already covers general data handling and confidentiality obligations","Compress the transcripts before sending them, since compression is treated as equivalent to redaction for the purpose of protecting personal data","Review which fields the analytics vendor's quality-monitoring use case genuinely requires before deciding what to include in each transcript export","Ask Claude to verbally warn the customer at the start of each chat that their data might be shared externally, then proceed without further changes"],"a":[0,1,4],"m":true,"x":"Correct. Minimizing and redacting PII before it leaves the system to a third party is a core data leakage prevention practice, sending only the fields actually needed for the stated purpose."},{"d":"sec","diff":3,"q":"A developer is deploying a server-side application that calls the Claude API. Which practice best protects the API key's confidentiality and supports proper authentication for the deployed service?","o":["Store the API key as a server-side environment variable and keep it out of client-side bundles, version control, and logs","Embed the API key directly in the frontend JavaScript bundle so the browser can call the Claude API without a backend proxy","Commit the API key to the private application repository so every engineer on the team can run the service locally without setup","Print the API key to application logs at startup so operators can quickly confirm which credential the running service is using"],"a":[0],"m":false,"x":"Correct. Keeping the API key as a server-side environment variable, out of client bundles, source control, and logs, is standard practice for protecting API credentials and enforcing that only the backend authenticates to the API."},{"d":"sec","diff":3,"q":"A team is hardening a document-processing agent against indirect prompt injection embedded in third-party files. Which of these are practices Anthropic recommends for this threat model? (Select all that apply.)","o":["Deliver third-party content only inside tool_result blocks rather than in the system prompt or plain user text","JSON-encode untrusted strings so quotes or tags in the payload cannot be used to break out into an instruction context","State explicitly in the system prompt that tool-returned content is untrusted data that must not override the user's original request","Concatenate untrusted document text directly into the system prompt so Claude always keeps it in view across the whole session","Grant the agent broad, unscoped tool access up front so it can act flexibly no matter what a document later turns out to need","Trust content more readily once a user has submitted several documents without previously triggering a refusal"],"a":[0,1,2],"m":true,"x":"Correct. Delivering untrusted content only inside tool_result blocks is a core structural defense that preserves Claude's trained skepticism toward that content."},{"d":"sec","diff":3,"q":"A platform team is designing the permission evaluation flow for a new internal agent framework and wants to correctly model how the Agent SDK resolves a tool request. Which of these statements about that evaluation order are accurate? (Select all that apply.)","o":["Hooks run first, and a hook can deny a call outright even when the active permission mode is `bypassPermissions`","Deny rules are checked before the permission mode is applied, so a matching deny rule blocks a call even under `bypassPermissions`","Allow rules are checked before the permission mode is applied, so any allow rule always overrides a stricter mode like `dontAsk`","The `canUseTool` callback is the final step, reached only if no earlier step, hooks, deny rules, ask rules, mode, or allow rules, resolved the request","In `dontAsk` mode, a request that reaches the `canUseTool` step is approved by default rather than denied","Ask rules always take priority over deny rules, so a call matching both an ask rule and a deny rule is still routed to the callback for confirmation"],"a":[0,1,3],"m":true,"x":"Correct. Hooks run first in the evaluation order, and a hook deny applies even in `bypassPermissions` mode."},{"d":"sec","diff":3,"q":"A fintech company is deploying a multi-tenant Claude-powered advisor that reads account data for one customer per session and can place trades through an internal API. Which combination of practices best supports authentication, authorization, and confidentiality across tenants? (Select all that apply.)","o":["Scope each session's tool access so it can only read and act on the data belonging to the authenticated customer for that session","Screen inbound account notes and support messages for injected instructions before they are returned to Claude as tool results","Issue one shared service credential for the trading API that every customer session reuses, to simplify credential rotation","Log full account numbers and portfolio balances in plaintext application logs so support staff can search history freely","Require a fresh authorization check on the backend before executing any trade action the agent requests, rather than trusting the agent's own judgment alone","Let a session continue reading a different customer's data mid-conversation if the agent decides it is contextually relevant to the current advice"],"a":[0,1,4],"m":true,"x":"Correct. Scoping each session's access to only the authenticated customer's own data is core to per-tenant authorization and confidentiality."},{"d":"sec","diff":3,"q":"A team is building a customer support agent that lets Claude call a `search_tickets` tool. They want to block adversarial users from convincing the assistant to ignore its support-only scope and instead answer unrelated requests. Before the main conversation turn is sent to Claude, they want a cheap, fast check that flags obviously abusive input. What should they implement?","o":["A lightweight model call that classifies the incoming user message with a constrained structured output before it reaches the main conversation, so abusive input is filtered pre-emptively","A regular expression list of banned words applied to the final assistant response only, since screening after generation catches every abusive pattern the input might have contained","A second full-size Claude call that repeats the entire conversation history at maximum thinking effort, since more reasoning always produces a more reliable safety classification","A instruction embedded inside the `search_tickets` tool_result content telling Claude to refuse off-topic requests, since tool_result content carries the same authority as the system prompt"],"a":[0],"m":false,"x":"Correct. A harmlessness screen using a lightweight model (e.g. Claude Haiku) with structured output to classify input before it reaches the main conversation is the documented pattern for cheap, fast pre-screening of user input."},{"d":"sec","diff":3,"q":"An organization admin is provisioning access for a new hire who will only need to generate and rotate API keys for their team's workspace, without managing other organization members or billing. Which organization-level role should be assigned to satisfy least privilege?","o":["developer, since it grants Workbench access and API key management without member or billing management permissions","admin, since it is the only role that includes any API key management capability at the organization level","billing, since managing API keys is bundled with billing detail management in the role hierarchy","user, since the base role is sufficient for any API-related task in a Claude Console organization"],"a":[0],"m":false,"x":"Correct. The developer role can use Workbench and manage API keys but does not include user management or billing management, matching the least-privilege requirement described."},{"d":"sec","diff":3,"q":"A platform team is automating onboarding and offboarding of contractors who need programmatic, non-human access to the Claude API scoped to specific workloads, without using long-lived personal API keys. Which Admin API concept is designed for this non-human identity use case?","o":["Service accounts authenticated through Workload Identity Federation, mapped to specific scopes via federation rules","Personal Admin API keys shared across the contractor team, since Admin API keys are designed for multi-user sharing","Organization invites with the admin role, since invites are the only mechanism for granting programmatic access","The billing role, since it is the role Anthropic designates for automated, non-human workloads"],"a":[0],"m":false,"x":"Correct. Service accounts are the non-human identities that Workload Identity Federation tokens act as, and federation rules map issuer tokens to service accounts and scopes, which is the documented mechanism for scoped programmatic access without long-lived personal keys."},{"d":"sec","diff":3,"q":"A healthcare organization with a HIPAA-enabled Claude API organization sends a request that includes the code execution tool. The API responds with a 400 invalid_request_error stating the feature is not available for HIPAA-regulated organizations without Zero Data Retention. What is the most appropriate immediate remediation for this specific request?","o":["Remove the code execution tool from the request and use only features listed as eligible for HIPAA readiness in the feature eligibility table","Retry the identical request with a higher max_tokens value, since the error is caused by insufficient token budget for the tool call","Switch the request to a different, unrelated organization ID without a BAA in place so the feature restriction no longer applies","Ignore the error and resubmit the same request repeatedly, since HIPAA feature restrictions are only advisory warnings rather than enforced blocks"],"a":[0],"m":false,"x":"Correct. The documented HIPAA error handling behavior is that the API enforces feature restrictions automatically and returns a 400 listing non-eligible features; the resolution is to remove those features and use ones eligible under HIPAA readiness."},{"d":"sec","diff":3,"q":"A team wants their financial-report drafting assistant to explicitly retract any claim it cannot support with evidence from the source documents, rather than leaving unsupported claims in the final output. Which instruction pattern achieves this documented behavior?","o":["Instruct Claude to find a supporting quote for each claim after drafting, and to remove any claim for which no supporting quote can be found","Instruct Claude to mark uncertain claims in bold text so a human reviewer can decide later whether to keep or remove them","Instruct Claude to cite external websites for every claim instead of the provided source documents, since external sources are inherently more reliable","Instruct Claude to avoid making any claims at all in the report, since any generated claim carries equal hallucination risk regardless of sourcing"],"a":[0],"m":false,"x":"Correct. The documented citation-verification technique has Claude find a supporting quote for each claim after generating it, and retract any claim lacking a supporting quote, which is exactly the self-retraction behavior described."},{"d":"sec","diff":3,"q":"An enterprise chatbot deployment keeps producing inconsistent formatting across similar customer queries, making downstream parsing unreliable. The team wants guaranteed schema conformance for structured fields like sentiment and priority rather than best-effort prompt instructions. Which capability should they adopt?","o":["Structured outputs with a JSON schema passed via output_config, which guarantees schema-conforming responses rather than relying on prompt-level formatting instructions alone","A longer system prompt that repeats the desired JSON format three times in different wording, since repetition is the documented mechanism for guaranteeing format compliance","A higher extended thinking budget, since more reasoning tokens are the documented mechanism for guaranteeing output schema conformance","Manual regex post-processing of every response to reformat it into the desired schema after generation, since Claude has no built-in mechanism for schema conformance"],"a":[0],"m":false,"x":"Correct. Structured outputs, configured via a JSON schema, are documented as the feature that guarantees schema conformance, explicitly recommended over prompt-engineering techniques when guaranteed compliance is required."},{"d":"sec","diff":3,"q":"An organization is setting up governance for a new Claude API deployment and wants controls that map to identity and access management best practices. Which of the following are documented Anthropic Admin API / platform capabilities that support least-privilege access management? (Select all that apply.)","o":["Organization-level roles (user, claude_code_user, developer, billing, admin) with progressively broader permissions","Workspace-scoped roles that limit a member's permissions to a specific workspace rather than the whole organization","API key status management, including deactivating a key and tracking its expires_at timestamp for rotation","Service accounts mapped to specific scopes through federation rules for non-human, programmatic identities","A single shared Admin API key used by every team member to simplify credential management across the organization"],"a":[0,1,2,3],"m":true,"x":"Correct. Anthropic documents five organization-level roles with progressively broader permissions, from user (Workbench only) up to admin (full management including users)."},{"d":"sec","diff":3,"q":"A product manager wants Claude to avoid fabricating figures when analyzing an ambiguous merger and acquisition report, since a confident but wrong statement could mislead the deal team. The team is assembling a set of documented Anthropic techniques for the drafting prompt. Which of the following are documented hallucination-reduction techniques they should include? (Select all that apply.)","o":["Explicitly instruct Claude that it has permission to say it doesn't have enough information or is unsure, rather than requiring a confident answer in every case","For the long report, ask Claude to extract direct, word-for-word quotes relevant to the task before performing the analysis, and base the analysis only on those quotes","After drafting, have Claude find a supporting quote for each claim and retract any claim for which no supporting quote can be found","Increase the sampling temperature so Claude generates more diverse phrasing options for each figure, then pick the most detailed option","Instruct Claude to rely on its general training knowledge of typical M&A deal structures instead of the provided report whenever the report is ambiguous"],"a":[0,1,2],"m":true,"x":"Correct. Anthropic's basic hallucination-minimization guidance is to explicitly give Claude permission to express uncertainty or admit insufficient information, which drastically reduces false information in outputs."},{"d":"sec","diff":3,"q":"A platform team wants to prevent Claude Code from ever running `rm -rf` against production paths, regardless of what the model decides to do. Which hook event should they use to guarantee the command never executes?","o":["PreToolUse, because it fires before the tool call executes and can deny it","PostToolUse, because it fires after the command runs and can roll back the result","Stop, because it fires when Claude finishes responding and can flag the transcript","Notification, because it fires when Claude Code sends a status message about the command"],"a":[0],"m":false,"x":"Correct. PreToolUse fires before the tool call runs and supports permissionDecision: deny, which stops the command from ever executing."},{"d":"sec","diff":3,"q":"A security engineer writes a command-hook script for PreToolUse that inspects `tool_input.command` and, upon detecting a dangerous pattern, prints an explanation to stderr and exits without emitting any JSON. Which exit code causes Claude Code to block the tool call using that stderr message?","o":["Exit code 2, which is treated as a blocking error and feeds stderr back to Claude","Exit code 0, which always allows the tool call to proceed regardless of stderr","Exit code 1, which is reserved exclusively for malformed JSON output","Any nonzero exit code, since Claude Code treats all nonzero codes identically as blocking"],"a":[0],"m":false,"x":"Correct. Exit code 2 signals a blocking error: stdout is ignored, stderr is surfaced to Claude, and the pending tool call is blocked."},{"d":"sec","diff":3,"q
