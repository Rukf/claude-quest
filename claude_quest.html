s short for specific capability gaps.","Begin implementation with the largest available context-window model regardless of cost, since email tagging requires processing long threads.","Begin implementation with a model chosen at random from the currently active model list, then standardize on whichever tests best after launch."],"a":[1],"m":false,"x":"Correct -- Anthropic recommends starting with a fast, cost-effective model like Haiku for high-volume, latency-sensitive, cost-sensitive use cases, and upgrading only if specific capability gaps appear."},{"d":"apps","diff":3,"q":"A research team is building a system that performs multi-step scientific reasoning over dense technical papers, where accuracy outweighs cost and latency considerations. Following Anthropic's guidance for choosing a starting model, what is the recommended approach?","o":["Implement with Claude Haiku 4.5 for its speed, and rely entirely on prompt engineering rather than model choice to reach the needed accuracy.","Implement with whichever model has the lowest price per million tokens, since evaluation costs scale directly with model choice, not accuracy.","Implement with a randomly rotating mix of active models per request so no single model's limitations dominate the reasoning output.","Implement with Claude Opus 4.8, optimize prompts for it, and consider lowering effort or downgrading models later as workflow optimization allows."],"a":[3],"m":false,"x":"Correct -- for complex reasoning tasks where accuracy outweighs cost, Anthropic recommends starting with the most capable model, optimizing prompts for it, and only later considering lower effort or a cheaper model as workflows mature."},{"d":"apps","diff":3,"q":"A team's Claude Opus 4.8-powered coding agent is meeting quality expectations but running slower and costlier than the team would like for routine, lower-stakes tasks. Rather than switching to a different model, what does Anthropic recommend evaluating first?","o":["Tuning the effort parameter to a lower level for routine tasks, since it trades intelligence for latency and cost within the same model.","Disabling the anthropic-version header on requests, since that header alone determines how much compute a request consumes.","Switching every request to the Message Batches API, since batch processing always reduces both latency and cost for interactive tasks.","Requesting a custom rate limit increase from support, since higher rate limits directly reduce the per-request latency of a single call."],"a":[0],"m":false,"x":"Correct -- Anthropic recommends tuning the effort parameter as a lever that trades intelligence for latency and cost within a single model, often before switching models entirely."},{"d":"apps","diff":3,"q":"A team migrates their production application from an older Claude model to Claude Opus 4.8 and preserves their existing request code, which sets temperature=0.2 on every call for consistency. After the migration, calls start failing with a 400 error. What is the most likely cause, and what should they do?","o":["Claude Opus 4.8 requires temperature to be set explicitly on every single call and rejects any request that omits the parameter; add one to every request.","Claude Opus 4.8 removed support for the messages array entirely; the team must rewrite every request using the older completions-style format instead.","Claude Opus 4.7 and later, including Opus 4.8, reject a non-default temperature with a 400 error since the parameter is now deprecated; omit it and rely on prompting instead.","Claude Opus 4.8 requires an anthropic-version header value that has not yet been published by Anthropic; the team must wait for a new version release."],"a":[2],"m":false,"x":"Correct -- temperature, top_p, and top_k are deprecated on Claude Opus 4.7 and later, including Opus 4.8, and setting them to a non-default value returns a 400 error; the fix is to omit them and guide behavior through prompting."},{"d":"apps","diff":3,"q":"A company deploys the same Claude-powered application through the Claude API directly and also through Amazon Bedrock for a subset of customers with region requirements. Anthropic announces a deprecation and retirement date for a model on its own platform. What should the team check before assuming their Bedrock deployment is affected on the same date?","o":["Whether the Bedrock deployment uses the same anthropic-version header, since header version alone determines each platform's retirement date.","Whether the Bedrock deployment has extended thinking enabled, since that setting determines whether Amazon applies Anthropic's retirement dates.","Nothing further, since Amazon Bedrock always retires models on the exact date Anthropic retires them on the Claude API, with no exceptions.","Whether Amazon Bedrock has published its own retirement schedule, since partner-operated platforms set deprecation timelines independent of Anthropic-operated ones."],"a":[3],"m":false,"x":"Correct -- retirement dates published for Anthropic-operated platforms apply to the Claude API, Claude Platform on AWS, and Microsoft Foundry; partner-operated platforms like Amazon Bedrock and Google Cloud set their own schedules, so the team must check Bedrock's own model table."},{"d":"apps","diff":3,"q":"An agent built with the Claude Agent SDK reads an authentication module in one query call, and the team wants a second, later query call to reference 'it' meaning that same module without re-reading or re-explaining context. What should they capture and reuse from the first call to accomplish this?","o":["Capture the session_id from the SystemMessage of type 'init' during the first query, then pass it as the resume option on the second query call.","Capture the full text of every message from the first query and re-send it as the prompt string prefix on the second query call.","Capture the file contents read during the first query and hardcode them into the system prompt used for the second query call.","Capture the tool_use_id from the first query's Read tool call and pass it as the model parameter on the second query call."],"a":[0],"m":false,"x":"Correct -- capturing the session_id from the init SystemMessage and passing it to the resume option lets the second query continue with full context from the first, including which file was read."},{"d":"apps","diff":3,"q":"A platform team is building an internal wiki page summarizing Anthropic's model lifecycle terminology so engineers know how to interpret status labels before they affect production traffic. Which of the following statements correctly describe how Anthropic defines model lifecycle stages? (Select all that apply.)","o":["A model marked 'Active' receives a permanent guarantee that it will never be deprecated or retired at any point in the future.","A model marked 'Legacy' will no longer receive updates and may be deprecated in the future, but requests to it still succeed today.","A model marked 'Deprecated' immediately stops accepting new requests the moment the deprecation notice is published.","A model marked 'Retired' is no longer available for use, and requests to it will fail.","A model marked 'Legacy' behaves identically to 'Retired,' and requests to it fail immediately upon reaching that status.","A model marked 'Deprecated' is still functional, but Anthropic has assigned it a recommended replacement and a retirement date."],"a":[1,3,5],"m":true,"x":"Correct -- 'Legacy' means the model no longer receives updates and may be deprecated later, but it remains functional until then."},{"d":"apps","diff":3,"q":"A production engineering team just received a deprecation notice for a model powering a customer-facing workflow, with a retirement date several months away. Which of the following are best practices Anthropic recommends for handling this situation? (Select all that apply.)","o":["Export usage data from the Claude Console Usage page to confirm exactly where the deprecated model is still being called in production.","Wait until the exact retirement date to make any code changes, since requests to deprecated models continue working normally until that date.","Test the application thoroughly against the recommended replacement model well before the retirement date, rather than waiting until the deadline.","Disable the anthropic-version header on all requests, since deprecated models bypass normal API versioning rules until they are retired.","Update the application to the recommended replacement model as soon as practical, rather than continuing to run on the deprecated model until forced.","Ignore the deprecation notice unless the application's error rate visibly increases, since deprecated models behave identically to active ones."],"a":[0,2,4],"m":true,"x":"Correct -- exporting the Usage page CSV is the recommended way to locate every instance where a deprecated model is still being called."},{"d":"apps","diff":3,"q":"A team is designing the evaluation suite for a new Claude-powered application before shipping it to production. Which of the following reflect Anthropic's recommended evaluation design principles? (Select all that apply.)","o":["Restrict the evaluation set exclusively to the easiest, most common cases so the measured pass rate stays as high as possible before shipping.","Reuse the exact same cases used to iterate on the prompt as the final validation set, since gathering a separate held-out set adds no value.","Build test cases that mirror real-world task distributions, including edge cases like ambiguous input, typos, and irrelevant or nonexistent data.","Grade model outputs using a separate model instance from the one generating them, rather than having a single model grade its own outputs.","Keep evaluation criteria intentionally vague and qualitative, since quantifying subjective qualities like tone produces misleading precision.","Prioritize a larger volume of automatically graded test cases over a small number of cases that require manual, hand-graded review."],"a":[2,3,5],"m":true,"x":"Correct -- Anthropic recommends task-specific test cases that mirror real-world distributions and explicitly include edge cases like ambiguous input, typos, and irrelevant data."},{"d":"apps","diff":3,"q":"A partner integrations team is deciding which platform capabilities are safe to build critical production workflows around versus which need contingency plans. Which of the following statements correctly describe Anthropic's feature availability classifications? (Select all that apply.)","o":["A 'Beta' feature is automatically promoted to 'Generally available' status after exactly 90 days, regardless of feedback received.","A 'Generally available' feature is stable, fully supported, recommended for production use, and covered by standard API versioning guarantees.","A 'Deprecated' feature is still functional, but Anthropic provides a migration path and a removal timeline for it.","A feature must pass through every classification stage in order, from Beta through GA and Deprecated, before it can reach Retired.","A 'Beta' feature may change significantly or be discontinued based on feedback, and is not guaranteed for ongoing production use.","A 'Retired' feature remains fully functional but is simply no longer documented on the public developer site."],"a":[1,2,4],"m":true,"x":"Correct -- 'Generally available' is defined as stable, fully supported, recommended for production use, and covered by standard API versioning guarantees."},{"d":"apps","diff":3,"q":"A team iterates on a Claude prompt by repeatedly running it against the same 200 example cases they built at the start of the project, tuning wording until scores on those 200 cases look excellent, then shipping to production without further testing. Two weeks later, real-world accuracy is far below what their test scores predicted. What is the most likely cause?","o":["They used an LLM-based grading method to score prompt outputs on the iteration set, causing the prompt to tailor its responses to the grader's preferences rather than to real-world accuracy.","They tuned the prompt only against the cases used for iteration and never validated on a separate held-out set, so the prompt overfit to those specific examples.","They defined success criteria using the SMART framework for their 200 examples, allowing them to optimize the prompt toward those precise metrics while overlooking real-world variability.","They ran evaluations with only 200 examples that all came from the same narrow distribution, so the prompt overfit to those cases and failed on unseen varieties."],"a":[1],"m":false,"x":"Correct. By tuning only on the same 200 examples used for iteration and never validating on unseen data, the prompt overfit to those specific cases, leading to inflated scores that did not reflect actual performance in production."},{"d":"agents","diff":3,"q":"A team built a multi-step orchestrator with several delegated worker calls to answer straightforward FAQ questions that a single well-crafted prompt could already answer accurately. Latency and cost have both increased without any gain in answer quality. Per Anthropic's guidance on building effective agents, what should the team do first?","o":["Add an additional evaluator-optimizer loop to the orchestrator that iteratively critiques and refines each answer using a separate LLM call, ensuring higher accuracy for the FAQ responses.","Remove the orchestration and re-test with a single, well-optimized LLM call, adding multi-step complexity only if that simpler approach measurably underperforms.","Convert the orchestrator into a multi-agent team setup where each independent agent specializes in a different FAQ category and operates in parallel, with a coordinator merging the responses.","Keep the existing orchestrator unchanged, as multi-step delegation with separate worker calls ensures greater reliability for FAQ responses than a single LLM call could."],"a":[1],"m":false,"x":"Correct. Anthropic's guidance is to start with the simplest solution, optimizing a single LLM call first, and only add multi-step complexity if that simpler approach measurably underperforms. Since a well-crafted prompt already answers the FAQs accurately, removing the orchestration reduces cost and latency without compromising quality."},{"d":"agents","diff":3,"q":"A team is debugging an intermittent connection drop and has several competing theories about the cause. They want multiple independent investigators to each pursue a different theory, share intermediate findings with each other as they go, and actively try to disprove one another's conclusions before converging on an answer. Which architecture supports this, and why does a simpler alternative fall short?","o":["Use subagents, since subagents can message each other directly to debate competing theories and challenge findings, so multiple investigators can exchange intermediate results before the main conversation sees a conclusion.","Use parallelization by voting, since running the same investigation prompt several times and then aggregating the answers creates a debate where different responses challenge each other's conclusions.","Use an agent team, since teammates work in independent context windows and message each other directly, while subagents can only report results back to the main conversation and never to each other.","Use a single evaluator-optimizer loop, since one LLM can generate multiple competing theories and a second LLM critically evaluates each, creating a debate-like process that mimics multiple investigators but uses only two model calls."],"a":[2],"m":false,"x":"Correct. In an agent team, each teammate works in an independent context window and can message other teammates directly. This allows multiple investigators to pursue different theories, share intermediate findings, and actively challenge each other’s conclusions before converging on an answer."},{"d":"agents","diff":3,"q":"A team is building a research assistant that receives an open-ended question, then decides on its own -- turn by turn -- which searches to run, which sources to open, and when it has gathered enough to answer. The number of steps isn't known ahead of time, and each step's choice depends on what the previous tool call returned. Which architecture fits, and what should the team keep in mind?","o":["Build a prompt-chaining workflow with a fixed number of sequential search steps, and rely on the chain's predefined structure to ensure thorough research without needing dynamic re-planning.","Build a routing workflow that classifies the question first and sends it down one of a few predefined fixed research pipelines, and pre-configure each pipeline's tool set to avoid per-step decisions.","Build an orchestrator-workers system with a predetermined, fixed list of subtasks handed to workers before the question is inspected, and assign each worker a fixed tool set based on the predetermined subtasks.","Build an autonomous agent that directs its own tool use based on environmental feedback in a loop, and invest in clear tool design since the loop can compound errors over many turns."],"a":[3],"m":false,"x":"Correct. This matches an autonomous agent that directs its own tool use in a loop based on environmental feedback, aligning with the need for dynamic, per-step decisions. Investing in clear tool design is critical, as errors can compound over many turns in such a loop."},{"d":"agents","diff":3,"q":"A team wants an automated reviewer that can read and search code to flag issues but must never modify files or run shell commands, even by accident, since it will run against untrusted branches. Which configuration achieves this?","o":["Define a subagent with a tools allowlist limited to Read, Grep, and Glob, so Write, Edit, and Bash are unavailable to it regardless of what it's asked to do.","Define a subagent without a tools field, so it inherits Read, Grep, and Glob but automatically denies Write and Edit on untrusted branches even for automated review tasks.","Run the reviewer as a routing workflow that delegates code search and flagging to subagents, preventing direct access to Write, Edit, and Bash when analyzing untrusted branches.","Run the reviewer as an orchestrator-workers system with workers restricted to a tools allowlist of Read, Grep, and Glob, so they cannot use Write, Edit, or Bash on untrusted branches."],"a":[0],"m":false,"x":"Correct. Defining a subagent with a tools allowlist limited to Read, Grep, and Glob ensures those are the only tools available. Write, Edit, and Bash are completely excluded, so the subagent cannot modify files or run commands under any circumstances."},{"d":"agents","diff":3,"q":"A team is considering replacing a well-tested, fixed-path workflow in production with a fully autonomous agent that decides its own steps at runtime. Which of the following are realistic tradeoffs they should weigh before making that change? (Select all that apply.)","o":["Replacing the fixed-path workflow with an autonomous agent guarantees higher accuracy on every task since the agent can adapt its reasoning to each request.","Costs can rise because an autonomous agent may take a variable, sometimes larger, number of LLM calls and tool turns to finish a task.","An autonomous agent removes the need to carefully design and document the tools it will use, since the agent can discover and invoke tools on the fly.","Errors made early in the agent's run can compound across later turns since each step builds on the model's own prior decisions.","An autonomous agent will always complete tasks with lower latency than the fixed-path workflow it replaces, since the agent can skip intermediate steps.","The execution path becomes less predictable, which can complicate testing, auditing, and reasoning about exactly what will happen for a given input."],"a":[1,3,5],"m":true,"x":"Correct. An autonomous agent may take a variable and sometimes larger number of LLM calls and tool turns to finish a task, which can raise costs compared to a fixed-path workflow. This variability makes cost prediction more difficult."},{"d":"agents","diff":3,"q":"A team is scoping a coding assistant that must fix failing tests in an unfamiliar repository. The number of files to change, the order of edits, and whether a fix will work can't be predicted in advance, but each attempt can be checked by re-running the test suite. Per Anthropic's guidance on when to use agents versus workflows, what should the team build?","o":["A prompt chain that follows a static plan of edit steps derived from an initial analysis, applying each change and running the test suite, without adapting the plan based on intermediate results.","A single parallelized voting call that generates several candidate patches simultaneously and then applies the patch that appears most frequently in the outputs, without any iterative refinement.","An agent that autonomously directs its own tool use and stops based on test results since the task is open-ended but progress can be verified against ground truth.","A routing workflow that first classifies the failure type and then sends the test failure through one of several fixed repair pipelines that apply predetermined edit steps without adaptation."],"a":[2],"m":false,"x":"Correct. Anthropic recommends agents for open-ended tasks where the path cannot be predicted but progress is verifiable. Here, an agent can autonomously decide which files to edit and tools to invoke, stopping when the test suite passes as ground truth."},{"d":"apps","diff":3,"q":"A financial services company must ensure that all Claude inference for its workload physically runs within the United States for regulatory reasons, while staying on its existing Claude API contract. Which feature addresses this requirement?","o":["Data residency confines inference to US.","Zero Data Retention restricts inference to US.","Citations locks inference to US regions.","Structured outputs enforces inference in US."],"a":[0],"m":false,"x":"Correct. Data residency allows you to control where model inference runs using the `inference_geo` parameter, such as specifying \"us\" for the United States. This directly satisfies the requirement to physically confine inference processing to the US."},{"d":"agents","diff":3,"q":"A developer runs a custom endpoint-finder subagent that catalogs API endpoints, and later wants to ask a follow-up question that reuses the same subagent's prior analysis rather than starting its search over. What must the developer capture from the first query to do this?","o":["Only the subagent's name, which when passed in the agents parameter of the follow-up query automatically links to the existing session and retrieves the entire prior endpoint catalog.","The full text of the subagent's final message, then submit that text as the prompt in the follow-up query to resume and reuse all previous endpoint findings.","The parent_tool_use_id from the subagent's messages, then pass that identifier in the second query to resume the subagent with its prior session and all endpoint data.","Capture the session_id from the first query messages and the agentId from the Agent tool result, then pass resume with the session_id in the second query."],"a":[3],"m":false,"x":"Correct. Resuming a subagent requires both the session_id to identify the session and the agentId from the Agent tool result to reference the subagent. By passing resume with the session_id in the second query, the subagent retains its prior context and endpoint findings."},{"d":"agents","diff":3,"q":"A long-running research agent needs to preserve findings across many separate sessions without re-loading everything it has ever learned into context at the start of each new task. Which Anthropic capability is designed specifically for this, letting the agent record findings as files and read them back only when needed?","o":["The memory tool, which lets Claude create, read, update, and delete files in a memory directory client-side, retrieves relevant content just-in-time rather than loading everything upfront.","Server-side compaction automatically summarizes completed research sessions into durable summary files on the server, loading only relevant summaries at the start of each new task for referencing past findings.","The clear_tool_uses context editing strategy strips old tool outputs from the active prompt and archives summarized findings to a persistent side file that the agent loads at the start of each new task.","The Workflow tool executes a predefined sequence of API calls that archives research findings to external storage between sessions, and the agent retrieves these findings on demand without reloading the conversation context."],"a":[0],"m":false,"x":"Correct. The memory tool provides a client-side directory where Claude can create, read, update, and delete files. It supports just-in-time retrieval, so the agent can record findings and only load relevant files when needed, avoiding loading everything into context upfront."},{"d":"agents","diff":3,"q":"A team needs to coordinate a nightly job that fans out to roughly 200 independent repository-analysis subtasks, then aggregates the results, and wants this orchestration to run reliably without consuming the main conversation's context budget. Which of the following statements about choosing between turn-by-turn subagent delegation and the Workflow tool are accurate? (Select all that apply.)","o":["Turn-by-turn subagent delegation can coordinate an unlimited number of agents per turn by spawning concurrent subagent conversations, making the Workflow tool unnecessary for orchestrating hundreds of subtasks.","The Workflow tool executes an orchestration script outside the conversation context, so it can manage the dozens to hundreds of agents required for the nightly job efficiently.","Using the Workflow tool eliminates the need to define any of the 200 subtasks with descriptions or prompts because the tool's orchestration script automatically infers each task's inputs from the fan-out logic.","Turn-by-turn subagent delegation from a single conversation works well for a few delegated tasks per turn but is not a documented approach for coordinating hundreds of agents.","The Workflow tool requires every one of the 200 subtasks to share the exact same tool permissions as the main agent, preventing any per-task restriction and forcing uniform permission use across all subtasks."],"a":[1,3],"m":true,"x":"Correct. The Workflow tool moves orchestration outside the conversation context, enabling efficient management of dozens to hundreds of agents without consuming the main conversation's context budget. This makes it ideal for the nightly fan-out job."},{"d":"apps","diff":3,"q":"An engineer is processing a nightly batch of 50,000 support tickets through Claude to generate categorization labels. Each ticket is independent, latency is not a concern until the next morning, and the team wants to minimize cost. Which approach best fits this asynchronous workload?","o":["Submit the tickets through the Batch API, which processes large volumes of independent requests asynchronously at roughly half the cost of standard synchronous calls","Open a single streaming Messages API connection and keep it alive overnight, feeding each ticket sequentially into the same conversation turn","Call the standard synchronous Messages API in a tight loop with no concurrency limits, since 50,000 sequential calls will finish before morning regardless of cost","Use the Agent SDK's session resume feature to reprocess the same session id for every ticket so that no new requests are billed"],"a":[0],"m":false,"x":"Correct. Batch processing is designed exactly for large volumes of independent, non-latency-sensitive requests and is billed at a discount versus standard calls."},{"d":"apps","diff":3,"q":"A team wants every file edit that an autonomous coding agent makes to be recorded in a version-control-friendly audit log before the change is written to disk, so that the change history stays traceable alongside normal git commits. Which Agent SDK mechanism should they use?","o":["Register a PreToolUse hook matched to the Edit and Write tools that appends the intended change to the audit log before the tool executes","Rely on the git commit history alone, since every Edit tool call automatically creates a corresponding git commit with a descriptive message","Set the permission_mode to acceptEdits, which by itself writes a structured audit trail of every file change to a log file","Configure a subagent named auditor with no tools, expecting it to passively observe and log every Edit and Write call made by the main agent"],"a":[0],"m":false,"x":"Correct. A PreToolUse hook matched on Edit and Write runs custom logic, such as appending to an audit file, before the tool executes, which is exactly the interception point needed."},{"d":"apps","diff":3,"q":"A platform team is deciding how to run an automated code-fixing agent as part of their CI/CD pipeline, where the agent must run unattended, scale across many concurrent pipeline jobs, and integrate with existing deployment infrastructure. Which option is the best fit according to Anthropic's guidance on choosing between the CLI and the SDK?","o":["Use the Agent SDK, since it is recommended for production automation and CI/CD pipelines while the CLI is better suited to interactive, one-off development sessions","Use the Claude Code CLI exclusively inside the pipeline, since the CLI was purpose-built for unattended CI/CD automation and the SDK is only for local prototyping","Use the Client SDK's raw tool loop instead of either the CLI or the Agent SDK, since implementing tool execution manually is the only supported CI/CD pattern","Alternate between the CLI and the SDK on a per-job basis at random, since Anthropic states both are functionally identical for automated pipeline use"],"a":[0],"m":false,"x":"Correct. Anthropic's comparison explicitly lists CI/CD pipelines and production automation as SDK use cases, while the CLI is recommended for interactive development and one-off tasks."},{"d":"apps","diff":3,"q":"A lead engineer is configuring an automated pull-request reviewer that must inspect changed files and flag quality or security concerns but must never modify the repository. Which combination of Agent SDK choices correctly enforces this read-only code review role? (Select 3)","o":["Restrict allowed_tools to Read, Glob, and Grep so the agent can inspect files and search the codebase without a way to write changes","Define the review behavior as a subagent with a description and prompt scoped to quality and security analysis, invoked via the Agent tool","Omit Edit, Write, and Bash from the tool list so there is no execution path capable of altering repository content","Grant full Bash access so the agent can run arbitrary shell commands to fix any issues it identifies during the review","Set permission_mode to acceptEdits so that any accidental edit the agent proposes is approved automatically without a prompt","Add Write to the allowed tools so the agent can produce a written report summarizing its findings inside the repository"],"a":[0,1,2],"m":true,"x":"Correct. Restricting allowed_tools to read-only tools like Read, Glob, and Grep is the documented pattern for a read-only, analysis-only agent."},{"d":"apps","diff":3,"q":"A developer asks an Agent SDK-powered assistant to perform a small, localized refactor: renaming a single poorly named variable within one function in utils.py. Which built-in tool is the most appropriate for making this precise, targeted change?","o":["The Edit tool, since it is designed for making precise edits to existing files without rewriting unrelated content","The Write tool, since it always overwrites the entire file and is the recommended way to change a single variable name","The Bash tool, since shell find-and-replace commands are the documented mechanism for all source code refactors","The Glob tool, since it can both locate the variable and rewrite its occurrences across the file in one step"],"a":[0],"m":false,"x":"Correct. The Edit tool is documented for making precise edits to existing files, which matches a small, localized rename inside one function."},{"d":"apps","diff":3,"q":"A team is planning a large-scale refactor that spans dozens of files across several days of work. They want the agent to retain full memory of files already inspected and changes already made from one work session to the next, rather than starting from a blank context each morning. Which Agent SDK capability directly supports this?","o":["Sessions, which let the agent resume a prior session id so it retains full context of files read and analysis already performed","The Glob tool, which persists a memory of previously matched file patterns across separate process restarts automatically","The permission_mode setting, which stores a running summary of every refactor decision made in past invocations","The MCP connector, which is required to carry conversation state between unrelated query calls"],"a":[0],"m":false,"x":"Correct. Sessions maintain context across exchanges, and resuming a captured session id lets the agent continue with full memory of prior files read and analysis performed."},{"d":"apps","diff":3,"q":"An application needs Claude to return a JSON object that always conforms to a fixed schema, because downstream code deserializes the response directly into a typed model and cannot tolerate missing or extra fields. Which platform feature is designed to guarantee this schema conformance?","o":["Structured outputs, which guarantee schema conformance through JSON outputs for structured data or strict tool use for validated tool inputs","Extended thinking, which exposes Claude's step-by-step reasoning but does not constrain the shape of the final JSON response","Prompt caching, which reduces cost and latency for repeated context but has no effect on response schema conformance","The Files API, which manages uploaded documents and assets rather than shaping the structure of a JSON response"],"a":[0],"m":false,"x":"Correct. Structured outputs is the documented feature that guarantees schema conformance, via JSON outputs or strict tool use."},{"d":"apps","diff":3,"q":"A team is choosing infrastructure for a long-running, asynchronous production agent and does not want to operate their own sandbox or session-state infrastructure, while another team wants an agent that works directly against files on their own servers using a Python library. Which statements correctly match each team's need to the right approach? (Select 2)","o":["The team avoiding sandbox and session infrastructure operations should use Managed Agents, a hosted REST API where Anthropic runs the agent and sandbox","The team that wants to work directly against files on their own servers using a Python library should use the Agent SDK, which runs the agent loop inside their own process","Both teams should use the Agent SDK, since Managed Agents cannot be reached through a REST API and requires the team to host their own sandbox","The team avoiding sandbox operations should use the Agent SDK, since it stores session state as an Anthropic-hosted event log rather than local JSONL files","The team working directly against local files should use Managed Agents, since Managed Agents execute directly on the customer's own infrastructure by default"],"a":[0,1],"m":true,"x":"Correct. Managed Agents is described as a hosted REST API where Anthropic runs the agent and sandbox, which fits a team that does not want to operate that infrastructure itself."},{"d":"apps","diff":3,"q":"A code review workflow needs to delegate a focused subtask, reviewing only the changed files in a pull request for security issues, to a specialized agent while the main agent continues other work and later receives the results back. Which Agent SDK feature is designed for this delegation pattern?","o":["Subagents, which are spawned to handle focused subtasks and report results back to the main agent that delegated the work","Hooks, which run custom callback code at lifecycle events like PreToolUse but cannot perform an independent code review themselves","The Files API, which stores uploaded documents for reuse but has no mechanism for delegating a review task to another agent","Prompt caching, which reduces the token cost of repeated context but does not delegate any task execution to another agent"],"a":[0],"m":false,"x":"Correct. Subagents are explicitly documented as a way to spawn specialized agents for focused subtasks, with the main agent delegating work and receiving results back."},{"d":"apps","diff":3,"q":"A team wants their Agent SDK-based coding assistant to pull ticket details from their internal issue tracker and post status updates back to it as part of their SDLC, without writing a bespoke HTTP client for that tracker's API inside the agent's tool code. Which capability is intended for connecting an agent to external systems like this?","o":["MCP, the Model Context Protocol, which connects agents to external systems such as databases, browsers, and APIs through existing servers","The Text editor tool, which is designed to create and edit local text files and has no connection to external issue trackers","Extended thinking, which improves reasoning transparency but does not provide any mechanism for reaching external systems","The Memory tool, which stores information across conversations locally but does not connect to external issue-tracking APIs"],"a":[0],"m":false,"x":"Correct. MCP is documented as the way to connect agents to external systems such as databases, browsers, and APIs, including hundreds of existing community servers, without writing a bespoke client."},{"d":"apps","diff":3,"q":"During a refactor, an engineer wants to explore two different approaches to restructuring a module starting from the same point in an existing conversation, without the two explorations interfering with each other's history. Which session capability supports branching an existing conversation into independent paths?","o":["Forking a session, which lets the conversation branch into independent paths from the same starting context","Resuming a session, which always continues a single linear history and cannot branch into two independent paths","Restricting allowed_tools, which controls which tools are pre-approved but does not affect conversation branching","Registering a SessionStart hook, which only runs custom code when a session begins and does not create parallel conversation paths"],"a":[0],"m":false,"x":"Correct. Sessions can be forked to explore different approaches from the same context, which is exactly the branching behavior described."},{"d":"apps","diff":3,"q":"A tool integration is returning very large parameters, such as a full generated file, and the team notices added latency because the client buffers and validates the entire JSON payload before it can be used. Which feature is intended to reduce this latency for large tool-use parameters?","o":["Fine-grained tool streaming, which streams tool use parameters without buffering or JSON validation to reduce latency for large parameters","Batch processing, which is intended for processing many independent requests asynchronously rather than streaming a single large parameter faster","Citations, which ground responses in source documents and are unrelated to how tool-use parameters are transmitted","Data residency controls, which route inference to a geographic region and have no effect on tool parameter streaming latency"],"a":[0],"m":false,"x":"Correct. Fine-grained tool streaming is documented specifically to stream tool use parameters without buffering or validation, reducing latency for large parameters."},{"d":"apps","diff":3,"q":"An engineer building an SDLC automation wants an agent to run git status, stage changes, and commit them as part of a scripted workflow, in addition to reading and editing source files. Which built-in Agent SDK tool grants this ability to run version-control commands directly?","o":["Bash, which runs terminal commands and scripts, including git operations, in addition to other shell tasks","Grep, which searches file contents with regex and has no ability to invoke external commands like git","WebFetch, which retrieves and parses web page content and cannot execute local version-control commands","AskUserQuestion, which prompts the user with clarifying multiple-choice questions rather than executing shell commands"],"a":[0],"m":false,"x":"Correct. Bash is documented as running terminal commands and scripts, explicitly including git operations, which covers status, staging, and committing."},{"d":"apps","diff":3,"q":"A team wants a refactoring agent to automatically improve a file's structure once edits are auto-approved, but they also want a record of every modified file path written to an append-only log immediately after each change lands on disk. Which hook should run the logging logic, and at which point?","o":["A PostToolUse hook matched to Edit and Write, since it runs after the tool has executed and the change has already landed on disk","A PreToolUse hook matched to Edit and Write, since it runs before the tool executes and the change has not yet landed on disk","A SessionEnd hook, since it only runs once when the entire session terminates rather than after each individual file change","A UserPromptSubmit hook, since it fires when the user submits a prompt rather than after a file modification occurs"],"a":[0],"m":false,"x":"Correct. PostToolUse hooks run after the matched tool executes, so by the time the hook fires the edit has already landed on disk, matching the requirement to log after the change lands."},{"d":"apps","diff":3,"q":"A platform architect is mapping SDLC stages to the correct Agent SDK or API feature for a pipeline that must run automated code review, enforce a version-control audit trail, and connect to an external ticketing system as part of the workflow. Which pairings correctly match each SDLC need to the right feature? (Select 3)","o":["Automated code review of changed files is delegated to a subagent defined with a description and prompt scoped to review, invoked via the Agent tool","A version-control audit trail is produced by a PostToolUse hook on Edit and Write that appends each modified file path to a log after the change lands","Connecting to the external ticketing system is handled through MCP, which links the agent to external systems such as APIs and databases via existing servers","Automated code review is best implemented using the Files API, since it is the documented mechanism for analyzing pull request diffs","The version-control audit trail should be produced by disabling all hooks, since hooks are documented as incompatible with git-based workflows","Connecting to the external ticketing system requires the Memory tool, since it is the only documented way to reach an external REST API"],"a":[0,1,2],"m":true,"x":"Correct. Subagents are the documented pattern for delegating a focused review subtask with a scoped description and prompt."},{"d":"apps","diff":3,"q":"A developer wants an agent to count how many tokens a large refactor prompt will consume before submitting it, so they can decide whether to split the prompt into smaller pieces ahead of time. Which feature directly supports this pre-submission check?","o":["Token counting, which determines the number of tokens in a message before it is sent so usage can be estimated ahead of time","Compaction, which summarizes earlier parts of a long-running conversation automatically once the context window is nearly full","Context editing, which clears tool results or manages thinking blocks according to configurable strategies during a conversation","Automatic prompt caching, which moves the cache point forward as a conversation grows rather than estimating token counts ahead of a send"],"a":[0],"m":false,"x":"Correct. Token counting is documented specifically to determine token counts before a message is sent, enabling informed decisions about prompt size ahead of time."},{"d":"apps","diff":3,"q":"A team is scoping the initial rollout of an internal Agent SDK-based refactoring assistant and must decide which of the following are accurate, documented characteristics of the SDK before writing their integration. Which statements are correct? (Select 3)","o":["The TypeScript SDK bundles a native Claude Code binary as an optional dependency, so a separate Claude Code install is not required","The Python package requires Python 3.10 or later, and an older interpreter will cause pip to report no matching distribution","Messages produced from within a subagent's execution include a parent_tool_use_id field that identifies which subagent produced them","The Agent SDK requires claude.ai login credentials for authentication, since API key authentication was deprecated for third-party developers","Every Agent SDK deployment must use Amazon Bedrock for authentication, since direct Anthropic API keys are not supported by the SDK","The Agent SDK can only be used from Python, since TypeScript support was removed in favor of a single supported language"],"a":[0,1,2],"m":true,"x":"Correct. The documentation states the TypeScript SDK bundles a native Claude Code binary as an optional dependency, removing the need for a separate install."},{"d":"apps","diff":3,"q":"A team sends a Messages API request with a 900-token system prompt marked with `cache_control: {\"type\": \"ephemeral\"}`, expecting subsequent identical requests to hit the cache and reduce latency. Every request shows `cache_creation_input_tokens` populated but `cache_read_input_tokens` stays at zero across repeated calls. What is the most likely cause?","o":["The cached system prompt is below the 1,024-token minimum required for Claude Opus 4.8, Sonnet 5, and Haiku 4.5, so the block is never actually written to cache","The requests are being sent more than five minutes apart, so the default ephemeral cache entry has already expired before the next call arrives","The `tools` array is being reordered between calls, which invalidates the tools cache and cascades down to the system cache on every request","The client is omitting the `anthropic-version` header, which forces the API to treat each request as a distinct cache namespace"],"a":[0],"m":false,"x":"Correct. Cacheable content must meet a minimum token count (1,024 tokens for Opus 4.8, Sonnet 5, and Haiku 4.5) before the API will actually cache it; a 900-token block is silently skipped even though `cache_control` is present, so writes never convert into reads."},{"d":"apps","diff":3,"q":"A compliance-document assistant sends the same 40,000-token reference manual as cached context, but users only ask questions roughly every 20-30 minutes, well beyond the default cache lifetime. Which caching configuration change best fits this access pattern?","o":["Set the ephemeral cache breakpoint's `ttl` to `\"1h\"` on the reference manual block, accepting the higher write cost for reduced re-write frequency over the longer idle gaps","Add a second explicit `cache_control` breakpoint immediately after the manual so the 5-minute cache automatically refreshes itself between user questions","Switch to automatic caching by adding a single top-level `cache_control` flag, which extends the default lifetime to match the longest gap between requests","Reduce the manual to under 1,024 tokens so the minimum cacheable threshold no longer applies and the entry persists indefinitely between calls"],"a":[0],"m":false,"x":"Correct. The 1-hour cache duration is designed for content used less frequently than every 5 minutes but still within an hour; paying the 2x write cost once and reading at 0.1x for a subsequent question in the same hour is more efficient than repeatedly re-writing the full 5-minute cache."},{"d":"apps","diff":3,"q":"A developer configures `thinking={\"type\": \"enabled\", \"budget_tokens\": 32000}` alongside `max_tokens=16000` and the request fails validation. What is the correct fix?","o":["Lower `budget_tokens` to a value strictly less than `max_tokens`, since the thinking budget must fit within the overall output token ceiling","Remove `max_tokens` entirely, since extended thinking requests calculate the output ceiling automatically from the thinking budget","Switch `budget_tokens` to a negative offset from `max_tokens` so the API can compute the remaining space for the final text response","Increase `max_tokens` to exactly double `budget_tokens`, which is the fixed ratio the API enforces between thinking and final output tokens"],"a":[0],"m":false,"x":"Correct. `budget_tokens` must be less than `max_tokens`; here 32000 exceeds 16000, so lowering the thinking budget below the max_tokens ceiling resolves the validation error."},{"d":"apps","diff":3,"q":"A document-processing application needs to send up to 550 images in a single Messages API request. Which model configuration choice is required to support that volume?","o":["Use a model without a 200k-token context window, since only those models allow up to 600 images per API request, compared to a 100-image cap on 200k-context models","Use any current model, since the per-request image cap is fixed at 600 images across the entire model lineup regardless of context window size","Split the request across two calls of at most 300 images each, since no single model configuration permits more than 300 images per request","Enable the Files API beta header, since only file_id-referenced images count toward the higher 600-image limit and base64 images remain capped at 100"],"a":[0],"m":false,"x":"Correct. The documented request limits are 100 images per request for models with a 200k-token context window, versus 600 images per request for other models, so reaching 550 images requires choosing a model outside the 200k-context tier."},{"d":"apps","diff":3,"q":"A team is building a single codebase that must call Claude through both the direct Anthropic API and Amazon Bedrock, and their images are currently referenced by public HTTPS URLs to avoid re-uploading binary data. What must change for the Bedrock code path?","o":["Convert image sources to base64-encoded data for the Bedrock path, since only base64-encoded sources are currently available on Amazon Bedrock and Google Cloud","Nothing needs to change, since Bedrock supports the identical `url` source type as the direct Anthropic API for all image content blocks","Switch to the Files API and pass a `file_id` for the Bedrock path, since Bedrock only accepts file references and never accepts inline image data","Host the images on an AWS-owned domain instead of a third-party URL, since Bedrock's `url` source type only resolves URLs within the same AWS account"],"a":[0],"m":false,"x":"Correct. The documentation explicitly notes that on Amazon Bedrock and Google Cloud, only base64-encoded sources are currently available, so URL-based image references must be converted to base64 for the Bedrock code path."},{"d":"apps","diff":3,"q":"A client accumulates token usage by reading the `usage` field from each `message_delta` event during a long streamed response and sums every event's `output_tokens` value to compute a running total. The final total is far higher than the actual response length. What is the mistake?","o":["The `usage` field in `message_delta` events is cumulative, so each event already reflects the running total and should replace, not be added to, the previous value","`message_delta` events never contain a `usage` field, so the client is actually summing undefined values that default to a large placeholder number","Streamed responses emit a separate `usage` object per content block index, so the client must sum only the first content block's deltas rather than all of them","Token usage is only accurate in the `message_stop` event, so any values read from `message_delta` events are placeholder estimates that should be discarded and re-fetched"],"a":[0],"m":false,"x":"Correct. The documentation explicitly warns that token counts shown in the `usage` field of `message_delta` events are cumulative, so treating each event's value as an incremental amount to add causes the running total to be overcounted; the last event's value should simply be taken as the final count."},{"d":"apps","diff":3,"q":"A production chat app on Claude 4.6 loses its network connection mid-stream after partial text has been received, with no tool_use or thinking blocks involved. Following the documented recovery pattern for Claude 4.6 and later, how should the application resume the response?","o":["Send a new request with a user message that includes the partial text and an instruction such as 'Your previous response was interrupted and ended with [previous_response]. Continue from where you left off.'","Send a new request with an assistant message prefilled with the partial text as the beginning of a new assistant turn, exactly as done for Claude 4.5 and earlier models","Resend the exact same original request unmodified, since Claude 4.6 automatically resumes any interrupted stream from its last emitted token using the same request ID","Discard the partial text and start an entirely new conversation, since partial responses cannot be recovered once a network interruption occurs on any model"],"a":[0],"m":false,"x":"Correct. For Claude 4.6 and later, the documented recovery strategy changes step 2 of the capture-and-resume pattern: instead of placing the partial response in an assistant message, you add a user message instructing the model to continue from where it left off, using the partial response as context."},{"d":"apps","diff":3,"q":"A data science team needs to run sentiment classification over 40,000 archived support tickets, none of which require an immediate response, and they want to minimize per-token cost. Which API approach best fits this workload?","o":["Submit the requests through the Message Batches API, since batch pricing is 50% of standard API rates and the workload tolerates asynchronous, non-immediate processing","Submit the requests through the standard synchronous Messages API with `stream: true`, since streaming reduces per-token cost for high-volume classification workloads","Submit the requests through the standard synchronous Messages API with a very low `max_tokens` value, since output token cost only applies above a certain response length threshold","Submit the requests through the Message Batches API with `stream: true` enabled per request, combining batch discounts with real-time incremental delivery of each classification"],"a":[0],"m":false,"x":"Correct. The Message Batches API is designed exactly for large-volume, non-time-sensitive workloads like large-scale evaluations, offering a 50% cost reduction compared to standard API pricing, which matches both the volume and latency tolerance described."},{"d":"apps","diff":3,"q":"A security-sensitive application must run entirely inside an AWS account boundary and needs Claude to autonomously use a code execution tool as part of an agentic loop. The team is evaluating whether Claude in Amazon Bedrock's direct Messages-API integration can support this. What should they conclude?","o":["Server-side tools such as code execution are not supported on Claude in Amazon Bedrock's direct integration, so the code execution requirement cannot be met through this integration path","Server-side tools are fully supported on Claude in Amazon Bedrock, since it uses the same Messages API shape as the direct Anthropic API and inherits identical tool support","Code execution works on Bedrock only when paired with the Message Batches API, since batch processing is required to run any server-side tool in an AWS-hosted environment","Code execution requires switching to IAM assumed-role authentication specifically, since bearer-token authentication on Bedrock blocks access to server-side tools"],"a":[0],"m":false,"x":"Correct. The Claude in Amazon Bedrock feature-support documentation explicitly lists server-side tools (code execution, web search, web fetch, advisor) among the features not supported on that integration, so a code-execution-dependent agentic loop cannot run there."},{"d":"apps","diff":3,"q":"A team is documenting the ground rules for extended thinking before rolling it out across their agentic tool-calling pipeline. Select the statements below that accurately describe extended thinking mechanics.","o":["`budget_tokens` must be set to a value strictly less than `max_tokens`, since the thinking budget has to fit within the overall output token ceiling","Thinking blocks must be passed back to the API unmodified, since their sequence and content cannot be rearranged or edited across turns","Toggling thinking on and off mid-turn causes thinking to be silently and gracefully disabled for that turn rather than raising a hard validation error","Changing the thinking budget between requests invalidates the cached system prompt in addition to invalidating the cached message history","Setting `display: \"omitted\"` still streams the full `thinking_delta` events so developers can inspect Claude's reasoning while suppressing it from end users"],"a":[0,1,2],"m":true,"x":"Correct. The documented constraint is that `budget_tokens` must be less than `max_tokens`, since the thinking budget is part of the overall token ceiling for the request."},{"d":"apps","diff":3,"q":"A developer defines a JSON Schema for an agent's `outputFormat` describing a deeply nested object with many required fields spanning several levels. In testing, most runs end with a `structured_output` field missing and the result message's subtype set to `error_max_structured_output_retries`, even though the underlying task usually succeeds. Which two changes are most likely to reduce these structured-output failures? (Select 2)","o":["Simplify the schema by flattening unnecessary nesting and reducing the number of required fields, keeping only the fields the task can reliably produce","Mark fields optional when the underlying task might not always have that information available, instead of requiring every field unconditionally","Raise `max_tokens` for the underlying model call, since structured-output retries are exhausted purely by insufficient output length","Switch the schema's `type` keyword from `object` to `string` so the SDK stops applying JSON Schema validation to the response","Add a `format` keyword such as `email` to every string field so the SDK enforces stricter validation and produces clearer retry guidance"],"a":[0,1],"m":true,"x":"Correct. Anthropic's documented tips state that deeply nested schemas with many required fields are harder for the agent to satisfy, and keeping schemas focused reduces the chance of hitting the retry limit."},{"d":"apps","diff":3,"q":"A multi-tenant SaaS product runs one Agent SDK session per end-user conversation and must reliably return to a specific user's conversation later, even when it isn't the most recently active session on the server and even after the process restarts. Which session-handling approach fits this requirement?","o":["Capture each session's ID from the result message and store it per user, then pass that specific ID to `resume` when the user returns, rather than relying on `continue`","Set `continue_conversation=True` (or `continue: true`) on every request, since it always resumes the correct user's most recent session regardless of how many other sessions are active","Rely on `fork_session=True` for every follow-up request, since forking guarantees the new session inherits the exact history of the originally intended user","Avoid session persistence entirely and re-send the full conversation transcript as the prompt text on every request, since the SDK does not support returning to a specific past session"],"a":[0],"m":false,"x":"Correct. `resume` takes a specific session ID and is required when there are multiple sessions (for example, one per user) or when returning to a session that isn't the most recent; capturing and storing the ID per user is exactly the documented use case for this option."},{"d":"apps","diff":3,"q":"An agent has already analyzed a codebase's authentication module in an existing session and produced a JWT-based migration plan. The team now wants to explore an alternative OAuth2-based approach in a separate line of investigation without losing the ability to continue the original JWT-focused thread later. Which approach satisfies both goals?","o":["Resume the original session with `fork_session=True` (or `forkSession: true`) and the OAuth2 prompt, which creates a new session with a copy of the original's history while leaving the original session's ID and history unchanged","Resume the original session directly with the OAuth2 prompt, since resume always preserves the prior state under a new ID while leaving a separate unmodified copy behind automatically","Start a brand-new session with no `resume` or `fork_session` option, then manually paste the JWT analysis into the new prompt so both threads share context","Set `continue: true` for the OAuth2 request, since continue automatically branches into a new session ID whenever the prompt topic changes from the prior turn"],"a":[0],"m":false,"x":"Correct. Forking with `resume` plus `fork_session: true` creates a new session that starts as a copy of the original's history and diverges from that point, while the original session's ID and history remain untouched, letting the team explore OAuth2 in the fork and still resume the original JWT thread separately."},{"d":"apps","diff":3,"q":"A batch-processing service runs thousands of independent, single-shot document classification tasks per hour using the Agent SDK. Each task is unrelated to the others, must never be resumable later, and the team wants to avoid unnecessary disk writes for these throwaway sessions in their TypeScript service. What is the correct session configuration?","o":["Set `persistSession: false` on each `query()` call, so the session exists only in memory for the duration of that call and nothing is written to disk","Set `continue: true` on each call so every task shares a single reusable session instead of creating a new one each time","Call `resume` with a randomly generated session ID on each task, which creates a new in-memory-only session and skips disk persistence","Use the Python SDK's `ClaudeSDKClient` instead, since only the Python SDK offers an option to skip writing session transcripts to disk"],"a":[0],"m":false,"x":"Correct. For a stateless task where nothing should be written to disk, TypeScript's `persistSession: false` option keeps the session in memory only for the duration of the call; this is documented as a TypeScript-only capability since Python always persists sessions to disk."},{"d":"apps","diff":3,"q":"A team wants an agent that can read files and run linters but must never modify or delete files under any circumstance, even if a compromised prompt tries to talk it into running a destructive shell command. They configure `allowed_tools=['Read', 'Grep', 'Bash']` and leave the permission mode at its default. During testing, a crafted prompt still gets the agent to run `rm` on a project file via Bash. What is the most robust fix?","o":["Add `disallowed_tools=['Bash(rm *)']` (or a similarly scoped deny rule) so matching Bash calls are denied in every permission mode, since deny rules are evaluated before allow rules and permission mode and cannot be bypassed by them","Remove `Bash` from `allowed_tools` entirely, since an allow list that omits a tool name guarantees Claude can never discover or attempt to call that tool under any prompt","Switch the permission mode to `acceptEdits`, since accept-edits mode narrows Bash to only non-destructive filesystem operations like `mkdir` and `mv`","Rely on the `canUseTool` callback alone without any deny rule, since allow-listed tools such as Bash always fall through to that callback for a final human check"],"a":[0],"m":false,"x":"Correct. In the SDK's permission evaluation order, deny rules are checked before permission mode and allow rules and block the matching call even in `bypassPermissions`; a scoped rule like `Bash(rm *)` keeps Bash available for other uses while reliably denying destructive `rm` calls regardless of what the prompt argues for."},{"d":"apps","diff":3,"q":"A regulated data-processing company wants their Claude-based document extractor to guarantee, at the account level, that Anthropic does not retain submitted document content beyond what is strictly required to service the request. Which content-boundary control should they investigate to meet this requirement?","o":["Zero data retention (ZDR) for Enterprise accounts, which is a documented data-handling boundary specifically aimed at eliminating retention of submitted content beyond the request","Setting `permissionMode: 'dontAsk'` on every agent session, since deny-by-default permission handling also governs how submitted content is retained server-side","Enabling `excludeDynamicSections` on the system prompt, since this removes working-directory and environment content from what Anthropic stores","Restricting `allowed_tools` to exclude WebFetch and WebSearch, since network-capable tools are the only mechanism by which submitted content could be retained"],"a":[0],"m":false,"x":"Correct. Zero data retention is a documented Enterprise-account content/data-handling control specifically intended to address retention of submitted content, which is exactly the account-level guarantee the company is asking about, distinct from client-side tool or prompt configuration."},{"d":"apps","diff":3,"q":"An internal tools team is designing a JSON Schema for an agent that extracts structured incident reports from unstructured on-call notes. Some notes mention a resolution time and some don't; the team also wants the response validated quickly with minimal retries even under time pressure during an incident. Which schema design choices best align with documented structured-output guidance? (Select 2)","o":["Mark the `resolution_time` field optional rather than required, since not every note will contain it and forcing it as required would cause avoidable validation failures","Keep the schema flat and focused on the fields the extraction task can reliably produce, rather than introducing deep nesting the task doesn't need","Require every field including `resolution_time`, and instruct the agent via the prompt to fabricate a plausible value when the real one is missing, so the schema never needs optional fields","Add a `format: 'date-time'` annotation to every timestamp field and rely on the SDK to reject any output that doesn't match that format at the validator level","Nest each incident field inside its own uniquely named wrapper object, one level per field, so that schema evolution never requires renaming a property"],"a":[0,1],"m":true,"x":"Correct. Documented guidance says to match the schema to the task: make fields optional when the task might not always have that information, which directly fits a field like resolution time that isn't present in every note."},{"d":"apps","diff":3,"q":"A support-automation agent is deployed with `permissionMode: 'plan'` so that engineers can review proposed changes before anything is applied. During a demo, a reviewer notices that even though `allowed_tools` includes `Edit` and `Write`, no file edit is ever auto-approved, and every edit attempt routes to the `canUseTool` callback for manual approval. Is this expected, and why?","o":["Yes, this is expected: in `plan` mode, file-edit and shell-write tools are never auto-approved regardless of allow rules and always route to `canUseTool`, so Claude can explore and propose a plan without being able to silently apply changes","No, this is a misconfiguration: `allowed_tools` entries should always auto-approve matching tools in every permission mode, including `plan`, so the team should downgrade their SDK version","Yes, but only because `Edit` and `Write` are bare-name entries; if the team had used scoped entries like `Edit(*.md)` instead, plan mode would have auto-approved them","No, this indicates the `canUseTool` callback itself is misbehaving, since plan mode's only role is to restrict Bash commands, not Edit or Write calls"],"a":[0],"m":false,"x":"Correct. Documented behavior states that in `plan` mode, write operations cannot be auto-approved: file-edit and shell-write tools are routed to the `canUseTool` callback regardless of allow rules, which is precisely the intended design so Claude can plan without applying edits until a human reviews them."},{"d":"apps","diff":3,"q":"A logistics company is choosing an architecture for a new Claude-based dispatching agent. It must run directly against files and internal services on the company's own infrastructure, use custom in-process tool functions written in TypeScript, and keep session state as local JSONL the ops team already knows how to inspect and archive. Which platform best matches these constraints, and why?","o":["The Agent SDK, because it runs the agent loop inside the company's own process against its own filesystem and services, supports in-process custom tool functions, and persists session state as local JSONL by default","Managed Agents, because it is a REST API that runs the agent and sandbox on Anthropic-managed infrastructure with an Anthropic-hosted event log, which best satisfies a requirement for locally inspectable JSONL files","The Claude Platform Client SDK, because it automatically implements the full tool-execution loop against internal services without requiring any custom tool code from the company","Claude Code on the web, because browser-based sessions in cloud environments give the closest equivalent to running directly against a company's own internal infrastructure and files"],"a":[0],"m":false,"x":"Correct. The Agent SDK runs in the caller's own process against files and services on their own infrastructure, supports custom in-process tool functions, and persists session state as JSONL on the local filesystem by default, matching every stated constraint."},{"d":"apps","diff":3,"q":"A security team is reviewing an Agent SDK deployment and wants to understand which statements about the SDK's tool-permission evaluation order are accurate, so they can design content boundaries that hold even under `bypassPermissions`. Which of the following are correct? (Select 3)","o":["Hooks run before deny rules, allow rules, and the permission mode check, and a hook that denies a call blocks it regardless of the active permission mode","Deny rules matching a scoped pattern, such as `Bash(rm *)`, are still enforced even when the permission mode is `bypassPermissions`","A bare tool name in `disallowed_tools`, such as `Bash`, removes that tool's definition from the request entirely, so Claude cannot see or attempt to call it","Once `allowed_tools` includes a tool, that tool is guaranteed to always require the `canUseTool` callback before execution, even under `bypassPermissions`","`ask` rules from settings.json are ignored whenever `bypassPermissions` is active, since bypass mode always takes precedence over ask rules","In `dontAsk` mode, tool calls that are not pre-approved by an allow rule or hook still fall through to the `canUseTool` callback so a human can confirm them"],"a":[0,1,2],"m":true,"x":"Correct. Hooks are evaluated first in the permission flow; a hook can deny a call outright, and that denial is enforced even in `bypassPermissions` mode, before deny rules, ask rules, permission mode, or allow rules are checked."},{"d":"code","diff":3,"q":"A developer wants their project's CLAUDE.md to mention the path to a git workflow guide without pulling its contents into every session's context. They write `` `@docs/git-instructions.md` `` wrapped in backticks inside a paragraph. What happens when Claude Code parses this CLAUDE.md at session start?","o":["Claude Code treats the backtick-wrapped path as literal text and skips the import, since import parsing skips code spans and fenced code blocks.","Claude Code still imports the file, because the `@` import syntax is resolved before Markdown code span parsing removes the surrounding backticks.","Claude Code raises a parse error and refuses to load the rest of the CLAUDE.md file until the ambiguous backticked reference is removed entirely.","Claude Code imports the file but truncates it to just the first paragraph, since backticked references are treated as partial-preview imports only."],"a":[0],"m":false,"x":"Correct. Import parsing skips Markdown code spans and fenced code blocks, so wrapping a path in backticks keeps it as literal text instead of triggering an import."},{"d":"code","diff":3,"q":"Over several months, Claude has written extensive notes into a project's auto memory, and `MEMORY.md` has grown to 340 lines while individual topic files like `debugging.md` and `api-conventions.md` remain untouched in the same directory. A new session starts in this project. What gets loaded into context automatically at session start?","o":["Only the first 200 lines (or 25KB, whichever comes first) of `MEMORY.md`; the topic files load later only if Claude reads them on demand with its file tools.","The full 340-line `MEMORY.md` plus every topic file in the memory directory, since auto memory is designed to load exhaustively at the start of each session.","Nothing from auto memory loads automatically; Claude must run `/memory` explicitly during the session before any notes become available.","The last 200 lines of `MEMORY.md`, on the theory that the most recently appended notes are the most relevant to the current session."],"a":[0],"m":false,"x":"Correct. The first 200 lines or 25KB of MEMORY.md, whichever comes first, load at session start; content beyond that threshold and topic files load only on demand."},{"d":"code","diff":3,"q":"An organization deploys a `Bash(curl *)` deny rule through managed settings so no developer can override it. A project's checked-in `.claude/settings.json` adds an allow rule for `Bash(curl *)` so the CI pipeline can fetch build artifacts. A developer working locally runs `curl` from an interactive session. What happens?","o":["The command is still blocked, because managed settings sit at the top of the precedence order and cannot be overridden by project, local, or user settings.","The command runs, because permission rules merge across scopes and the project-level allow rule is combined with the managed rule to permit the specific case.","The command prompts the developer for one-time approval, because a conflicting allow and deny rule across scopes always falls back to an interactive prompt.","The command runs, because project settings are read after managed settings and the most recently loaded scope wins when rules conflict."],"a":[0],"m":false,"x":"Correct. Managed settings are the highest-priority scope and cannot be overridden by any other scope, so the deny rule still blocks the command regardless of the project's allow rule."},{"d":"code","diff":3,"q":"A team writes a `/deploy` skill that pushes to production. They want to guarantee Claude never triggers this skill on its own judgment during a normal conversation, while still letting any team member type `/deploy` to run it intentionally. Which frontmatter field accomplishes this?","o":["`disable-model-invocation: true`, which removes the skill's description from Claude's context so only a typed `/deploy` invocation can trigger it.","`user-invocable: false`, which hides the skill from the `/` menu so Claude becomes the only party able to invoke it during a session.","`allowed-tools: none`, which strips every tool from the skill so Claude cannot act on it even if the skill content loads into context.","`context: fork`, which runs the skill in an isolated subagent so the main conversation cannot decide to invoke it automatically."],"a":[0],"m":false,"x":"Correct. `disable-model-invocation: true` keeps the skill's description out of Claude's context entirely, so only a direct `/deploy` invocation by a user can trigger it."},{"d":"code","diff":3,"q":"A skill is defined with `context: fork` and `agent: Explore`, and its body contains a multi-step research task. When a user invokes this skill, what does the resulting subagent see in its initial context regarding the project's CLAUDE.md files?","o":["No CLAUDE.md content at all, because the Explore agent type skips CLAUDE.md and git status to keep its research context small and inexpensive.","The full CLAUDE.md hierarchy exactly as the main conversation loaded it, because every forked skill inherits the parent session's loaded context.","Only the project-root CLAUDE.md, since Explore loads root-level instructions but skips nested and user-level CLAUDE.md files to save tokens.","A summarized version of CLAUDE.md generated specifically for research tasks, since Explore always compresses memory content before starting."],"a":[0],"m":false,"x":"Correct. The built-in Explore and Plan agents skip CLAUDE.md and the parent session's git status regardless of how they are invoked, including via a forked skill, to keep exploration fast and inexpensive."},{"d":"code","diff":3,"q":"A custom subagent needs access to every tool the main conversation has, including any MCP servers configured for the session, but must never call Write or Edit. Which frontmatter approach achieves this with the least maintenance as new tools and MCP servers are added over time?","o":["Set `disallowedTools: Write, Edit` so the subagent inherits the full tool pool and only those two tools are removed from it.","Set `tools: Read, Grep, Glob, Bash` so the subagent's tool list is explicitly enumerated and stays fixed regardless of future additions.","Set `tools: *` combined with `disallowedTools: Write, Edit` so both fields resolve together into an explicit allowlist minus Write and Edit.","Omit both `tools` and `disallowedTools`, then rely on a `PreToolUse` hook to reject any call to Write or Edit at runtime."],"a":[0],"m":false,"x":"Correct. `disallowedTools` is a denylist applied against the inherited full tool pool, so new tools and MCP servers remain available automatically while Write and Edit stay blocked."},{"d":"code","diff":3,"q":"A team wants their `code-reviewer` subagent to build up a knowledge base of recurring patterns and conventions specific to their monorepo, and they want that knowledge base checked into version control so every teammate benefits from it. Which `memory` scope should they configure on the subagent?","o":["`project`, which stores the memory directory under `.claude/agent-memory/<name>/` so it can be committed and shared through the repository.","`user`, which stores the memory directory under `~/.claude/agent-memory/<name>/` so the knowledge follows the individual across all their projects.","`local`, which stores the memory directory under `.claude/agent-memory-local/<name>/` so the knowledge stays on one machine but out of version control.","`shared`, which stores the memory directory in a team-wide location that syncs automatically across every contributor's machine."],"a":[0],"m":false,"x":"Correct. `project` scope is the recommended default when knowledge should be project-specific and shareable via version control, since it lives at `.claude/agent-memory/<name>/`."},{"d":"code","diff":3,"q":"An engineer is running several Claude Code sessions in parallel from the same project directory, using `claude -p` for automation. They capture the session ID from one run's JSON output and later want to resume that exact session with
