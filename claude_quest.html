":"A team configures a PreToolUse hook that returns exit code 0 with the following JSON on stdout: `{\"hookSpecificOutput\": {\"hookEventName\": \"PreToolUse\", \"permissionDecision\": \"deny\", \"permissionDecisionReason\": \"Writing to /etc is not allowed\"}}`. What happens to the pending tool call?","o":["The tool call is blocked, and the reason is surfaced to Claude so it can adjust its next step","The tool call still executes because exit code 0 always signals approval regardless of the JSON payload","Claude Code ignores the JSON and prompts the user interactively to approve or deny the call","The hook output is discarded because permissionDecision only applies when the exit code is 2"],"a":[0],"m":false,"x":"Correct. With exit code 0, Claude Code parses the JSON; permissionDecision: deny blocks the call, and permissionDecisionReason is passed back so Claude understands why."},{"d":"sec","diff":3,"q":"A guardrail hook needs to rewrite a Write tool's `file_path` argument to redirect it into a sandbox directory and have the rewritten write proceed automatically without a user prompt. Which combination of fields in the PreToolUse hook's `hookSpecificOutput` accomplishes this?","o":["`updatedInput` containing the new file_path, together with `permissionDecision: \"allow\"`","`updatedInput` containing the new file_path, together with `permissionDecision: \"defer\"`","`additionalContext` describing the desired new path, with no permissionDecision field set","`updatedToolOutput` containing the new file_path, together with `permissionDecision: \"allow\"`"],"a":[0],"m":false,"x":"Correct. updatedInput supplies the modified arguments, and permissionDecision: allow auto-approves the rewritten call so it runs without prompting the user."},{"d":"sec","diff":3,"q":"A compliance lead registers three independent PreToolUse hooks for the same Bash matcher: an authorization check, an input validator, and an audit logger. During a single tool call, the authorization check returns `permissionDecision: \"deny\"` while the other two return `permissionDecision: \"allow\"`. What is the outcome?","o":["The tool call is blocked, because deny takes priority over allow when multiple hooks return conflicting decisions","The tool call proceeds, because a majority of the hooks (two out of three) returned allow","Claude Code raises a configuration error, because hooks on the same matcher are not allowed to disagree","The tool call proceeds, because only the last hook to finish determines the final decision"],"a":[0],"m":false,"x":"Correct. When multiple hooks or permission rules apply, deny takes priority over defer, which takes priority over ask, which takes priority over allow; a single deny blocks the call regardless of other results."},{"d":"sec","diff":3,"q":"A developer wants a PostToolUse hook to fire a webhook for logging purposes after every Bash command, but does not want the agent to wait for the webhook request to finish before continuing. Which output should the hook callback return?","o":["`{\"async\": true, \"asyncTimeout\": 30000}` after kicking off the webhook request in the background","`{\"continue\": false}` so the agent pauses until the webhook request completes","`{\"hookSpecificOutput\": {\"hookEventName\": \"PostToolUse\", \"permissionDecision\": \"defer\"}}` to postpone the next tool call","An empty object `{}` returned only after the webhook request has fully resolved"],"a":[0],"m":false,"x":"Correct. Returning async: true tells the agent to proceed immediately without waiting for the hook to finish, which is intended for side effects like logging or webhooks that don't need to influence behavior."},{"d":"sec","diff":3,"q":"An SDK application registers a `UserPromptSubmit` hook to catch prompts containing secrets before Claude ever sees them. Which mechanism lets the hook stop the prompt from being processed?","o":["Returning `{\"decision\": \"block\", \"reason\": \"Prompt contains forbidden content\"}` from the hook callback","Returning `{\"hookSpecificOutput\": {\"hookEventName\": \"UserPromptSubmit\", \"permissionDecision\": \"deny\"}}` from the hook callback","Throwing an uncaught exception inside the hook callback so the SDK aborts the turn","Setting `additionalContext` to an empty string so Claude receives no content to act on"],"a":[0],"m":false,"x":"Correct. UserPromptSubmit uses the top-level decision field; returning decision: block with a reason blocks and erases the prompt before Claude processes it."},{"d":"sec","diff":3,"q":"A team maintains a shared safety hook that should apply to every developer working in a specific repository and be committed to version control so it travels with the codebase, but must not apply to any other project on the same machine. Where should they define it?","o":["`.claude/settings.json` in the project root, since this file is project-scoped and intended to be shared via the repository","`~/.claude/settings.json`, since this file applies the hook across every project on the machine","`.claude/settings.local.json`, since this file is scoped to the project and safe to share with the team","A managed policy settings file, since only organization administrators can define project-specific hooks"],"a":[0],"m":false,"x":"Correct. `.claude/settings.json` is scoped to a single project and is explicitly documented as shareable, meant to be committed to the repository so the whole team gets the same hooks."},{"d":"sec","diff":3,"q":"A safety engineer configures a PreToolUse hook matcher of `mcp__memory` intending to intercept every tool exposed by the `memory` MCP server. During testing, none of the memory server's tools are intercepted. What is the most likely cause?","o":["The matcher `mcp__memory` contains only exact-match characters, so it is compared as an exact string and never matches any tool; the pattern should be `mcp__memory__.*`","MCP tool names never begin with `mcp__` in Claude Code, so the matcher prefix is fundamentally incorrect","PreToolUse hooks cannot target MCP tools under any circumstances and only fire for built-in tools","The matcher is being evaluated case-sensitively against the server's display name rather than its internal identifier"],"a":[0],"m":false,"x":"Correct. Because `mcp__memory` contains only letters/underscores, it is treated as an exact string and matches no tool name exactly; the documented fix is `mcp__memory__.*`, which via the wildcard becomes a regex matching every tool from that server."},{"d":"sec","diff":3,"q":"A developer building a Python Agent SDK application wants to load a `SessionStart` hook that resets telemetry state at the beginning of every session. They discover the Python `HookEvent` type does not include `SessionStart` as a registrable SDK callback. What should they do to still run this logic?","o":["Define the hook as a shell command hook in `.claude/settings.json` and load it via `setting_sources=[\"project\"]` in `ClaudeAgentOptions`","Switch the entire application to TypeScript, since Python cannot run any initialization logic at session start under any configuration","Register the logic under `PreToolUse` instead, since PreToolUse fires before SessionStart in the Python SDK's internal event order","Use `PostCompact` as a substitute, since it is functionally equivalent to SessionStart in the Python SDK"],"a":[0],"m":false,"x":"Correct. SessionStart and SessionEnd aren't available as SDK callback hooks in Python, but they can be defined as shell command hooks in settings files; enabling setting_sources=[\"project\"] loads `.claude/settings.json`, including its hooks."},{"d":"sec","diff":3,"q":"A code review agent spawns several subagents in parallel, each of which needs to run Bash commands without repeatedly prompting the user for permission. The team observes that permission prompts multiply, one per subagent, even though the parent session already approved similar commands. What causes this, and what is the recommended mitigation?","o":["Subagents don't automatically inherit parent agent permissions, so the team should use PreToolUse hooks to auto-approve specific tools for subagent sessions","This is a bug with no workaround; the only option is to disable subagents entirely","Subagents share a single permission state with the parent, so the multiplying prompts indicate a misconfigured matcher unrelated to subagents","The team should switch every subagent's permission_mode to bypassPermissions, which is the only supported fix for this scenario"],"a":[0],"m":false,"x":"Correct. Subagents don't automatically inherit parent agent permissions, so each may request permissions separately; the documented mitigation is to use PreToolUse hooks to auto-approve specific tools or configure permission rules that apply to subagent sessions."},{"d":"sec","diff":3,"q":"A guardrail hook needs to consult an internal security-scanning service, implemented as an MCP tool called `security_scan` on server `security`, to decide whether a file edit is safe, without writing any custom command-line script. Which hook handler type is designed for this exact use case?","o":["An `mcp_tool` hook that specifies the server and tool name, forwarding relevant tool_input fields as its input","A `command` hook that shells out to `curl` against the MCP server's internal socket","A `prompt` hook that asks a fast model to guess whether the MCP tool would approve the edit","An `http` hook pointed at the MCP server's transport endpoint, bypassing the MCP protocol entirely"],"a":[0],"m":false,"x":"Correct. The `mcp_tool` hook type is built specifically to invoke an MCP tool (specifying server, tool, and input) as part of hook evaluation, matching this exact scenario."},{"d":"sec","diff":3,"q":"A safety-conscious team is designing PreToolUse guardrails for a coding agent with broad Bash access. Which of the following are valid, documented ways to prevent a specific destructive Bash invocation from executing? (Select 2)","o":["Return `permissionDecision: \"deny\"` with a `permissionDecisionReason` from a command hook that inspects `tool_input.command`","Exit the hook script with code 2 and print an explanation to stderr, without emitting JSON","Return `permissionDecision: \"allow\"` and rely on Claude to reconsider the command on its own in a later turn","Set `additionalContext` describing the risk in a PostToolUse hook after the command has already run","Omit the hook's matcher entirely so it never fires for Bash tool calls"],"a":[0,1],"m":true,"x":"Correct. Returning permissionDecision: deny with a reason from a PreToolUse command hook is the primary documented mechanism to block a specific dangerous command before it runs."},{"d":"sec","diff":3,"q":"Which of the following statements about hook decision priority and configuration scope are accurate according to Anthropic's documentation? (Select 3)","o":["When multiple hooks return conflicting decisions, deny takes priority over defer, which takes priority over ask, which takes priority over allow","`.claude/settings.local.json` is gitignored and intended for local-only configuration, not for sharing hooks with a team","Managed policy settings apply organization-wide and are admin-controlled, taking precedence in a way project-local settings cannot override","A hook matcher of `*` is functionally identical to an omitted matcher, since only `*` fully disables regex evaluation for that hook","PostToolUse hooks can block a tool call before it executes, just like PreToolUse hooks","Async hook outputs can safely block, modify, or inject context into the operation as long as `asyncTimeout` is set high enough"],"a":[0,1,2],"m":true,"x":"Correct. This priority ordering (deny > defer > ask > allow) is explicitly documented as how conflicting hook decisions are resolved."},{"d":"sec","diff":3,"q":"A guardrail author wants a hook to run for `Write`, `Edit`, and `Delete` tool calls using an exact-match list matcher, and separately wants another hook to catch every MCP tool call using a regex matcher. Which two matcher strings correctly achieve this per the documented matcher rules?","o":["`Write|Edit|Delete` for the first hook, and `^mcp__` for the second hook","`Write+Edit+Delete` for the first hook, and `mcp__` for the second hook","`Write, Edit, Delete` only, with no separate matcher needed for MCP tools since they are matched automatically","`(Write|Edit|Delete)` for the first hook, and `mcp__*` for the second hook"],"a":[0],"m":false,"x":"Correct. `Write|Edit|Delete` contains only exact-match characters (letters and pipes) and is compared as an exact-string list of three tool names; `^mcp__` contains regex-only characters and is evaluated as an unanchored regex matching every MCP tool name, both directly matching documented examples."},{"d":"sec","diff":3,"q":"A guardrail team is choosing a hook handler `type` for a new PreToolUse safety check. Which of the following are valid, documented handler types they can configure? (Select 3)","o":["`command`, which runs a local shell script or executable and reads JSON from stdin","`http`, which posts the event payload to a configured URL and reads the JSON response","`mcp_tool`, which invokes a specific tool on a configured MCP server as the check","`websocket`, which keeps a persistent bidirectional socket open for the duration of the session","`cron`, which runs the check on a fixed schedule independent of any tool call"],"a":[0,1,2],"m":true,"x":"Correct. `command` hooks execute a local script or binary and receive event context as JSON on stdin, one of the documented hook handler types."},{"d":"sec","diff":3,"q":"A team is auditing which hook events in their guardrail configuration are actually capable of stopping an unwanted action, as opposed to merely observing or logging it after the fact. Which of the following hook events can block or otherwise prevent the associated action from proceeding, per Anthropic's documentation? (Select 3)","o":["PreToolUse, which can return permissionDecision: deny to stop a tool call before it runs","UserPromptSubmit, which can return decision: block to erase the prompt before Claude processes it","Stop, which can return decision: block to prevent Claude from ending its turn","PostToolUse, which can return permissionDecision: deny to undo a tool call after it completes","Notification, which can return decision: block to suppress a status message before it fires","FileChanged, which can return permissionDecision: deny to stop a watched file from being modified on disk"],"a":[0,1,2],"m":true,"x":"Correct. PreToolUse fires before execution and permissionDecision: deny stops the tool call from ever running."},{"d":"sec","diff":3,"q":"A compliance auditor asks an engineering team to produce evidence of which Claude API keys are nearing expiration across all workspaces, so stale credentials can be rotated proactively before they lapse. Which action retrieves this information programmatically?","o":["Call the Admin API's List API Keys endpoint with an Admin API key and inspect each returned key's `expires_at` timestamp, treating a `null` value as a key with no expiration.","Query the Compliance API's Activity Feed for `key.created` events and compute expiration by adding 30 days to each event's timestamp.","Call the Usage and Cost API for each workspace and filter the returned line items for entries whose `cost` field is exactly zero.","Use the Rate Limits API to list per-workspace rate limit configurations, since keys that are near expiration are automatically assigned a reduced rate limit."],"a":[0],"m":false,"x":"Correct. The Admin API's List API Keys endpoint returns each key's expires_at timestamp directly (null for keys without an expiration), which is exactly the audit signal needed."},{"d":"sec","diff":3,"q":"A platform team configures a federation rule with `subject_prefix` set to `system:serviceaccount:prod:worker` and no `claims` or `condition` matchers. A JWT arrives from the cluster with `sub` equal to `system:serviceaccount:staging:worker-2`. Will this JWT be accepted by the rule, and why?","o":["No, because the subject does not start with `system:serviceaccount:prod:worker`; the `staging` namespace fails the prefix match even though the trailing segment is similar.","Yes, because `subject_prefix` only checks that the subject contains the same set of colon-separated segments somewhere in the string, regardless of order.","Yes, because omitting `claims` and `condition` causes the rule to fall back to matching on `audience` alone, which is satisfied by any workload in the same cluster.","No, because a federation rule requires at least two of `subject_prefix`, `claims`, or `condition` to be set, so this rule is invalid and rejects every JWT."],"a":[0],"m":false,"x":"Correct. subject_prefix performs a literal prefix match on the sub claim; `system:serviceaccount:staging:worker-2` does not start with `system:serviceaccount:prod:worker`, so the match fails and the token exchange is denied."},{"d":"sec","diff":3,"q":"A workload's identity provider issues JWTs with a 5-minute lifetime. The federation rule the workload uses sets `token_lifetime_seconds` to 3600. What is the actual maximum lifetime of the Anthropic access token minted from this exchange?","o":["10 minutes, because the minted token's lifetime is capped at the lesser of the rule's configured value and twice the remaining lifetime of the presented IdP JWT.","60 minutes, because `token_lifetime_seconds` on the rule always determines the token lifetime regardless of the upstream JWT's own expiration.","5 minutes, because the minted Anthropic token can never outlive the IdP JWT that was exchanged to obtain it, matching its lifetime exactly.","60 seconds, because tokens minted from short-lived upstream JWTs are always clamped to the protocol's minimum allowed lifetime."],"a":[0],"m":false,"x":"Correct. The token lifetime is the lesser of the rule's token_lifetime_seconds (3600s here) and twice the remaining IdP JWT lifetime (2 x 300s = 600s), so the 600-second (10-minute) bound applies."},{"d":"sec","diff":3,"q":"A team is building an automated agent using the Claude Agent SDK that runs unattended in a CI pipeline. It needs to run a fixed set of tools (`Read`, `Grep`, `Bash(npm test)`) without any human available to approve prompts, and any tool call outside that fixed set must be rejected outright rather than hang waiting for approval. Which configuration achieves this?","o":["Set `allowed_tools` to the fixed set of tools and set `permission_mode` to `dontAsk`, so listed tools are auto-approved and everything else is denied without invoking `canUseTool`.","Set `permission_mode` to `bypassPermissions` and omit `allowed_tools` entirely, since bypass mode already restricts execution to a minimal safe tool set by default.","Set `permission_mode` to `plan` and set `allowed_tools` to the fixed set, since plan mode auto-denies any tool call that is not explicitly pre-approved.","Set `permission_mode` to `default` and register a `canUseTool` callback that always throws an exception for tools outside the fixed set."],"a":[0],"m":false,"x":"Correct. dontAsk converts any unresolved permission check into a denial without calling canUseTool, so pairing it with allowed_tools gives a fixed, explicit tool surface that never hangs waiting on a human."},{"d":"sec","diff":3,"q":"A team configures their Claude Agent SDK session with `permission_mode: \"bypassPermissions\"` and `allowed_tools: [\"Read\"]`, believing this restricts the agent to read-only file access for safety during an autonomous refactor. During the run, the agent successfully executes a `Bash` command that deletes a directory. What is the correct explanation for this outcome?","o":["`allowed_tools` only pre-approves the tools listed; unlisted tools like `Bash` are not matched by any allow rule and fall through to the permission mode, where `bypassPermissions` approves them anyway.","The team's configuration contains a syntax error, since `allowed_tools` cannot be combined with `bypassPermissions` in the same session and the SDK should have rejected it at startup.","`bypassPermissions` only applies to tools explicitly named in `allowed_tools`, so `Bash` should have been blocked; this indicates a bug in the SDK's permission evaluator.","The deletion happened because a `PreToolUse` hook was missing, and hooks are the only mechanism capable of blocking destructive Bash commands in bypass mode."],"a":[0],"m":false,"x":"Correct. allowed_tools does not constrain bypassPermissions: it only pre-approves listed tools, and any tool not covered by an allow or deny rule still falls through to the permission mode step, where bypass mode approves everything."},{"d":"sec","diff":3,"q":"A DevOps engineer needs to write an infrastructure-as-code pipeline that provisions a new service account, registers a federation issuer for GitHub Actions, and creates a federation rule, all without manual Console clicks. Which authentication approach must the pipeline use to call the relevant Admin endpoints?","o":["An `org:admin` OAuth bearer token, because service account, federation issuer, and federation rule endpoints require it and do not accept Admin API keys.","An Admin API key with the `x-api-key` header, because Admin API keys have equivalent access to `org:admin` OAuth tokens across every Admin API endpoint.","A workspace-scoped API key created for the pipeline's dedicated CI workspace, since federation resources are managed at the workspace level, not the organization level.","No authentication is required for these specific endpoints, since federation setup is intentionally left open to bootstrap trust before any credential exists."],"a":[0],"m":false,"x":"Correct. Service accounts, federation issuers, and federation rules explicitly require an org:admin OAuth token; Admin API keys are documented as not accepted on these endpoints."},{"d":"sec","diff":3,"q":"An organization's security policy sets a maximum API key expiration of 7 days for all newly created keys. A developer opens the Console's API keys page to create a new key for a long-running batch job and expects to select 'Never' as the expiration so they only have to rotate it once a year. What will actually happen?","o":["The 'Never' option will be unavailable, and preset and custom durations will be capped at 7 days, since the Console limits expiration choices to the organization's configured maximum policy.","The 'Never' option will still be available for any individual developer, since organization-wide maximum expiration policies only apply to Admin API keys, not standard API keys.","The Console will allow 'Never' to be selected, but the key will silently expire after 7 days anyway regardless of the option chosen, without any warning email.","The developer's request will be auto-escalated to an admin for manual override, since expiration policy limits can always be bypassed with admin approval per key."],"a":[0],"m":false,"x":"Correct. When an organization has a maximum expiration policy, the Console limits presets and custom durations to that policy's maximum and makes 'Never' unavailable."},{"d":"sec","diff":3,"q":"A workspace admin needs to grant a contractor temporary access to only one specific Claude Console workspace used for a pilot project, without giving them visibility into the organization's other workspaces or the ability to manage organization-wide members. Which Admin API action accomplishes this precisely?","o":["Add the contractor as a workspace member via `POST /v1/organizations/workspaces/{workspace_id}/members` with an appropriate `workspace_role`, scoping their access to that single workspace.","Invite the contractor to the organization with the `developer` organization role, since organization roles are automatically scoped to whichever workspace sent the invite.","Create a new Admin API key on the contractor's behalf and share it with them, since Admin API keys are inherently scoped to a single workspace by design.","Grant the contractor an `org:admin` OAuth token limited to read-only scope, since OAuth tokens are the only mechanism that can be scoped below the organization level."],"a":[0],"m":false,"x":"Correct. Adding a user as a workspace member with a workspace_role via the workspace members endpoint scopes their access to that specific workspace, distinct from organization-wide roles."},{"d":"sec","diff":3,"q":"A team is deciding how to authenticate a mix of workloads: (1) a data scientist's laptop script for one-off prototyping, (2) a GitHub Actions workflow that runs on every pull request, (3) a long-running Kubernetes deployment, and (4) a single-tenant on-prem server with no OIDC-capable identity provider available. For which of these should the team select an API key rather than Workload Identity Federation as the better fit? (Select all that apply.)","o":["The data scientist's laptop script for one-off prototyping.","The single-tenant on-prem server with no OIDC-capable identity provider available.","The GitHub Actions workflow that runs on every pull request.","The long-running Kubernetes deployment.","None of these; Workload Identity Federation is strictly better for every listed workload."],"a":[0,1],"m":true,"x":"Correct. API keys are documented as best for local development, prototyping, scripts, and single-tenant servers where you control secret storage; a one-off laptop script fits this exactly."},{"d":"sec","diff":3,"q":"An engineer configures a federation rule and leaves the `scope` field unset, then successfully performs a test token exchange for a workload that only needs to send `/v1/messages` requests within its workspace. What authorization scope does the minted token receive by default, and what access does that grant?","o":["The token receives `workspace:developer` scope by default, granting the same access as an API key issued for that workspace.","The token receives `org:admin` scope by default, granting full administrative access across the entire organization regardless of workspace.","The token receives no scope by default, causing every subsequent API call to fail with a 403 until a scope is explicitly assigned to the rule.","The token receives `workspace:manage_tunnels` scope by default, since that is the scope every federation rule falls back to when unset."],"a":[0],"m":false,"x":"Correct. The default OAuth scope for a federation rule is workspace:developer, which grants the same access as an API key issued for that workspace, matching what this workload needs."},{"d":"sec","diff":3,"q":"A security team is designing a workflow where every custom MCP tool call that touches customer PII must require explicit human sign-off, even for agents configured with a permissive `acceptEdits` permission mode used elsewhere for fast iteration. Which two mechanisms, combined, correctly enforce this requirement for the PII-touching tools specifically? (Select 2.)","o":["Have the MCP server annotate the PII-touching tools with `_meta[\"anthropic/requiresUserInteraction\"]` so those specific calls always reach the `canUseTool` callback.","Implement a `canUseTool` callback that prompts for human approval whenever it is invoked for a tool call that was not otherwise auto-approved.","Set the global `permission_mode` to `plan` for the entire session, since plan mode is the only mode compatible with per-tool human sign-off requirements.","Add the PII-touching tools to `allowed_tools`, since listing a tool there is what causes it to require human approval on every call.","Rely on `acceptEdits` alone, since it only auto-approves non-destructive file operations and MCP tool calls are never covered by it regardless of annotation."],"a":[0,1],"m":true,"x":"Correct. This is one of the two documented ways a tool call reaches canUseTool even when an allow rule matches or acceptEdits/bypassPermissions is active: the requiresUserInteraction MCP annotation."},{"d":"sec","diff":3,"q":"An engineer holds only an Admin API key (no `org:admin` OAuth token) and has a checklist of tasks to finish before an audit deadline this afternoon. Based on which endpoints accept an Admin API key, which of the following tasks can they complete using just that key? (Select all that apply.)","o":["List the organization's existing API keys and inspect each one's expiration status.","Add a specific user as a member of one workspace with a given workspace role.","Register a new federation issuer for a Kubernetes cluster the team just provisioned.","Create a new service account for an upcoming CI workload.","Retrieve basic organization information via the `/v1/organizations/me` endpoint.","Remove an organization member whose role is currently set to admin."],"a":[0,1,4],"m":true,"x":"Correct. Listing API keys is a standard Admin API endpoint that accepts the x-api-key header with an Admin API key."},{"d":"sec","diff":3,"q":"A platform team is setting up Workload Identity Federation for the first time for a GitHub Actions workflow and is unsure which resources must already exist in the Claude Console before their workflow's first token exchange at `/v1/oauth/token` can succeed. Which of the following are required to exist beforehand? (Select all that apply.)","o":["A federation issuer registering GitHub Actions' OIDC provider with the organization.","A service account that the matched JWT will act as.","A federation rule that maps the issuer's JWTs to the service account with match conditions and a scope.","A workspace-scoped API key generated specifically to authorize the first token exchange.","An Admin API key stored in the GitHub Actions repository secrets to sign the exchange request."],"a":[0,1,2],"m":true,"x":"Correct. A federation issuer must be registered so Anthropic knows JWTs signed by GitHub Actions' OIDC provider may assert workload identity for the org."},{"d":"tools","diff":3,"q":"A platform engineer is integrating a new MCP server into an internal Claude Code agent. The vendor's documentation instructs users to run `npx internal-tools-mcp` as a local process on the same machine that hosts the agent, and gives no network endpoint. Which transport type should the engineer configure for this server?","o":["stdio","SSE","Streamable HTTP","WebSocket"],"a":[0],"m":false,"x":"Correct. When documentation gives a command to run rather than a URL, the server is a local process communicating over stdin/stdout, which is the stdio transport."},{"d":"tools","diff":3,"q":"A team wants to connect their agent to a third-party analytics MCP server. The provider's documentation gives a hosted endpoint URL, `https://analytics.example.com/mcp`, rather than a local command to run. Which configuration best matches this integration pattern?","o":["Set the server's \"type\" to \"http\" and provide the given URL","Set the server's \"type\" to \"stdio\" and run a local binary command","Wrap the analytics API as an in-process SDK MCP server instead","Point the server at the URL using a \"command\" and \"args\" pair"],"a":[0],"m":false,"x":"Correct. A documented URL indicates a remote, cloud-hosted server, so the server should be configured with \"type\": \"http\" (or \"sse\") and the given URL."},{"d":"tools","diff":3,"q":"A developer configures an MCP server named `github` that exposes a `list_issues` tool. To auto-approve only this specific tool, without granting access to any other tool on the server, which entry should be added to `allowedTools`?","o":["mcp__github__list_issues","github__list_issues","mcp__github__*","list_issues__github"],"a":[0],"m":false,"x":"Correct. MCP tool names follow the pattern mcp__{server_name}__{tool_name}, so this fully qualified name approves only list_issues from the github server."},{"d":"tools","diff":3,"q":"A team building a Claude Code agent wants their custom database MCP tool to run without permission prompts, but they do not want to disable other safety prompts elsewhere in the agent. Which approach achieves this?","o":["Add the specific tool name, such as \"mcp__db__query\", to allowedTools","Set permissionMode to \"bypassPermissions\" for the entire session","Set permissionMode to \"acceptEdits\" so MCP calls are approved automatically","Remove the tool from the \"tools\" array so Claude always asks before calling it"],"a":[0],"m":false,"x":"Correct. Listing the exact MCP tool name in allowedTools auto-approves only that tool, scoping the exception narrowly instead of disabling broader safety checks."},{"d":"tools","diff":3,"q":"An architect is documenting the capabilities that a new MCP server will expose to connected clients. Which three capability categories does the MCP specification define for servers? (Select all that apply.)","o":["Resources","Tools","Prompts","Webhooks","Middleware","Endpoints"],"a":[0,1,2],"m":true,"x":"Correct. Resources are file-like data a client can read, such as API responses or file contents."},{"d":"tools","diff":3,"q":"A developer needs to give Claude access to internal pricing logic that depends on private application state already loaded in memory. They want to avoid the overhead of running and managing a separate server process. Which approach best fits this requirement?","o":["Define the tool with tool()/@tool and register it via an SDK MCP server that runs in-process","Publish the logic as a stdio server launched with a shell command at query time","Expose the logic over an HTTP endpoint and connect to it with \"type\": \"http\"","Package the logic as an SSE server so the agent can stream results back"],"a":[0],"m":false,"x":"Correct. SDK MCP servers created with createSdkMcpServer/create_sdk_mcp_server run in-process inside the application, so custom functions can access in-memory state directly without a separate process or network hop."},{"d":"tools","diff":3,"q":"A developer is writing a custom MCP tool that only queries data and never modifies anything. They want Claude to be able to call this tool alongside other non-modifying tools in parallel rather than one at a time. What should they do when defining the tool?","o":["Set the readOnlyHint annotation to true on the tool definition","Set the destructiveHint annotation to true on the tool definition","Set the idempotentHint annotation to true on the tool definition","Increase the tool's timeout so parallel calls do not fail"],"a":[0],"m":false,"x":"Correct. readOnlyHint signals the tool does not modify its environment, which controls whether Claude can batch it for parallel execution with other read-only tools."},{"d":"tools","diff":3,"q":"A newly added MCP server takes over a minute to initialize its internal cache before it can respond to requests, and the agent's connection to it is failing. The default MCP connection timeout is 30 seconds. What should the developer do to resolve this without changing the server's startup behavior?","o":["Raise the MCP_TIMEOUT environment variable to allow more startup time","Switch the server from stdio to an HTTP transport to skip the timeout","Add the server's tools to allowedTools so the connection is pre-approved","Reduce the number of tools the server exposes so it starts faster"],"a":[0],"m":false,"x":"Correct. MCP server connections time out after 30 seconds by default; raising MCP_TIMEOUT (in milliseconds) gives a slow-starting server more time to connect."},{"d":"tools","diff":3,"q":"An application needs to connect to a remote MCP server that requires OAuth 2.1 authorization. The Agent SDK does not perform the OAuth flow automatically. How should the developer supply credentials to the server?","o":["Complete the OAuth flow in the application, then pass the resulting access token in the server's headers","Store the OAuth client secret directly in the mcp_servers \"env\" field for the HTTP server","Configure the server as stdio and pass the access token as a command-line argument","Skip authorization and rely on the server's default anonymous access tier"],"a":[0],"m":false,"x":"Correct. Since the SDK does not automate OAuth flows, the application must complete authorization itself and pass the resulting access token via an Authorization header on the HTTP/SSE server configuration."},{"d":"tools","diff":3,"q":"A Python developer defines a custom tool with the @tool decorator and needs Claude to receive the result as machine-readable structuredContent alongside the tool's text output. What must they do to achieve this?","o":["Run a standalone MCP server instead of the in-process @tool decorator, since it only forwards content and is_error","Add structuredContent as a key in the dict returned from the handler and rely on the SDK to forward it","Wrap the JSON result inside a text content block, since text blocks are always structured","Switch the input schema from a plain dict to a full JSON Schema dict"],"a":[0],"m":false,"x":"Correct. The Python @tool decorator only forwards \"content\" and \"is_error\" from the handler's return dict, so returning structuredContent from Python requires running a standalone MCP server instead."},{"d":"tools","diff":3,"q":"A custom tool fetches a photo from a URL and needs to return it so Claude can visually interpret it. The developer already has the image bytes in memory. How should the image be included in the tool result's content array?","o":["As an image block with the raw bytes base64-encoded in \"data\" and a required \"mimeType\" field","As an image block containing the original source URL in a \"url\" field","As a text block containing a data URI with a \"data:image/...;base64,\" prefix","As a resource block with the image bytes placed in the \"text\" field"],"a":[0],"m":false,"x":"Correct. An image content block carries the image as base64-encoded bytes in \"data\", with no URL field, and mimeType is required so Claude knows how to interpret the bytes."},{"d":"tools","diff":3,"q":"A tool generates a markdown report and returns a resource block with uri \"file:///tmp/report.md\" and the report text inline in the resource's \"text\" field. A developer later assumes the SDK will read the report from that filesystem path if needed again. Is this assumption correct?","o":["No, the uri is only a label Claude can reference; the actual content already rode along in the \"text\" field","Yes, the SDK automatically re-reads the file at that path whenever the resource is referenced again","No, resource blocks are discarded after the turn and cannot be referenced again under any circumstance","Yes, but only if the resource block also sets \"blob\" instead of \"text\""],"a":[0],"m":false,"x":"Correct. The resource's uri is an identifier or label for Claude to reference; it is not a path the SDK reads from. The actual content travels inline in \"text\" (or \"blob\" for binary data)."},{"d":"tools","diff":3,"q":"An agent is configured with dozens of MCP tools across several servers, and the team notices that tool definitions are consuming a large share of the context window on every turn even when most tools go unused. What is the most direct way to address this?","o":["Enable tool search so definitions are withheld from context and loaded only when Claude needs them","Move every MCP server from stdio to HTTP transport to reduce payload size","Set permissionMode to \"bypassPermissions\" so fewer messages are exchanged per turn","Reduce MCP_TIMEOUT so unused server connections close faster"],"a":[0],"m":false,"x":"Correct. Tool search withholds tool definitions from context by default and loads only the ones Claude needs for a given turn, directly reducing context consumption from a large tool set."},{"d":"tools","diff":3,"q":"A developer configures a stdio MCP server for GitHub that requires a personal access token, launched by running a local npx command. Which three of the following fields are valid parts of that server's configuration object? (Select all that apply.)","o":["command","args","env","url","headers","port"],"a":[0,1,2],"m":true,"x":"Correct. \"command\" specifies the executable to run for a stdio server, such as \"npx\"."},{"d":"tools","diff":3,"q":"A developer is writing the handler for a custom MCP tool and wants to know which block types are valid inside the \"content\" array returned to Claude. Based on the tool result schema, which three of the following are valid content block types? (Select all that apply.)","o":["text","image","resource","video","embedding","function_call"],"a":[0,1,2],"m":true,"x":"Correct. \"text\" is a standard content block type used for plain text results."},{"d":"tools","diff":3,"q":"During rollout, an agent's system init message reports one MCP server with status \"failed\". The on-call engineer needs to narrow down the cause before escalating. Which three of the following are documented, plausible causes of a server showing \"failed\" status? (Select all that apply.)","o":["Required environment variables or credentials were not set for the server","The server package is not installed, or its runtime is missing from PATH","A remote server's URL is unreachable due to network or firewall restrictions","The agent's model was recently upgraded to a newer Claude version","The allowedTools list uses a wildcard instead of individually named tools","The tool result exceeded the MAX_MCP_OUTPUT_TOKENS limit for a single call"],"a":[0,1,2],"m":true,"x":"Correct. Missing environment variables or credentials is a documented cause of stdio server connection failures."},{"d":"tools","diff":3,"q":"A team defines their MCP servers in a `.mcp.json` file at the project root instead of passing them in code, then calls `query()` with an explicit `settingSources` list that only includes `\"user\"`. The servers do not load. What is the most likely reason?","o":["The \"project\" source must be included in settingSources for .mcp.json to be picked up","The .mcp.json file must be renamed to match the server name used in mcpServers","Config-file servers only load when mcpServers is also passed in code as a fallback","The \"user\" source disables all MCP servers regardless of where they are defined"],"a":[0],"m":false,"x":"Correct. The .mcp.json file is loaded when the \"project\" setting source is enabled; explicitly setting settingSources to only \"user\" excludes \"project\", so the file is never read."},{"d":"tools","diff":3,"q":"An application must guarantee that Claude calls the `submit_refund` tool on every turn of a specific workflow step, and that no other tool is used in its place. Which `tool_choice` configuration achieves this?","o":["`{\"type\": \"tool\", \"name\": \"submit_refund\"}`","`{\"type\": \"any\"}`","`{\"type\": \"auto\"}` combined with a user-message instruction to prefer `submit_refund`","`{\"type\": \"none\"}` with the tool listed first in the `tools` array"],"a":[0],"m":false,"x":"Correct. Setting `tool_choice` to the `tool` type with the specific tool name forces Claude to always use that particular tool, which is the only option that guarantees `submit_refund` specifically rather than any tool."},{"d":"tools","diff":3,"q":"A custom `fetch_invoice` client tool calls a downstream billing API. During a load spike the API begins returning HTTP 503 responses. The engineering team wants Claude to recognize the failure, explain it to the user, and avoid treating the 503 body as valid invoice data. How should the tool result be constructed for this call?","o":["Return a `tool_result` block with `tool_use_id` set to the original call's id, `content` describing the 503 and suggesting a retry window, and `is_error` set to `true`","Return a `tool_result` block with `content` set to the raw 503 response body and omit `is_error` so Claude infers failure from the body text","Skip returning a `tool_result` for that `tool_use_id` and instead send a plain `text` block explaining the outage","Return a `tool_result` block with `content` empty and `is_error` set to `false` so the conversation continues without drawing attention to the failure"],"a":[0],"m":false,"x":"Correct. Setting `is_error: true` explicitly marks the call as failed rather than letting Claude parse ambiguous data, and an instructive message (what failed, what to try next) gives Claude the context needed to inform the user or retry appropriately."},{"d":"tools","diff":3,"q":"While assembling a `tool_result` message that also contains a short note for the user, a developer writes the following content array: a `text` block reading \"Here are the results:\" followed by the `tool_result` block for the prior `tool_use`. The API rejects the request. What is the correct ordering rule being violated?","o":["Within a user message, all `tool_result` blocks must come before any `text` blocks in the content array","The `tool_use_id` referenced by the `tool_result` must match the `id` of the most recent assistant message, not any earlier one","A user message may contain only one `tool_result` block per turn, so the extra `text` block caused the request to exceed that limit","The `content` field inside a `tool_result` must always be a string, never a nested array of blocks such as `text`"],"a":[0],"m":false,"x":"Correct. Anthropic's tool-result formatting rules require tool_result blocks to come first in the content array of a user message, with any accompanying text placed after them; placing text before the tool_result is what triggers the 400 error."},{"d":"tools","diff":3,"q":"A security review requires that a specific destructive shell pattern, `rm -rf *`, always be blocked regardless of any other configuration, including future changes to permission mode. Which rule configuration satisfies this requirement, based on how the SDK's permission evaluation order treats deny rules?","o":["Add `\"Bash(rm -rf *)\"` to `disallowed_tools`, since scoped deny rules are checked before the permission-mode step and block matching calls even under `bypassPermissions`","Add `\"Bash\"` (the bare tool name) to `disallowed_tools`, since this blocks only the dangerous pattern while leaving other Bash commands available","Add `\"Bash(rm -rf *)\"` to `allowed_tools` with a comment marking it as forbidden, since allow rules are evaluated last and can override later approvals","Set `permission_mode` to `\"plan\"`, since plan mode permanently blocks all Bash commands across every future session"],"a":[0],"m":false,"x":"Correct. Deny rules are evaluated early in the permission flow, before the permission-mode step, and a scoped rule like `Bash(rm -rf *)` blocks matching calls in every mode, including `bypassPermissions`, while leaving other `Bash` calls available and subject to normal evaluation."},{"d":"tools","diff":3,"q":"A team building an internal MCP server needs to decide on a transport. Their server is a database driver that must run as a local subprocess on the same machine as the agent, communicating over standard input and output, and they will invoke it via a command such as `npx my-db-server`. Which transport type should they configure in `mcpServers`?","o":["stdio, configured with `command` and `args`, since it is the transport for local processes that communicate via stdin/stdout","`type: \"http\"` with a `url` field, since HTTP is required for any server that accepts a `command` to launch it","`type: \"sse\"`, since SSE is the only transport that supports passing environment variables like database credentials","An SDK MCP server built with `createSdkMcpServer`, since any server launched via a shell command must run in-process"],"a":[0],"m":false,"x":"Correct. stdio servers are local processes that communicate via stdin/stdout and are configured with a `command` (such as `npx`) and `args`; this matches exactly the scenario of a local subprocess database driver invoked by a launch command."},{"d":"tools","diff":3,"q":"During a query, the `system` init message reports that the `data-processor` MCP server has `status: \"failed\"`, but the agent proceeds and later Claude attempts to call one of that server's tools. What is the most defensible way for the application to have handled this at the start of the query?","o":["Inspect the `mcp_servers` field of the `system` init message, detect any server whose `status` is not `\"connected\"`, and surface a warning or halt the workflow before Claude begins relying on that server's tools","Ignore the init message, since MCP connection failures are always retried automatically by the SDK before any tool call is attempted","Wait for a `result` message with subtype `\"error_during_execution\"` before taking any action, since the init message's `status` field is only informational and not meant to be checked programmatically","Remove the failed server from `mcpServers` after the query completes, since connection status can only be determined retroactively from the final result"],"a":[0],"m":false,"x":"Correct. The SDK emits a `system` message with subtype `init` at the start of each query that includes per-server connection status; checking `mcp_servers` for any status other than `\"connected\"` lets the application detect and react to failures before the agent starts relying on that server's tools."},{"d":"tools","diff":3,"q":"A finance workflow needs Claude to run read-only SQL queries against a production Postgres database via the community Postgres MCP server, but must never allow write statements like `INSERT`, `UPDATE`, or `DROP` to execute, even accidentally. Given that the server exposes a single `query` tool with no separate read/write tool split, what configuration best enforces this constraint at the agent layer?","o":["Set `permission_mode` to `bypassPermissions` so every call to `mcp__postgres__query` executes immediately without friction, and rely on the database's own row-level security to prevent writes","Add `mcp__postgres__query` to `allowedTools` so the query tool runs without a permission prompt, and separately configure the database connection or role used by the MCP server itself with read-only privileges","List `mcp__postgres__query` in `disallowedTools` so the tool is completely removed from Claude's context, preventing it from ever being used for any query, read or write","Omit the `postgres` server from `mcpServers` entirely and have Claude describe the SQL it would run in plain text instead"],"a":[1],"m":false,"x":"Correct. Since the tool itself has no read/write split, permission settings on the tool call can only gate whether the query tool runs at all; the actual read-only guarantee must come from the underlying database credential or role the MCP server connects with, while `allowedTools` avoids unnecessary prompts for the now-safe, read-only-scoped tool. This mirrors the documented example of allowing only the `query` tool while noting write protection is a database-level concern."},{"d":"tools","diff":3,"q":"An agent's system prompt says nothing special about tool usage, and its `tools` array includes a `lookup_order_status` tool. A user asks, \"What's your return policy?\" — information already covered in Claude's general instructions and not requiring live data. What does Claude do by default with `tool_choice` left unset, and why?","o":["Claude responds directly without calling `lookup_order_status`, because the default `tool_choice` of `auto` lets Claude decide per turn, and it calls a tool only when the request maps to that tool's capability and the answer isn't already available","Claude always calls `lookup_order_status` first before answering any question, because any tool present in the `tools` array is invoked once per turn regardless of relevance","Claude refuses to answer until a tool is explicitly forced via `tool_choice`, because leaving `tool_choice` unset defaults to `none` whenever any tools are configured","Claude calls `lookup_order_status` with empty parameters as a no-op, because the API requires at least one tool call per turn whenever tools are present"],"a":[0],"m":false,"x":"Correct. With the default `tool_choice` of `auto`, Claude determines each turn whether to call a tool based on whether the request maps to a tool's described capability and whether the answer is already in context; a general policy question that doesn't require live order data would be answered directly rather than triggering an irrelevant tool call."},{"d":"tools","diff":3,"q":"A developer is deciding how to expose an internal reporting capability to Claude and is choosing between an Anthropic-schema client tool (like the bash or text editor tool), a fully custom client tool, and a server tool. The capability must call the company's private reporting database, which Anthropic's infrastructure cannot reach. Which statements correctly explain why a client tool is the right category and how server tools differ? (Select all that apply.)","o":["A fully custom client tool is appropriate because the developer's application executes the operation after Claude emits a `tool_use` block, giving it a path to reach the private database that Anthropic's infrastructure has no access to","Claude's response for a client tool call carries `stop_reason: \"tool_use\"`, signaling that the application, not Anthropic, must run the operation and return a `tool_result`","An Anthropic-schema client tool such as `bash` can be freely repointed at any private internal service simply by changing the tool's `name` field, making it equally suitable here","Server tools such as web search, web fetch, and code execution run on Anthropic's infrastructure and are not a general mechanism for reaching an arbitrary private, customer-owned database","A server tool is equally appropriate here because Anthropic is automatically granted network access to any customer's private database once the tool is declared in the request"],"a":[0,1,3],"m":true,"x":"Correct. Client tools are the category where Claude returns a `tool_use` block that the developer's own application executes; this is the only path that can use the company's private network access and credentials, since Anthropic's infrastructure has no access to that private database."},{"d":"tools","diff":3,"q":"A main agent configured with `permission_mode=\"bypassPermissions\"` spawns a subagent via the `Agent` tool to perform a narrowly scoped code review task, with the subagent's own definition listing only `Read`, `Glob`, and `Grep` in its `tools` field. Which statements correctly describe the resulting permission behavior for the subagent? (Select all that apply.)","o":["The subagent inherits `bypassPermissions` from the parent, and this inherited mode cannot be overridden on a per-subagent basis","Because `bypassPermissions` auto-approves tool calls that reach that step, the subagent effectively has broader operational access than its `tools` list alone might suggest, since it may have a different, less constrained system prompt than the main agent","An explicit `ask` rule configured in settings would still force a prompt for a matching call, even though the parent uses `bypassPermissions`","Subagents always run under `default` permission mode regardless of the parent's mode, since subagent execution is fully isolated from parent permission settings","Listing `Read`, `Glob`, and `Grep` in the subagent's `tools` field guarantees those are the only tools it could ever call, fully compensating for the inherited `bypassPermissions` mode"],"a":[0,1,2],"m":true,"x":"Correct. Documentation explicitly warns that when the parent uses `bypassPermissions`, `acceptEdits`, or `auto`, all subagents inherit that mode and it cannot be overridden per subagent."},{"d":"tools","diff":3,"q":"A platform team is hardening its MCP configuration for a customer-facing agent. Which of the following configuration choices correctly follow documented guidance for authentication and tool access control over MCP? (Select all that apply.)","o":["Passing the GitHub token through the stdio server's `env` field (`GITHUB_TOKEN: process.env.GITHUB_TOKEN`) rather than embedding it directly in the command string","Using `allowedTools: [\"mcp__github__*\"]` to auto-approve every tool from a specific, deliberately chosen server, rather than reaching for `permissionMode: \"bypassPermissions\"` to unblock MCP calls generally","For a remote HTTP MCP server, placing a bearer token in the `headers` field of the server configuration rather than appending it to the URL as a query parameter","Relying on `permissionMode: \"acceptEdits\"` to auto-approve MCP tool calls, since accept-edits mode is documented as covering both file edits and MCP tool execution","Configuring every MCP server the team has ever evaluated in `mcpServers` and setting `allowedTools: [\"mcp__*\"]` so the agent always has maximum optionality regardless of the task at hand"],"a":[0,1,2],"m":true,"x":"Correct. The documented pattern for stdio server authentication is passing credentials through the `env` field so they aren't hardcoded into the command or args."},{"d":"tools","diff":3,"q":"A fintech startup is building an internal support agent with the Claude Agent SDK. The agent must look up account balances from a proprietary ledger service reachable only through an internal REST gateway with no existing MCP server or public SDK. Which approach best fits this requirement?","o":["Define a custom tool that calls the internal REST gateway and register it through an in-process MCP server","Rely on the built-in WebFetch tool to query the gateway directly from the agent's prompt","Write a Skill that documents the ledger schema and expects Claude to reason about balances from memory","Search for a community MCP server that might expose a similar ledger balance capability"],"a":[0],"m":false,"x":"Correct: a custom tool wraps the handler logic for calling the proprietary gateway and is registered via create_sdk_mcp_server/createSdkMcpServer, giving Claude a purpose-built function for this internal system."},{"d":"tools","diff":3,"q":"A platform team keeps pasting the same multi-step production deployment checklist into chat every time someone ships a release, and the steps sometimes get skipped when typed manually. What is the most appropriate way to address this in Claude Code?","o":["Capture the checklist as a Skill invoked with a slash command like /deploy","Add the entire checklist as a permanent block inside CLAUDE.md","Configure an MCP server that exposes the checklist as a resource","Create a custom tool whose handler prints the checklist to the transcript"],"a":[0],"m":false,"x":"Correct: a repeated multi-step procedure pasted into chat is the canonical trigger for turning it into a Skill, which loads on demand via /deploy instead of being retyped."},{"d":"tools","diff":3,"q":"An engineering team already has a working internal Slack bot with OAuth handled by Anthropic's published Slack MCP server. They now want Claude Code to post release notes to a channel. What should they do instead of writing a custom tool from scratch?","o":["Connect the existing Slack MCP server so Claude reuses its messaging tools and authentication","Write a custom tool whose handler re-implements the Slack Web API client and OAuth refresh flow","Create a Skill that contains hard-coded Slack API request examples to copy manually","Use the built-in Bash tool to call curl against the Slack API endpoints from the shell"],"a":[0],"m":false,"x":"Correct: when a maintained MCP server already exists for a service, connecting to it reuses its authentication and tool definitions instead of duplicating that work in a custom tool."},{"d":"tools","diff":3,"q":"A developer defines a custom tool named get_temperature and registers it inside an in-process MCP server created with the key \"weather\" in mcp_servers. Which fully qualified name must appear in allowed_tools for Claude to call it without a permission prompt?","o":["mcp__weather__get_temperature","weather.get_temperature","mcp__get_temperature__weather","get_temperature@weather"],"a":[0],"m":false,"x":"Correct: MCP tool names follow the pattern mcp__{server_name}__{tool_name}, so the server key \"weather\" and tool name \"get_temperature\" combine into mcp__weather__get_temperature."},{"d":"tools","diff":3,"q":"A custom tool's handler only reads data from a third-party pricing API and never mutates any state. The developer wants Claude to be able to call this tool alongside other non-mutating tools in the same turn instead of running them one at a time. What should the developer add to the tool definition?","o":["Set the readOnlyHint annotation to true on the tool","Set the idempotentHint annotation to true on the tool","Set the openWorldHint annotation to false on the tool","Set the destructiveHint annotation to false on the tool"],"a":[0],"m":false,"x":"Correct: readOnlyHint tells Claude the tool has no side effects, which is the annotation that controls whether the tool can be batched for parallel calls with other read-only tools."},{"d":"tools","diff":3,"q":"A team wants Claude Code to never even see or attempt the built-in Bash tool for a locked-down agent deployment, not just be blocked from running specific commands. Which configuration achieves this?","o":["Omit Bash from the tools array, or list the bare name \"Bash\" in disallowedTools, so it is removed from context entirely","Add a scoped disallowedTools rule such as \"Bash(rm *)\" so risky commands are denied while the tool stays visible","Leave Bash in tools but exclude it from allowedTools so every call requires a manual permission prompt","Add Bash to allowedTools with an empty argument list so it auto-approves but performs no actions"],"a":[0],"m":false,"x":"Correct: omitting a built-in from the tools array, or using a bare disallowedTools entry, controls availability, removing the tool from Claude's context so it is never attempted."},{"d":"tools","diff":3,"q":"A team builds a Skill that automatically rotates API credentials and deletes the old ones when triggered. They want to guarantee that only a human explicitly running /rotate-credentials can invoke it, never Claude deciding on its own that the task is relevant. What should they configure in the Skill's frontmatter?","o":["Set disable-model-invocation: true so the Skill stays hidden until manually invoked","Set context: fork so the Skill always executes inside an isolated subagent","Leave the default frontmatter so the description loads for Claude every session","Remove the description field so Claude cannot match it against any task"],"a":[0],"m":false,"x":"Correct: disable-model-invocation: true hides the Skill from Claude's automatic matching entirely, so it only runs when a person explicitly triggers /rotate-credentials, which fits a side-effecting action."},{"d":"tools","diff":3,"q":"An Agent SDK application registers dozens of internal MCP tools across several servers, and the team notices this inflates the context sent on every turn even when most tools go unused in a given session. What is the recommended way to scale to this many tools without paying that constant context cost?","o":["Adopt tool search so tool schemas are discovered and loaded on demand instead of all being listed up front","Move every tool definition into CLAUDE.md so descriptions load once per session instead of per turn","Convert all the custom tools into Skills so their content only loads when Claude decides to use them","Disable permission prompts for every tool so Claude can call them without additional context overhead"],"a":[0],"m":false,"x":"Correct: tool search lets an agent scale to thousands of tools by discovering and loading only the schemas needed for the current task, avoiding the fixed per-turn cost of listing every tool."},{"d":"tools","diff":3,"q":"A custom tool renders a chart image from time-series data, and a downstream part of the agent's workflow needs the exact numeric data points as structured fields rather than parsed out of a text description. How should the tool handler return this?","o":["Return the chart as an image content block and include the raw data points in structuredContent","Return only a text content block that lists the data points formatted as a comma-separated string","Return the data points inside a resource block's blob field alongside the rendered chart","Return the chart as an image block and repeat the data points again as a second text block"],"a":[0],"m":false,"x":"Correct: structuredContent is a separate JSON field on the result meant for machine-readable data; combined with an image block for the chart, this gives Claude both the visual and exact numeric fields."},{"d":"tools","diff":3,"q":"A data team has an MCP server connected that lets Claude query their PostgreSQL warehouse, but new engineers keep asking Claude to join the wrong tables and misuse deprecated columns. Which addition best solves this without changing the MCP connection itself?","o":["Add a Skill documenting the schema, table relationships, and preferred query patterns for the warehouse","Replace the MCP server with a custom tool that hardcodes one fixed SQL query for every request","Move the database connection string into CLAUDE.md so it loads at the start of every session","Disable the MCP server's tool search so every table's full schema always stays in context"],"a":[0],"m":false,"x":"Correct: MCP already provides the connection and query execution; a Skill adds the knowledge of which tables and columns to use, which is exactly the kind of usage guidance the query is missing."},{"d":"tools","diff":3,"q":"A developer has the same MCP server name \"analytics\" configured at the user scope, the project scope, and also started locally for the current session with different connection settings at each level. Per the documented scope hierarchy, which configuration does Claude actually use?","o":["The local session-level configuration, since MCP servers override by name with local taking precedence over project and user","The user-level configuration, since user settings are meant to apply consistently across every project","The project-level configuration, since project settings are considered the canonical source for a shared codebase","All three configurations merge together into a single combined connection for the \"analytics\" server"],"a":[0],"m":false,"x":"Correct: MCP servers override by name following the precedence local > project > user, so the locally started session configuration for \"analytics\" wins over the other two."},{"d":"tools","diff":3,"q":"A team has connected an MCP server that gives Claude tools to query their internal order-management API. Engineers still find that Claude frequently picks the wrong endpoint for edge cases like partial refunds. Based on how MCP and Skills are meant to divide responsibilities, what is missing?","o":["A Skill that teaches Claude which endpoint and parameters fit scenarios like partial refunds","A second MCP server that duplicates the same order-management tools under a new name","A hook that blocks every call to the order-management tools regardless of scenario","A subagent whose only job is re-exposing the same MCP tools inside an isolated context"],"a":[0],"m":false,"x":"Correct: MCP supplies the connection and raw tools, while a Skill supplies the knowledge of how to use those tools correctly for specific scenarios, which is exactly the gap described."},{"d":"tools","diff":3,"q":"A support team wants Claude to automatically recognize when a user's question matches their troubleshooting playbook and apply it, without anyone having to type a slash command. Which Skill configuration supports this behavior?","o":["The default frontmatter, so the Skill's description loads every session and Claude can match it against relevant tasks","disable-model-invocation: true, so the Skill only loads when a person explicitly types its slash command","A frontmatter setting that removes the description field entirely so Claude cannot see the Skill at all","context: fork with no description, so the Skill runs invisibly inside a subagent Claude cannot reference"],"a":[0],"m":false,"x":"Correct: by default, a Skill's description loads at session start, letting Claude match the description against a user's task and load the full content automatically when relevant."},{"d":"tools","diff":3,"q":"A custom tool generates a compliance report file that a later step in the same conversation needs to reference by name without re-sending its full contents inline. Which content block type is designed for this?","o":["A resource block carrying a URI label alongside the report content","A plain text block containing only the file name as a string","An image block encoding the report as a base64 screenshot","A structuredContent field containing just the file's path string"],"a":[0],"m":false,"x":"Correct: a resource block embeds content identified by a URI, which is exactly the pattern for something that should be addressable by name later, such as a generated report."},{"d":"tools","diff":3,"q":"A small internal tool needs to read files, run shell commands, and search a codebase for a one-off refactor task using the Claude Agent SDK. No external systems or custom domain logic are involved. What is the most appropriate starting point?","o":["Use the SDK's built-in tools such as Read, Edit, Bash, Glob, and Grep without building any custom tools or MCP servers","Build a custom tool for reading files and another for running shell commands before writing any code","Connect an external MCP server that reimplements filesystem and shell access over a network protocol","Write a Skill containing instructions for how to read files and run commands in place of built-in tools"],"a":[0],"m":false,"x":"Correct: the Agent SDK includes built-in tools for reading files, running commands, and searching code out of the box, covering this task without any custom implementation."},{"d":"tools","diff":3,"q":"A developer is deciding whether a capability should be implemented as a custom tool or left to the built-in Tools in the Claude Agent SDK. Select the scenarios where building a custom tool is the appropriate choice.","o":["The agent must call a proprietary internal API with no built-in tool or MCP server covering it","The agent needs domain-specific logic, like a conversion table for the company's manufacturing process","The agent only needs to read and edit files already present in the working directory tree","The agent must run arbitrary shell commands and git operations during a coding session","The agent needs to query a database using credentials and query patterns unique to the schema"],"a":[0,1,4],"m":true,"x":"Correct: a proprietary internal API with no existing coverage is exactly the gap custom tools are meant to fill by wrapping a handler function for that specific system."},{"d":"tools","diff":3,"q":"In the Claude Agent SDK, tool access is controlled across two layers: availability (what Claude can see) and permission (what Claude can call without approval). Select the statements that correctly describe this system.","o":["Passing tools: [\"Read\", \"Grep\"] removes every unlisted built-in tool from context","Listing a tool in allowedTools pre-approves it but does not affect whether it appears in context","A scoped disallowedTools rule such as \"Bash(rm *)\" removes the entire Bash tool from context","A bare disallowedTools entry like \"Bash\" removes the tool the same way omitting it from tools would","Adding a tool to allowedTools also removes it from Claude's available context until called"],"a":[0,1,3],"m":true,"x":"Correct: the tools array controls availability, and listing only certain built-ins removes every unlisted one from Claude's context."},{"d":"tools","diff":3,"q":"A custom tool handler needs to return results to Claude using the content array in its result object. Select the content block types that are valid entries the MCP CallToolResult content array supports.","o":["text","image","resource","spreadsheet","webhook","chart"],"a":[0,1,2],"m":true,"x":"Correct: text is a standard content block type used to return plain textual results to Claude."},{"d":"apps","diff":3,"q":"A code-review agent is configured with a `PreToolUse` hook intended to log and gate every file-editing tool call, alongside `allowed_tools=['Edit', 'Write']` for convenience. During review, the team notices the hook's gating logic never actually runs for Edit or Write calls, even though the log lines do appear. Why does the gating portion of the hook fail to have any effect here, and what should the team do instead?","o":["Bare allow-listed tools like `Edit` and `Write` are auto-approved before `canUseTool` and other later checks are consulted, but hooks run first in the evaluation order and a hook's deny result is enforced; the team should confirm the hook actually returns a deny decision rather than only logging, since a hook that returns allow or nothing lets the call proceed to auto-approval.","Hooks are only invoked for MCP tools and never fire for built-in tools such as `Edit` and `Write`; the team should implement the gating inside a `canUseTool` callback instead, where the callback receives the tool name and input, evaluates the request against review policies, and returns a deny result to block any edit that does not meet the criteria, because `canUseTool` is consulted for every tool call and its denial prevents the tool from executing at all.","`PreToolUse` hooks are strictly for logging and cannot enforce a block even when returning a denial; to achieve the gating, the team should switch to a `PostToolUse` hook that examines the tool output for file modifications, and returns a deny if the edit does not pass review, which causes the agent to discard the result and treat the tool call as failed, thereby preventing unwanted changes from persisting.","The `allowed_tools` configuration suppresses hook execution for any tool it names, so the gating hook is never reached for `Edit` and `Write`; the team should therefore remove `Edit` and `Write` from `allowed_tools`, allowing the `PreToolUse` hook to run for every tool call, and have the hook return a deny result to block changes that do not meet the review requirements, relying on the hook's own gating rather than the tool whitelist."],"a":[0],"m":false,"x":"Correct. Hooks run first in the permission evaluation order and can deny a call outright; the fact that log lines appear shows the hook is executing, so the likely issue is that its gating logic isn't returning an explicit deny, letting the request continue on to the allow-rule step, where `Edit` and `Write` being bare-listed in `allowed_tools` auto-approves them and skips any downstream `canUseTool` callback."},{"d":"prompt","diff":3,"q":"A production agent connects to several MCP servers, each exposing many tools, and the team is concerned about the context cost of tool schemas before the agent has done any work. What is the most effective way to reduce this upfront context cost, and when does it fail to apply?","o":["Rely on MCP tool search to load tool schemas on demand, but this falls back to loading all tool schemas upfront when deployed on Google Cloud's Agent Platform or behind a non-first-party ANTHROPIC_BASE_URL.","Disable prompt caching for the session, since caching forces every MCP server to load its full tool schema into the context before any tools are invoked, causing the agent to bear the cost of all schemas from the start.","Reduce max_turns to a low value, so that the agent's execution terminates before it reaches the point of calling most MCP tools, thereby never incurring the context cost of loading their schemas into the initial prompt.","Move all MCP servers into a single subagent definition, so that all tool schemas are confined to that subagent and do not appear in the main agent's initial context, thereby eliminating the upfront schema cost for the primary agent."],"a":[0],"m":false,"x":"Correct. MCP tool search defers loading of tool schemas until they are needed, reducing the initial context cost. However, it degrades to loading all schemas upfront on Google Cloud's Agent Platform or when using a non-first-party ANTHROPIC_BASE_URL, reverting to the full upfront cost in those environments."},{"d":"sec","diff":3,"q":"A healthcare startup needs to process protected health information (PHI) through the Claude API while supporting their HIPAA compliance obligations. They are deciding between requesting a Zero Data Retention (ZDR) arrangement or HIPAA readiness with a signed BAA. Which statement correctly describes how to choose between these two arrangements?","o":["When an organization handles PHI, HIPAA readiness with a signed BAA is the appropriate arrangement; it provides encryption, access controls, and audit logging without requiring immediate deletion, so ZDR is not necessary.","ZDR and HIPAA readiness must always both be enabled together on the same organization, since HIPAA readiness lacks independent encryption, access controls, and audit logging, so organizations handling PHI must request both arrangements through Anthropic's setup process.","ZDR is the only Anthropic arrangement that supports PHI processing because HIPAA readiness was deprecated for new organizations, so the startup must explicitly request ZDR and cannot rely on a BAA from Anthropic to meet compliance.","Both arrangements are automatically enabled for every organization by default when the first API key is created in the Anthropic Console, so the startup can process PHI immediately without requesting ZDR or a BAA through Anthropic's sales or support team."],"a":[0],"m":false,"x":"Correct. For organizations handling PHI, Anthropic designates HIPAA readiness with a signed BAA as the appropriate arrangement. It provides required safeguards including encryption, access controls, and audit logging, without mandating immediate data deletion, so ZDR is not additionally needed."},{"d":"eval","diff":3,"q":"During a traffic spike, an application starts receiving HTTP 529 responses from the Messages API alongside occasional 429 responses. The on-call engineer needs to explain the difference to the team so they choose the right mitigation. Which explanation correctly distinguishes the two and points to the right mitigation for each?","o":["529 overloaded_error indicates temporary congestion across all API users and should be retried with exponential backoff; 429 rate_limit_error signals that the organization's own limit was exceeded or usage spiked, requiring smoothing request volume or requesting a higher limit.","529 overloaded_error and 429 rate_limit_error are two names for the identical condition of temporary server overload, so either can be resolved by increasing the client's configured max-retries value and applying exponential backoff with jitter across all API calls, since both codes indicate the same backend capacity constraint.","529 overloaded_error means the organization exceeded its monthly spend cap, requiring an account tier upgrade or waiting for the next billing cycle, while 429 rate_limit_error means a single request exceeded the maximum allowed payload size, requiring reducing the request body or splitting data into multiple smaller requests.","529 overloaded_error is returned only for the Message Batches API and should be mitigated by reducing batch sizes or spreading submissions over time, while 429 rate_limit_error is returned only for streaming Messages API requests and should be mitigated by reducing streaming connection rate or requesting a higher per-connection limit."],"a":[0],"m":false,"x":"Correct. A 529 overloaded_error means the API is temporarily congested across all users, so retrying with exponential backoff is appropriate. A 429 rate_limit_error indicates the organization's own limit was exceeded or usage spiked, so smoothing request volume or requesting a higher limit is the proper mitigation."},{"d":"prompt","diff":3,"q":"A subagent is defined to automatically spawn further subagents to divide up its own workload, and those in turn may spawn more. What govern
