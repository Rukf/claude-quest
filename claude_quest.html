e contract at the top of the prompt and position the instructions and question after it, since retrieving the query following long-form text is known to enhance answer accuracy on intricate, multi-section documents.","Split the contract into ten separate API calls, each handling roughly a tenth of the text, and process them sequentially to keep each call under a few thousand tokens, since Claude is documented to reason more effectively over shorter passages.","Keep the document and instructions in their current order but repeat the query three times interspersed throughout the prompt, so the model encounters the request multiple times and cannot overlook it regardless of position.","Run the contract through an extractive summarizer first and discard roughly half of the original clauses, retaining only the most salient sections, so the remaining text fits under the context window and the model can focus on key terms."],"a":[0],"m":false,"x":"Correct. This ordering follows Anthropic's long-context guidance to place long documents near the top and the query last, which helps the model attend to relevant details in complex, multi-section documents. This is the recommended practice when working with large contracts."},{"d":"apps","diff":3,"q":"An agent maintains a long-running conversation where the system prompt and tool definitions stay fixed, but each turn appends a new image the user uploads. The engineering team notices that after every image is added, the next request re-writes the messages cache from scratch instead of reading from cache. Why does this happen?","o":["Adding or removing images invalidates the system and messages cache levels, so the growing image history forces a fresh cache write on each turn where an image is introduced.","Images cannot be included in any cached content block, so every turn containing an image completely bypasses the cache layer and forces a fresh, uncached request that rewrites the messages from the beginning.","The 20-block lookback window only applies to text content, so any image block inserted creates a new cache breakpoint that forces a complete messages cache rewrite on the next request.","Cache reads require every block to share the identical `cache_control` TTL value, and image blocks default to a different TTL than text blocks, so each new image causes a fresh cache write on next request."],"a":[0],"m":false,"x":"Correct. Adding or removing images invalidates the system cache and all downstream cache levels, including messages. Since each turn introduces a new image, this invalidates the cache hierarchy, forcing a fresh cache write on every request."},{"d":"apps","diff":3,"q":"A repository's `CLAUDE.md` has grown past 300 lines because it mixes general project conventions with narrow rules that only apply to files under `src/api/`. Adherence has degraded, and the team wants Claude to only load the API-specific rules into context when it is actually working with API files, while keeping the general conventions loaded every session. Which restructuring achieves this?","o":["Keep general conventions in `CLAUDE.md`, and place the API-specific rules in a file under `.claude/rules/` with `paths: [\\\"src/api/**/*\\\"]` frontmatter, so they load solely when Claude works with matching files.","Split `CLAUDE.md` into a root file with general conventions and `src/api/CLAUDE.md` with API-specific rules, so that Claude Code’s automatic scoping of nested `CLAUDE.md` files loads the API rules only when you work inside the `src/api` directory.","Wrap the API-specific rules in HTML comments inside `CLAUDE.md` using conditional markers like `<!-- if:src/api/**/* -->` and `<!-- endif -->`, so that Claude Code reveals those commented sections only when working with matching file paths.","Move the API-specific rules into a skill named `api-rules` with no trigger conditions, because skills are always loaded into context alongside `CLAUDE.md` at session start, making the rules available under a dedicated heading without manual activation."],"a":[0],"m":false,"x":"Correct. Path-scoped rules under `.claude/rules/` with `paths` frontmatter are the documented way to conditionally load rules based on file paths. This keeps general conventions in `CLAUDE.md`—loaded every session—while API-specific rules activate only when Claude works with files matching `src/api/**/*`, reducing context and improving adherence."},{"d":"tools","diff":3,"q":"A tool handler calls an external billing API. When the API returns a non-200 status, the developer wants Claude to see a clear explanation of which request failed and what to try next, rather than a bare exception string. How should the handler report this failure?","o":["Catch the failure and return an error result whose message includes only the status code, no hints.","Let the exception propagate uncaught so that Claude receives the raw exception text with the HTTP status code.","Return a successful result showing the HTTP status code as plain text, without an error flag, to let Claude parse it.","Throw the exception again after logging the status code to the console, letting the SDK pass the log lines to Claude."],"a":[0],"m":false,"x":"Correct. Catching the failure and returning an error result, even with only the status code, ensures Claude receives a structured error rather than a raw exception. The error result marks the failure explicitly, and Claude can use the status code to inform the user of the specific failure and suggest next steps."},{"d":"sec","diff":3,"q":"An engineering lead is designing a multi-layered guardrail strategy for a Claude-powered financial advisory chatbot that must comply with SEC and FINRA rules and must never leak client PII. They want defense in depth rather than relying on a single control. Which combination of layers reflects Anthropic's documented layered-guardrail approach?","o":["Implement a hardened system prompt with compliance and refusal directives, a pre-call harmlessness screen using a smaller model, and least-privilege scoping of any tools the assistant can invoke.","Only a hardened system prompt with detailed SEC and FINRA compliance directives, refusal behavior, and PII-handling instructions, relying on the model's reasoning to enforce guardrails directly, should be implemented.","Only by raising the model's extended thinking budget to its maximum value can the model internally reason through SEC and FINRA compliance and detect PII in user queries without external filters or tool restrictions.","Only a post-response regex filter that redacts dollar amounts, account numbers, and other PII patterns from the final assistant message before display, and scrubs any SEC or FINRA rule violations in the text output, should be used."],"a":[0],"m":false,"x":"Correct. This combination aligns with Anthropic's documented layered-guardrail approach, which recommends defense in depth through multiple independent safeguards. A hardened system prompt, a pre-call harmlessness screen, and least-privilege tool scoping together address different failure modes rather than relying on any single control."},{"d":"apps","diff":3,"q":"A company is building a support chatbot on the Agent SDK. It should not present itself as Claude Code, needs a distinct persona and name, and runs unattended with a narrow, pre-approved tool surface rather than a human approving each step. Which system prompt approach best fits this product?","o":["Write a custom system prompt that defines the bot's identity, scope, and needed tool-usage and safety guidance, since the product's surface and permission model differs from Claude Code's default.","Use the `claude_code` preset with `append` text describing a distinct persona and restricted tool set, since the preset provides reliable scaffolding while appending product-specific limitations.","Leave `systemPrompt` unset and convey the bot’s persona, tool restrictions, and safety constraints through the first user message of each unattended session while relying on the SDK’s default system prompt for basic agent behavior.","Load an output style file that sets `keep-coding-instructions: true` to preserve Claude Code's engineering guidance while adding a support persona, so the bot maintains reliable tool-use patterns alongside its customer-facing role."],"a":[0],"m":false,"x":"Correct. A custom system prompt is the best approach because the bot requires a distinct identity, scope, and tool surface that differ significantly from the Claude Code defaults. The Claude Code preset assumes a human-in-the-loop coding tool, which is inappropriate for an unattended support bot with a different persona and narrow tool permissions."},{"d":"model","diff":3,"q":"A developer is troubleshooting why prompt caching produces no measurable savings for a Claude Haiku 4.5-based classification service. The cached segment is a 3,500-token labeling rubric marked with a valid cache_control breakpoint, and the request structure is otherwise correct. What is the most likely root cause given Haiku 4.5's documented caching requirements?","o":["The 3,500-token rubric falls below Haiku 4.5's 4,096-token minimum cacheable length so the breakpoint is never actually honored and every request is billed as a full cache miss.","Haiku models do not support prompt caching under any configuration, so Haiku 4.5 ignores the cache_control breakpoint and charges every request as uncached, regardless of prefix length, providing no savings.","The rubric must be moved into the tools array instead of the system prompt because Haiku 4.5 only caches tool definitions and ignores cache_control breakpoints elsewhere, yielding no savings.","Cache reads on Haiku 4.5 require a minimum of 10 identical requests within the TTL window before any discount is applied to subsequent reads, so a low-volume classification service never triggers caching benefit."],"a":[0],"m":false,"x":"Correct. Haiku 4.5's minimum cacheable prefix length is 4,096 tokens; a 3,500-token rubric falls short of that threshold, so despite a valid cache_control marker, the content is never actually cached and every request pays full input price."},{"d":"model","diff":3,"q":"A support bot's system prompt causes Claude to reason through nearly every trivial FAQ question, adding noticeable latency. The team wants to keep adaptive thinking available but discourage it for simple queries. What should they do?","o":["Add system prompt guidance stating that thinking should only be used for queries where it meaningfully improves quality, e.g., multi-step reasoning.","Remove the thinking configuration entirely from the model's settings, which permanently disables all reasoning capabilities for every future request regardless of complexity.","Set the model's effort parameter to its maximum value, which is designed to restrict thinking to only the most complex queries involving multi-step or nuanced answers.","Switch to a model that does not support adaptive thinking, such as a generative-only variant, so thinking never triggers on any query regardless of complexity."],"a":[0],"m":false,"x":"Correct. Adaptive thinking can be guided via the system prompt; explicit guidance about when to use it steers Claude to skip trivial queries while retaining it for complex ones. This approach reduces latency on simple FAQs without removing the capability for multi-step reasoning."},{"d":"apps","diff":3,"q":"A developer is deciding how to structure `cache_control` breakpoints and TTLs across a Messages API request. Select the statements below that are accurate.","o":["Within a single request, up to four explicit `cache_control` breakpoints can be placed directly on individual content blocks, allowing per-block cache lifetimes.","The default ephemeral cache lifetime is 5 minutes; a `ttl` of `\"1h\"` extends this to 1 hour with the write cost approximately twice the base input token write price.","Automatic caching, enabled via a single top-level `cache_control` flag, moves the cache breakpoint forward as a conversation grows without manual per-block placement.","Cache reads are billed at the full base input token rate, identical to a cache miss, so caching never reduces token cost and only saves latency even with custom TTLs.","Every model supports the same 512-token minimum cacheable prompt length, so cache eligibility never varies by model, ensuring uniform breakpoint behavior across models."],"a":[0,1,2],"m":true,"x":"Correct. You can place explicit `cache_control` breakpoints directly on individual content blocks, up to a limit of four per request, and each block can define its own cache lifetime via a TTL."},{"d":"model","diff":3,"q":"A support-ticket triage service sends the same 6,000-token system prompt and tool definitions with every request, followed by a unique customer message. Requests arrive in bursts roughly every 30 seconds throughout the day. The team wants to cut input token costs on the repeated prefix without adding infrastructure. Which change addresses this most directly?","o":["Mark the system prompt and tool definitions with a 5-minute ephemeral cache_control breakpoint; repeated requests then read the prefix from cache, avoiding the full input price.","Move the system prompt and tool definitions into each request's user message so that the fixed 6,000-token prefix is cached per message, cutting input costs across the 30-second burst cycle.","Reduce the max_tokens parameter on every request to the minimum needed for a short triage response, so Claude's completions stay brief and the blended token cost per call decreases.","Switch the tool definitions to a compact JSON schema with shorter property names and fewer nested objects, so the 6,000-token prefix shrinks and each request consumes fewer input tokens."],"a":[0],"m":false,"x":"Correct. The system prompt and tool definitions form a stable prefix that is reused within a short window, making prompt caching ideal. By marking them with a 5-minute ephemeral cache_control breakpoint, subsequent requests in the burst read from cache and pay only a fraction of the full input price, directly cutting costs."},{"d":"sec","diff":3,"q":"An engineer wants a single hook to run for every Bash, Edit, and NotebookEdit tool call without listing each tool name explicitly. Which matcher configuration achieves this using the documented regex fallback behavior?","o":["A matcher like `Bash|Edit.*` is used; the system falls back to regex evaluation and matches any tool name containing those as substrings.","A matcher of `Bash, Edit, NotebookEdit` with commas, which triggers regex evaluation, causing the pattern to match any tool name containing those substrings.","Omitting the matcher field entirely, which causes the hook to fire only for tools with names longer than four characters, such as Bash and NotebookEdit.","A matcher of `Bash+Edit+NotebookEdit`, where the plus sign acts as a concatenation operator, causing the pattern to be evaluated as a single exact-match string."],"a":[0],"m":false,"x":"Correct. The matcher `Bash|Edit.*` contains the `|` and `.*` characters, which are outside the allowed set for exact matching, so it is evaluated as an unanchored regex. This regex matches any tool name that contains 'Bash' or 'Edit' (followed by any characters), covering Bash, Edit, and NotebookEdit as required."},{"d":"sec","diff":3,"q":"An agent running in `acceptEdits` mode is asked to modify a configuration file that lives outside the working directory and outside any configured `additionalDirectories`. What happens to this edit request?","o":["It still prompts through the `canUseTool` callback since `acceptEdits` auto-approval only covers paths inside the working directory or configured `additionalDirectories`.","It is automatically approved, since `acceptEdits` mode interprets the edit as a direct file system operation that bypasses directory checks and immediately persists the change.","It is silently denied without any callback, since the agent's file access policy treats paths outside the working directory as disallowed by default, similar to a `disallowed_tools` rule.","It is queued and retried automatically once the target path is added to `additionalDirectories` later in the same session, because the agent monitors configuration changes and re-submits held edits."],"a":[0],"m":false,"x":"Correct. The `acceptEdits` mode automatically approves file modifications only within the working directory and any additional directories specified. For paths outside these scoped areas, the agent does not auto-approve and instead invokes the `canUseTool` callback, prompting the user for confirmation."},{"d":"prompt","diff":3,"q":"A team's prompt includes the instruction \"Do not use markdown in your response,\" but Claude still occasionally produces markdown formatting. Which rewording is most likely to reliably fix this, per Anthropic's guidance on controlling output format?","o":["Replace the negative instruction with a positive description of the desired format such as \"Your response should be composed of smoothly flowing prose paragraphs.\"","Keep the instruction \"Do not use markdown\" but mark it as \"IMPORTANT\" and place it at both the beginning and end of the prompt to reinforce the constraint firmly.","Replace the instruction with an enumerated list of every individual markdown character to avoid, such as asterisks, pound signs, backticks, underscores, and tildes.","Move the same negative instruction into a prefilled assistant turn, forcing the response to start without markdown, ensuring a clean start before it continues further."],"a":[0],"m":false,"x":"Correct. Anthropic guidance recommends using positive instructions that describe the desired output format, which is more effective than negative directives like 'Do not use markdown.' By requesting 'smoothly flowing prose paragraphs,' you clearly communicate the intended style without referencing markdown."},{"d":"sec","diff":3,"q":"A platform team is deciding which controls to implement for a new internal agent that both accepts free-text user requests and calls tools returning third-party web content. Which of the following are documented, distinct mitigations they should combine, given that user input and tool-returned content represent different threat models? (Select all that apply.)","o":["A pre-call harmlessness screen uses a lightweight model to classify user input before it reaches the main conversation, blocking unsafe inputs.","System prompt should state that tool-returned content is untrusted data and must never override the system prompt or user's original request.","Apply least-privilege scoping to the agent's data access and permitted tool actions, so a successful injection has minimal impact on the system.","Placing the third-party web content directly into the system prompt treats it as high-priority instructions, ensuring the model follows external data.","Disabling continuous output monitoring once a one-time launch review confirms that the initial guardrails are effective against known threats is a common measure."],"a":[0,1,2],"m":true,"x":"Correct. A pre-call harmlessness screen that uses a lightweight classifier to block unsafe inputs directly addresses the jailbreak and direct-injection threat model, where the user is the adversary. This provides a first line of defense before the main conversation."},{"d":"sec","diff":3,"q":"A security review requires that a specific check run on every single tool call Claude makes, regardless of which permission mode is active or which allow rules match. Which mechanism satisfies this requirement?","o":["A `PreToolUse` hook runs before every permission check and its denial works in `bypassPermissions` mode, so it can enforce the check on every tool call.","An `allowed_tools` entry for each tool ensures that every tool call is verified against the check in all permission modes, including `bypassPermissions`.","The `canUseTool` callback is invoked on every tool call and applies its evaluation logic regardless of the active permission mode, ensuring the check runs each time.","The `acceptEdits` permission mode inspects each file operation individually and applies the inspection check regardless of the active permission mode, so it runs on every tool call."],"a":[0],"m":false,"x":"Correct. A PreToolUse hook runs before any permission evaluation, and its denial takes effect even in bypassPermissions mode, so it can enforce a check on every tool call unconditionally."},{"d":"sec","diff":3,"q":"Before launching an agent that reads inbound customer documents and takes automated actions, the security team wants to validate that the layered guardrails (untrusted-content policy, output screening, least-privilege tool scoping) actually work against realistic attacks, not just theoretical review. What documented step should occur before deployment?","o":["Red-team the agent with documents, emails, and tool outputs deliberately crafted to contain injection attempts and confirm Claude ignores them and that screening/confirmation steps catch the rest.","Skip pre-deployment testing entirely, since layered guardrails are mathematically guaranteed to work once each individual layer has been code-reviewed and formally verified against its specification.","Ask Claude itself, via a single-turn prompt that includes representative injection examples, whether its guardrails are adequate, and treat a detailed affirmative answer as sufficient validation.","Rely exclusively on Anthropic's model-level safety training, which includes adversarial injection training, since documented guidance states that application-level testing is unnecessary once a safety-trained model is used."],"a":[0],"m":false,"x":"Correct. Red-teaming the agent with crafted injection attempts in documents, emails, and tool outputs is explicitly recommended by Anthropic's guidance. This validates that Claude ignores the injections and that any remaining issues are caught by screening and confirmation steps."},{"d":"sec","diff":3,"q":"A legal analysis tool built on Claude must summarize long contracts without inventing clauses that don't exist in the source document, since fabricated obligations could expose the firm to liability. Which prompting strategy is the documented approach for grounding responses in the actual source text to reduce hallucination?","o":["Ask Claude to first extract direct, verbatim quotes relevant to the task before performing the analysis, then base the analysis only on those extracted quotes.","Ask Claude to summarize from memory of similar contracts it has seen during training by applying pre-trained knowledge of legal clauses across jurisdictions to produce more complete summaries.","Increase the sampling temperature to 0.9 to generate multiple diverse phrasings for each contract clause, then select the most detailed phrasing as the final summary to capture nuanced language.","Remove all formatting instructions from the prompt to allow Claude to freely describe the contract's terms in its own words and capture nuances that structured prompts might miss."],"a":[0],"m":false,"x":"Correct. Anthropic's documented hallucination-reduction technique for long documents is to have Claude extract direct, verbatim quotes first, then base the analysis solely on those extracted quotes, grounding responses in the actual source text."},{"d":"model","diff":3,"q":"A developer streams a Messages API response for a long-running generation using the Anthropic SDK. After the stream completes, they want the equivalent complete Message object that a non-streaming call to `client.messages.create` would have returned. Which approach should they use?","o":["Manually concatenate all text chunks from the stream and construct a new Message object.","Call the stream object's built-in finalization method (e.g., `get_final_message()` in Python or `finalMessage()` in TypeScript) to retrieve the assembled Message.","Make a second, non-streaming API call with the same prompt to obtain the complete Message.","The stream object automatically stores the full response in a `completed_message` property that can be read after streaming ends."],"a":[1],"m":false,"x":"Correct. Anthropic SDKs expose a method—such as `get_final_message()` for Python or `finalMessage()` for TypeScript—that aggregates all streamed events and returns a complete Message object identical to what a non-streaming call would have returned. This is the recommended pattern for long-running generations where streaming is used to avoid HTTP timeouts."},{"d":"tools","diff":3,"q":"Several features in Claude Code and the Agent SDK differ in how much context they consume and when they load. Select the statements about context cost that are accurate.","o":["CLAUDE.md loads its full content at session start and stays present on every request for the session","Skills load only descriptions at session start by default, with full content loading when a Skill is actually used","MCP servers load full JSON schemas for every registered tool on every turn regardless of tool search","Hooks add zero context cost unless a hook explicitly returns output that becomes part of the conversation","Subagents share the main conversation's full context history rather than starting with an isolated context"],"a":[0,1],"m":true,"x":"Correct. As stated in Anthropic's official documentation and blog posts, CLAUDE.md is loaded in its entirety at the beginning of each session and remains in the context for all subsequent requests. It serves as a persistent behavioral contract, providing essential project context and rules. To avoid context rot, best practices recommend keeping CLAUDE.md concise, ideally under 200 lines."},{"d":"model","diff":3,"q":"A developer deploys on claude-sonnet-5, which uses adaptive thinking by default. Their use case involves simple lookups where they require the lowest possible latency and absolutely no reasoning overhead. To guarantee these requirements, how should they configure the request?","o":["Explicitly set thinking to {type: \"disabled\"} in the request","Leave the thinking field unset, since Sonnet 5 skips thinking for simple prompts automatically","Set effort to xhigh so Claude quickly determines thinking is unnecessary","Switch to claude-sonnet-4-6, where adaptive thinking is off unless requested"],"a":[0],"m":false,"x":"Correct. Per official Anthropic documentation for Claude Sonnet 5, adaptive thinking is enabled by default and dynamically applies reasoning effort based on prompt complexity. Even for simple prompts, it may still introduce some processing overhead. To guarantee the lowest possible latency with no reasoning overhead, you must explicitly disable thinking by including `thinking: {type: \"disabled\"}` in the API request. This is the documented and recommended approach."},{"d":"apps","diff":3,"q":"A team submits a batch containing 50,000 requests that each share an identical large cached system prompt and expects near-100% cache hit rates because caching and batching can be combined. After running the batch, they observe cache hit rates around 35%. Is this outcome consistent with documented behavior, and what should they do?","o":["Yes, cache hits are best-effort and a 35% rate is within the typical 30–98% range. To improve, they should pre-warm the cache by sending a single cheap request with max_tokens=0 before submitting the batch, and consider using a 1-hour TTL for cached prompts.","No, batching and prompt caching cannot be combined at all because they rely on different infrastructure; any cache reads appearing on the bill are a billing anomaly rather than actual hits, and the team should examine their invoice for discrepancies.","No, batch requests always achieve 100% cache hit rates when sharing an identical system prompt above the minimum token threshold; a 35% rate indicates the `cache_control` marker was misplaced and must be moved to the prompt's start.","Yes, but only because batch requests default to a 5-minute cache TTL, which is too short; switching to the 1-hour TTL guarantees near-100% hit rates."],"a":[0],"m":false,"x":"Anthropic documentation states that batch cache hits are best-effort, with typical rates between 30% and 98% depending on traffic patterns. A 35% hit rate is consistent with this. The current recommended best practice is to pre-warm the cache by sending a single request (e.g., with `max_tokens: 0`) before the batch to ensure the cache exists; otherwise, parallel processing can cause misses. Using a 1-hour TTL (`\\\"ttl\\\": \\\"1h\\\"`) instead of the default 5 minutes also helps maintain cache entries longer."},{"d":"agents","diff":3,"q":"A team must choose between Strands Agents SDK, LangGraph, and Pydantic AI for a new project that will run agents across multiple model providers in production, needs end-to-end observability through OpenTelemetry into existing AWS CloudWatch dashboards, and does not require explicit graph-based control over branching execution paths. Which statements accurately describe considerations relevant to this choice? (Select all that apply.)","o":["Strands Agents SDK is model-agnostic, supporting multiple providers including Anthropic and others, and provides first-class OpenTelemetry tracing suited to CloudWatch integration.","LangGraph is coupled to its original provider and using it with other providers would require custom wrappers that emulate the provider’s API, adding significant integration overhead.","LangGraph models workflows as directed graphs with explicit nodes and edges, offering low-level control that this team's stated requirements don't call for, like conditional edges.","Pydantic AI enforces a schema-first design that prevents the use of unstructured or free-form text inputs, making it unsuitable for many conversational AI use cases.","Strands Agents SDK is tightly integrated with AWS and mandates that all agents and model endpoints reside within AWS, preventing the use of non-AWS model providers in a multi-provider project.","Pydantic AI is stateless by default, offering no built-in persistence layer, and thus requires developers to manually serialize and store state, such as message history, themselves."],"a":[0,2,5],"m":true,"x":"Strands Agents SDK is indeed model-agnostic, supporting Anthropic, OpenAI, Amazon Bedrock, and others. It utilizes OpenTelemetry standards to emit telemetry data, which can be integrated with any OTEL-compatible backend including AWS CloudWatch, making it a strong fit for the team's multi-provider and observability requirements."},{"d":"tools","diff":3,"q":"An agent’s tool library has grown to include `create_pull_request`, `review_pull_request`, `merge_pull_request`, `close_pull_request`, and six similar per-action tools for a code-review workflow. Claude is increasingly picking the wrong tool for the requested action, and the tools consume a large share of the context window. What restructuring best addresses both problems?","o":["Consolidate the per-action tools into a single `pull_request` tool with an `action` parameter (`create`, `review`, `merge`, `close`), which reduces selection ambiguity and the schema count Claude must process.","Keep all ten tools separate but rewrite each tool's description to a concise one-line summary of its action and required parameters, thus reducing the prompt footprint and minimizing errors by letting Claude rely on the action name alone.","Merge the ten tools into a single `execute_github_action` tool that receives a natural-language `instructions` string from Claude, so that Claude describes the desired outcome in plain language instead of selecting among many tool schemas.","Split each of the ten tools into per-repository variants like `create_pull_request_repo1`, `review_pull_request_repo2`, etc., so that Claude can select the tool scoped to the target repository, thereby reducing ambiguity by narrowing tool context."],"a":[0],"m":false,"x":"Consolidating related operations into a single tool with an action parameter is an officially recommended best practice by Anthropic. It reduces selection ambiguity by giving Claude fewer tools to choose from and minimizes context consumption by reducing the total number of tool schemas. As stated in the documentation: 'Rather than creating a separate tool for every action (create_pr, review_pr, merge_pr), group them into a single tool with an action parameter.'"},{"d":"tools","diff":3,"q":"A developer is building a custom tool for an MCP server that integrates with a downstream API. The downstream API occasionally returns malformed JSON, causing an exception in the tool handler. What is the recommended approach to handle this exception to ensure the agent loop continues smoothly and the model receives useful feedback?","o":["Wrap the API call in a try/except block, catch the exception, and return a `CallToolResult` with `isError: true` and a clear, descriptive error message.","Let the exception propagate naturally; the MCP server will catch it and automatically return a sanitized error result to the model.","Rely on the Anthropic SDK's built-in retry mechanism, which will automatically re-attempt the tool call up to three times before raising an error.","Do nothing; the model will detect the failure from the absence of a response and proceed appropriately."],"a":[0],"m":false,"x":"According to MCP best practices, tool handlers should catch exceptions and return structured error results. This allows the agent to receive an actionable error message without exposing raw stack traces, and ensures the conversation continues gracefully."},{"d":"prompt","diff":3,"q":"An agent uses an update_profile tool that requires a 'birth_year' parameter of type integer. Without strict mode enabled, Claude occasionally passes the birth year as a string (e.g., \"1990\") instead of an integer, causing a type error. You want to avoid writing manual type-conversion logic in the handler. What is the most effective change to guarantee type correctness?","o":["Add \"strict\": true to the tool definition so that Claude's inputs are guaranteed to match the declared JSON Schema.","Add a detailed description to the tool explaining that 'birth_year' must be an integer and not a string.","Implement a wrapper in the tool handler that attempts to coerce the input to an integer, logging a warning if conversion fails.","Redefine the 'birth_year' parameter as a string type in the schema so that any format is accepted, then parse it inside the handler."],"a":[0],"m":false,"x":"Setting `strict: true` on a tool definition—also known as strict tool use—ensures that Claude's tool inputs precisely conform to the provided JSON Schema. This is achieved through grammar-constrained sampling, as documented by Anthropic. Without strict mode, Claude may produce arguments with incorrect types (e.g., a string \"2\" instead of an integer 2), but strict mode prevents such mismatches entirely, removing the need for manual type checking."},{"d":"agents","diff":3,"q":"A software architect is comparing three open-source agent frameworks for a project that requires integration with multiple LLM providers and end-to-end observability via OpenTelemetry. The project's agent logic is linear and does not require the manual specification of execution graphs. The frameworks under consideration are Strands Agents SDK, LangGraph, and Pydantic AI. Based on your knowledge of these frameworks, which of the following statements are true? (Select all that apply.)","o":["The Strands Agents SDK is designed to be model-agnostic and includes first-class support for OpenTelemetry, allowing trace export to observability platforms like AWS CloudWatch.","LangGraph can only orchestrate agents that use the Anthropic API because it was developed by Anthropic.","LangGraph models agent workflows as directed graphs, giving developers precise control over branching and looping in execution paths.","Pydantic AI includes a built-in OpenTelemetry collector that can be configured to send traces to CloudWatch out of the box.","Strands Agents SDK enforces that all agents are deployed on AWS and does not permit the use of third-party model APIs.","LangGraph is best suited for simple, linear agent chains because its graph model restricts the developer to a single execution path."],"a":[0,2],"m":true,"x":"Official documentation confirms that Strands Agents SDK is model-agnostic, supporting Anthropic, OpenAI, Amazon Bedrock, and others. It natively integrates OpenTelemetry for distributed tracing, enabling export to any OTLP-compatible backend, including AWS CloudWatch via X-Ray. This aligns with the project's need for linear, multi-model observability."},{"d":"tools","diff":3,"q":"A developer wants to fail fast if any of an agent's configured MCP servers cannot connect, before letting the agent begin working on the user's task. Which mechanism should they use to check this?","o":["Use the MCP Inspector tool to confirm that initialization succeeds and verify the advertised tool list and server status.","Wait for a result message with subtype \"error_during_execution\" before reacting.","Poll each MCP server's health endpoint directly from the developer's own code before calling query.","Check whether any assistant message contains a tool_use block naming the server."],"a":[0],"m":false,"x":"The MCP Inspector (npx @modelcontextprotocol/inspector) is the official recommended tool for verifying MCP server connectivity and functionality. It allows developers to ensure that each server initializes correctly, review its instructions, and confirm its tool list before the agent starts executing user tasks. This proactive check prevents runtime errors due to unreachable servers."},{"d":"apps","diff":3,"q":"An architecture review is comparing Claude's direct Messages API against Claude in Amazon Bedrock's direct integration for an agentic application. Select the statements below that accurately describe this comparison.","o":["On Amazon Bedrock and Google Cloud, the only supported image source is base64-encoded data, whereas the direct API also permits image URLs and file IDs, offering deployment flexibility.","Server-side tools such as web search, web fetch, code execution, and the advisor tool are not supported on Claude in Amazon Bedrock's direct integration; this limits built-in capabilities.","The default `tool_choice` configuration `{\"type\": \"auto\"}`, allowing Claude to decide each turn whether to call a tool or respond directly, works identically on the direct API and Bedrock.","The Message Batches API endpoints are fully available on Claude in Amazon Bedrock's direct integration, allowing users to submit up to 5,000 requests per batch with a 12-hour window, exactly like the direct API.","Agent Skills and the MCP connector are supported out of the box on Claude in Amazon Bedrock's direct integration, providing web fetch and code interpreter tools via the `tool_choice` configuration without extra setup."],"a":[0,1,2],"m":true,"x":"According to official documentation, Amazon Bedrock and Google Cloud integrations only support base64-encoded image sources (with a 5 MB limit and up to 20 images per request on Bedrock). The direct Anthropic API additionally supports URLs and file IDs (10 MB limit, up to 100 images), providing greater flexibility."},{"d":"apps","diff":3,"q":"A support tool sends Claude two screenshots in a single user turn and asks Claude to compare them, then later asks a follow-up question in a new turn referencing 'the first image' without resending it. What is the correct way to structure this so both turns behave as intended?","o":["Label each image with a preceding text block like 'Image 1:' and 'Image 2:' in the first turn, and rely on Claude's access to all prior-turn images so the follow-up question doesn't need to resend them.","Resend both original images as base64-encoded content blocks in the follow-up turn's content array, because Claude processes each turn independently and does not retain image attachments from prior messages across turns.","Combine both images into a single side-by-side composite image before sending, and include that composite as the only image content block in the follow-up turn, since the Messages API permits one discrete image block per user message.","Add a `file_id` reference for each image from the first turn by uploading the images through the Files API and including their IDs as content, because Claude retains Files API uploads across turns and can recall them by reference without resending."],"a":[0,3],"m":true,"x":"This is the recommended approach per Anthropic's Vision documentation. Explicit labels allow you to refer to images by name in later turns. Claude retains the entire conversation context, including images, so they remain accessible without resending."},{"d":"agents","diff":3,"q":"A workflow has a main agent spawn a subagent, which spawns another subagent, and so on, three levels deep. At the third level, that subagent attempts to spawn a fourth-level subagent to handle a further subtask. What happens, per the Agent SDK's nested subagent rules?","o":["The spawn succeeds because the Agent SDK allows unlimited nested subagent depth when every subagent includes the Agent tool, enabling the third-level subagent to spawn a fourth one.","The spawn succeeds only if the fourth-level subagent runs as a background task; the SDK exempts background subagents from the depth limit by treating them as independent of the nested chain.","The spawn attempt fails because a subagent three levels below the main agent cannot spawn further subagents regardless of whether it runs in the foreground or background.","The spawn fails only if the third-level subagent was defined via the filesystem rather than programmatically through the agents parameter, because only filesystem definitions impose the depth limit."],"a":[2],"m":false,"x":"Correct. The Agent SDK enforces a maximum nesting depth for subagents, which is configurable via the `CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH` environment variable and defaults to 3. When a subagent has already reached this limit, any attempt to spawn another subagent—a fourth-level attempt in this case—fails. This restriction is enforced server-side and applies whether the subagent runs in the foreground or background."}];

 const inner = s.motif==="mono" ? monoInner(s.color, s.label||initials(s.name)) : (MOTIF[s.motif]?MOTIF[s.motif](s.color):monoInner(s.color,s.label||initials(s.name)));

// ---- rolling ----
function rollStickerRarity(){if(Math.random()<0.001)return "legend";
 const w={common:46,uncommon:28,rare:15,epic:8};let tot=81,r=Math.random()*tot;
 for(const k of ["common","uncommon","rare","epic"]){r-=w[k];if(r<0)return k;}return "common";}
function stkPick(a){return a[Math.floor(Math.random()*a.length)];}
function rollWon(cs){const rar=rollStickerRarity();const pool=cs.byRar[rar].length?cs.byRar[rar]:cs.byRar.common;return stkPick(pool);}
function stkWeightedFiller(cs){const rar=rollStickerRarity();const pool=cs.byRar[rar].length?cs.byRar[rar]:cs.byRar.common;return stkPick(pool);}
function stkOwned(id){return (S.stickers&&S.stickers[id])||0;}

// ============================ SERVER-AUTHORITATIVE ECONOMY (Supabase) ============================
// Dependency-free: talks to Supabase Auth + PostgREST over fetch(). No SDK, no CDN.
// Gold + sticker collection live in Postgres and change ONLY via SECURITY DEFINER RPCs.
// When not configured (or offline), the game silently falls back to local play.
const CQCloud = (function(){
 const RT_KEY = "cq_rt";           // persisted refresh token (identity only, never gold)
 let AT = null;                    // access token (in-memory)
 let ready = false;                // successfully signed in + synced
 let lastError = null;             // last cloud failure, surfaced in the UI
 function cfg(){ return (typeof window!=="undefined" && window.LEADERBOARD && window.LEADERBOARD.url && window.LEADERBOARD.key) ? window.LEADERBOARD : null; }
 function base(){ return cfg().url.replace(/\/+$/,""); }
 function key(){ return cfg().key; }
 async function authFetch(path, body){
  let res;
  try{ res = await fetch(base()+path, {method:"POST", headers:{apikey:key(),"Content-Type":"application/json"}, body:JSON.stringify(body||{})}); }
  catch(e){ throw new Error("network error reaching Supabase (check the project URL)"); }
  const txt = await res.text();
  if(!res.ok){ let m="HTTP "+res.status; try{const j=JSON.parse(txt); m=(j.msg||j.error_description||j.error_code||j.message||j.error||m);}catch(e){ if(txt) m=txt.slice(0,200); } throw new Error(m); }
  return txt ? JSON.parse(txt) : {};
 }
 function saveSession(s){ if(s && s.access_token){ AT=s.access_token; if(s.refresh_token){ try{localStorage.setItem(RT_KEY,s.refresh_token);}catch(e){} } } }
 // Supabase anonymous sign-in: POST /auth/v1/signup with no email/phone (matches supabase-js payload).
 async function signInAnon(){ const s = await authFetch("/auth/v1/signup", {data:{}, gotrue_meta_security:{}}); saveSession(s); if(!AT) throw new Error("no session returned from anonymous sign-in"); return s; }
 async function refresh(){ let rt=null; try{rt=localStorage.getItem(RT_KEY);}catch(e){} if(!rt) return null;
  try{ const s = await authFetch("/auth/v1/token?grant_type=refresh_token", {refresh_token:rt}); saveSession(s); return s; }
  catch(e){ try{localStorage.removeItem(RT_KEY);}catch(_){} return null; } }
 // call a SECURITY DEFINER rpc; refresh + retry once on 401
 async function rpc(fn, args, _retried){
  const res = await fetch(base()+"/rest/v1/rpc/"+fn, {method:"POST",
    headers:{apikey:key(), Authorization:"Bearer "+AT, "Content-Type":"application/json"}, body:JSON.stringify(args||{})});
  if(res.status===401 && !_retried){ const s=await refresh(); if(s) return rpc(fn,args,true); }
  if(!res.ok){ let msg="rpc "+fn+" "+res.status; try{const j=await res.json(); if(j&&j.message)msg=j.message;}catch(e){} throw new Error(msg); }
  const txt = await res.text(); return txt ? JSON.parse(txt) : null;
 }
 return {
  active(){ return ready; },
  configured(){ return !!cfg(); },
  status(){ return { configured: !!cfg(), active: ready, error: lastError }; },
  // sign in (restore or anonymous), ensure profile, pull authoritative gold + stickers into S
  async init(name){
   if(!cfg()) return false;
   try{
    if(!(await refresh())){ await signInAnon(); }
    const nm = (name || (S && S.name) || "").toString().trim().slice(0,24);
    await rpc("ensure_profile", { p_name: nm || null });   // creates the profile with the chosen name (or updates it)
    const st = await rpc("get_state", {});
    if(st){ if(typeof st.gold==="number") S.gold = st.gold; S.stickers = {}; const m=st.stickers||{}; for(const k in m) S.stickers[k]=m[k]; }
    ready = true; lastError = null; return true;
   }catch(e){ lastError = e.message; console.error("[cloud] connect failed → local mode:", e.message); ready=false; return false; }
  },
  async award(kind){ const r = await rpc("award_event", {p_kind:kind}); if(r&&typeof r.gold==="number") S.gold=r.gold; return r; },
  async buyPotion(){ const r = await rpc("buy_potion", {}); if(r&&typeof r.gold==="number") S.gold=r.gold; return r; },
  async openCase(caseKey){ const r = await rpc("open_case", {p_case:caseKey}); if(r&&typeof r.gold==="number") S.gold=r.gold; return r; },
  async syncShowcase(p){ try{ await rpc("sync_showcase", {p_gear:(p&&p.gear)||{}, p_cls:(p&&p.cls)||null, p_level:(p&&p.level)||1, p_readiness:(p&&p.readiness)||0}); }catch(e){} },
  async listShowcase(){ return await rpc("list_showcase", {p_limit:300}); },
  async syncState(){ try{ const st=await rpc("get_state",{}); if(st){ if(typeof st.gold==="number")S.gold=st.gold; S.stickers={}; const m=st.stickers||{}; for(const k in m)S.stickers[k]=m[k];} }catch(e){} },
 };
})();

// ---- renderers that take explicit data (another player's) ----
function scPslot(gear,k){const g=gear&&gear[k];const s=SLOTS[k];
 if(!g)return `<div class="pslot empty"><div class="pi">${s.i}</div><div class="pinfo"><div class="pn">${s.n}</div><div class="ps">— empty —</div></div></div>`;
 return `<div class="pslot q-${g.rarity}"><div class="pi">${g.icon||s.i}</div><div class="pinfo"><div class="pn r-${g.rarity}">${esc(g.name||s.n)}</div><div class="ps">${rtag(g.rarity)}${bonusStr(g)}</div></div></div>`;}
function scSumStat(gear,stat){let t=0;for(const k of SLOT_KEYS){const g=gear&&gear[k];if(g&&SLOTS[k].stat===stat)t+=(g.val||0);}return t;}
function scPaperdoll(gear,cls){return `<div class="paperdoll">
 <div class="pcol">${SLOT_LEFT.map(k=>scPslot(gear,k)).join("")}</div>
 <div class="pcenter"><div class="pav">${(CLASSES[cls]&&CLASSES[cls].i)||"🧝"}</div>
  <div class="statchip">❤️ <b>+${scSumStat(gear,"hp")}</b> HP</div>
  <div class="statchip">⚔️ <b>+${scSumStat(gear,"pow")}</b> Power</div>
  <div class="statchip">✨ <b>+${scSumStat(gear,"xp")}%</b> XP</div>
  <div class="statchip">🍀 <b>+${scSumStat(gear,"luck")}</b> Luck</div></div>
 <div class="pcol">${SLOT_RIGHT.map(k=>scPslot(gear,k)).join("")}</div></div>`;}
function scGearCount(gear){let n=0;for(const k of SLOT_KEYS)if(gear&&gear[k])n++;return n;}
function scFinest(gear){let best=null;for(const k of SLOT_KEYS){const g=gear&&gear[k];if(g&&(!best||itemValue(g)>itemValue(best)))best=g;}return best;}
function scCollItem(s,cnt){const own=cnt>0;
 return `<div class="collitem ${own?"":"missing"}" title="${esc(s.name)} · ${RNAME[s.rar]}">${own&&cnt>1?`<span class="cnt">×${cnt}</span>`:""}${stickerSVG(s)}<div class="cn">${own?esc(s.name):"???"}</div><div class="cbar rc-${s.rar}"></div></div>`;}
const _RORD=["legend","epic","rare","uncommon","common"];
function scMiniStickers(map,n){const owned=[];for(const s of STICKERS)if(map[String(s.id)])owned.push(s);
 owned.sort((a,b)=>_RORD.indexOf(a.rar)-_RORD.indexOf(b.rar));
 const show=owned.slice(0,n).map(s=>stickerSVG(s)).join("");
 const extra=owned.length>n?`<span class="more">+${owned.length-n}</span>`:(owned.length?"":`<span class="more">no stickers yet</span>`);
 return show+extra;}

// ============================ MAP GENERATION ============================
function genMap(dk){const W=9,H=7;
 const grid=[];for(let y=0;y<H;y++){const row=[];for(let x=0;x<W;x++)row.push((x===0||y===0||x===W-1||y===H-1)?1:0);grid.push(row);}
 const px=1,py=H-2;grid[py][px]=0;
 for(let i=0;i<7+rnd(5);i++){const x=1+rnd(W-2),y=1+rnd(H-2);if(!(x===px&&y===py))grid[y][x]=1;}
 function reach(){const seen=new Set([px+","+py]);const q=[[px,py]];while(q.length){const[cx,cy]=q.shift();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H||grid[ny][nx]===1)continue;const kk=nx+","+ny;if(!seen.has(kk)){seen.add(kk);q.push([nx,ny]);}}}return seen;}
 let seen=reach(),guard=0;
 while(seen.size<Math.floor(W*H*0.55)&&guard<40){const x=1+rnd(W-2),y=1+rnd(H-2);grid[y][x]=0;seen=reach();guard++;}
 const floors=[...seen].map(s=>s.split(",").map(Number)).filter(([x,y])=>!(x===px&&y===py));
 const ents={};
 // boss on farthest reachable tile
 let bx=floors[0],best=-1;for(const[x,y]of floors){const d=Math.abs(x-px)+Math.abs(y-py);if(d>best){best=d;bx=[x,y];}}
 ents[bx[0]+","+bx[1]]={type:"boss",done:false,x:bx[0],y:bx[1]};
 const taken=new Set([bx[0]+","+bx[1]]);
 function place(type){for(let t=0;t<80;t++){const[x,y]=floors[rnd(floors.length)];const kk=x+","+y;if(!taken.has(kk)){taken.add(kk);ents[kk]={type,done:false,x,y};return;}}}
 const nChest=5,nMon=6;for(let i=0;i<nChest;i++)place("chest");for(let i=0;i<nMon;i++)place("monster");place("fountain");
 return {dk,W,H,grid,ents,px,py,hp:maxHp(),chests:0,kills:0,bossDone:false,potTemp:CLASSES[S.cls].pot||0,usedQ:new Set(),totalChests:nChest};}
function enterZone(dk){M=genMap(dk);E=null;renderMap();}

 if(e.type==="monster")return e.done?"💀":(e._m||(e._m=DOMAINS[M.dk].mobs[rnd(DOMAINS[M.dk].mobs.length)][1]));return "";}
function isWalkable(x,y){if(x<0||y<0||x>=M.W||y>=M.H)return false;if(M.grid[y][x]===1)return false;return true;}
function renderMap(){const d=DOMAINS[M.dk];const li=levelInfo();
 let cells="";
 for(let y=0;y<M.H;y++)for(let x=0;x<M.W;x++){
  const wall=M.grid[y][x]===1;const here=(x===M.px&&y===M.py);const e=M.ents[x+","+y];
  const adj=(Math.abs(x-M.px)+Math.abs(y-M.py)===1)&&!wall;

 }

 <div class="meta">📦 ${M.chests}/${M.totalChests} chests · ⚔️ ${M.kills} slain · ${bossE.done?"👑 boss down":"👑 boss awaits"}</div></div>

 <div class="gridwrap"><div class="grid" style="grid-template-columns:repeat(${M.W},1fr)">${cells}</div></div>

 <div class="sp"></div><button onclick="move(0,1)">▼</button><div class="sp"></div></div>

 <button class="btn small danger" onclick="town()">🚪 Leave dungeon</button></div>`);}
function move(dx,dy){if(!M||E)return;tryMove(M.px+dx,M.py+dy);}
function mapPotion(){if(M.potTemp>0)M.potTemp--;else if(S.potions>0)S.potions--;else return;M.hp=Math.min(maxHp(),M.hp+40);renderMap();}
function tryMove(x,y){if(!isWalkable(x,y))return;if(Math.abs(x-M.px)+Math.abs(y-M.py)!==1)return;

 if(e&&!e.done){
  if(e.type==="fountain"){e.done=true;M.hp=maxHp();M.px=x;M.py=y;renderMap();return;}
  return startEncounter(e);
 }
 M.px=x;M.py=y;renderMap();}

// ---- real 3D d20 (icosahedron), geometry computed once ----
function buildIco(){ if(window.__ICO)return window.__ICO;
 const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
 const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
 const scl=(a,s)=>[a[0]*s,a[1]*s,a[2]*s],ln=a=>Math.hypot(a[0],a[1],a[2]),nrm=a=>scl(a,1/ln(a));
 const mv=(m,v)=>[dot(m[0],v),dot(m[1],v),dot(m[2],v)];
 const mm=(a,b)=>{const bt=[[b[0][0],b[1][0],b[2][0]],[b[0][1],b[1][1],b[2][1]],[b[0][2],b[1][2],b[2][2]]];return a.map(r=>bt.map(c=>dot(r,c)));};
 const axa=(ax,th)=>{const x=ax[0],y=ax[1],z=ax[2],c=Math.cos(th),s=Math.sin(th),C=1-c;return [[c+x*x*C,x*y*C-z*s,x*z*C+y*s],[y*x*C+z*s,c+y*y*C,y*z*C-x*s],[z*x*C-y*s,z*y*C+x*s,c+z*z*C]];};
 const rotAtoB=(a,b)=>{const v=cross(a,b),c=dot(a,b);if(c<-0.999999){let ax=cross(a,[1,0,0]);if(ln(ax)<1e-4)ax=cross(a,[0,1,0]);return axa(nrm(ax),Math.PI);}const s=ln(v);if(s<1e-9)return[[1,0,0],[0,1,0],[0,0,1]];return axa(scl(v,1/s),Math.atan2(s,c));};
 const rotZ=th=>{const c=Math.cos(th),s=Math.sin(th);return[[c,-s,0],[s,c,0],[0,0,1]];};
 const m3d=(R,t)=>{t=t||[0,0,0];return `matrix3d(${R[0][0]},${R[1][0]},${R[2][0]},0, ${R[0][1]},${R[1][1]},${R[2][1]},0, ${R[0][2]},${R[1][2]},${R[2][2]},0, ${t[0]},${t[1]},${t[2]},1)`;};
 const t=(1+Math.sqrt(5))/2;
 let V=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];
 const CR=Math.hypot(1,t);V=V.map(v=>scl(v,1/CR));
 const F=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
 const S=92;
 const normals=F.map(f=>nrm(add(add(V[f[0]],V[f[1]]),V[f[2]])));
 const faceN=new Array(20).fill(0),used=new Array(20).fill(false);let nn=1;
 for(let i=0;i<20;i++){if(used[i])continue;let anti=-1,best=1;for(let j=0;j<20;j++){if(used[j]||j===i)continue;const d=dot(normals[i],normals[j]);if(d<best){best=d;anti=j;}}faceN[i]=nn;if(anti>=0){faceN[anti]=21-nn;used[anti]=true;}used[i]=true;nn++;}

 <div class="panel"><div class="qtext">${fmt(q.q)}</div>
 ${q.m?`<p class="small">Select ALL that apply, then confirm:</p>`:""}
 <div id="opts">${R.perm.map((oi,di)=>`<button class="opt" id="opt${di}" onclick="${q.m?`raidToggle(${di})`:`raidAnswer(${di})`}"><span class="key">${"ABCDEF"[di]}</span>${fmt(q.o[oi])}</button>`).join("")}</div>
 ${q.m?`<div class="center"><button class="btn gold" onclick="raidAnswerMulti()">Confirm</button></div>`:""}
 <div class="center" style="margin-top:8px"><button class="btn small danger" onclick="finishRaid()">🏳️ Abandon Trial</button></div></div>`);}
function raidToggle(i){if(R.multiSel.has(i))R.multiSel.delete(i);else R.multiSel.add(i);$("opt"+i).classList.toggle("sel");}
function raidAnswer(di){raidRecord([R.perm[di]]);}
function raidAnswerMulti(){raidRecord([...R.multiSel].map(di=>R.perm[di]).sort((x,y)=>x-y));}
function raidRecord(picked){const q=R.qs[R.idx];const ok=grade(q,picked);record(q,ok);R.answers.push({q,picked,ok});
 R.idx++;if(R.idx>=R.qs.length)return finishRaid();renderRaidQ();}
function finishRaid(){clearInterval(R.t);R.t=null;
 const total=R.qs.length,done=R.answers.length,correct=R.answers.filter(a=>a.ok).length;
 const score=Math.round(correct/total*1000);const pass=score>=720;
 if(!S.raidBest||score>S.raidBest)S.raidBest=score;
 const xg=Math.round(correct*6*xpMult());S.xp+=xg;autoSave();
 const perDomain={};for(const a of R.answers){const k=a.q.d;perDomain[k]=perDomain[k]||{c:0,t:0};perDomain[k].t++;if(a.ok)perDomain[k].c++;}
 const missed=R.answers.filter(a=>!a.ok);
 app(`<h1>${pass?"🏆 THE PROCTOR YIELDS!":"⚔️ The Proctor stands…"}</h1>
 <div class="sub">${pass?"By the rules of the Trial, you would PASS. Book it with confidence.":"Not this time — but every scar is lore. Study the breakdown and return."}</div>
 <div class="panel center"><div style="font-size:2.4em;font-family:Avenir Next,Segoe UI,system-ui,sans-serif;color:${pass?"var(--ok)":"var(--bad)"}">${score} / 1000</div>
 <p class="small">${correct}/${total} correct (${done<total?(total-done)+" unanswered · ":""}pass 720) · +${xg} XP</p></div>
 <div class="panel"><h3 style="color:var(--gold2)">Realm breakdown</h3>
 ${Object.entries(perDomain).map(([k,v])=>`<div style="margin:8px 0"><div class="small">${DOMAINS[k].icon} ${DOMAINS[k].desc.split(" — ")[0]} — ${v.c}/${v.t}</div>${bar("mast",v.c/v.t*100,Math.round(v.c/v.t*100)+"%")}</div>`).join("")}</div>
 ${missed.length?`<div class="panel"><h3 style="color:var(--bad)">📜 Scrolls of Defeat — study these (${missed.length})</h3>
 ${missed.map(a=>`<div style="margin:12px 0;border-bottom:1px dashed #2a2242;padding-bottom:10px"><div class="qtext" style="font-size:.95em">${fmt(a.q.q)}</div>
 <div class="small" style="color:var(--ok)">✔ ${a.q.a.map(i=>fmt(a.q.o[i])).join(" · ")}</div>
 <div class="explain" style="margin:8px 0 0">${fmt(a.q.x)}</div></div>`).join("")}</div>`:""}
 <div class="center"><button class="btn gold" onclick="town()">🏰 Return to town</button>${lbOn()?` <button class="btn" onclick="leaderboardScreen(true)">🏆 Submit to leaderboard</button>`:""}</div>`);R=null;}

// ============================ LEADERBOARD ============================
function lbOn(){return !!(window.LEADERBOARD&&LEADERBOARD.url&&LEADERBOARD.key);}
function lbBase(){return LEADERBOARD.url.replace(/\/+$/,"");}
function lbHeaders(extra){return Object.assign({apikey:LEADERBOARD.key,Authorization:"Bearer "+LEADERBOARD.key},extra||{});}
function gearSnapshot(){const out=[];for(const k of SLOT_KEYS){const g=S.gear[k];if(g)out.push({s:k,n:g.name,r:g.rarity,v:g.val,st:g.stat});}return out;}
function gearPanel(g){if(!g||!g.length)return `<div class="small" style="padding:6px 0">No gear recorded for this run.</div>`;
 const sum={hp:0,pow:0,xp:0,luck:0};g.forEach(x=>{if(sum[x.st]!=null)sum[x.st]+=x.v;});
 const bx=x=>x.st==="hp"?"+"+x.v+" HP":x.st==="pow"?"+"+x.v+" Power":x.st==="xp"?"+"+x.v+"% XP":"+"+x.v+" Luck";
 const items=g.slice().sort((a,b)=>SLOT_KEYS.indexOf(a.s)-SLOT_KEYS.indexOf(b.s)).map(x=>`<div class="loot" style="padding:4px 9px;margin:4px 0"><span class="r-${x.r}">${(SLOTS[x.s]&&SLOTS[x.s].i)||"•"} ${esc(x.n)}</span> <span class="small">· ${(SLOTS[x.s]&&SLOTS[x.s].n)||x.s}: ${bx(x)}</span></div>`).join("");
 return `<div class="small" style="margin:6px 0 8px">❤️ ${sum.hp} HP · ⚔️ ${sum.pow} Power · ✨ +${sum.xp}% XP · 🍀 ${sum.luck} Luck · <b>${g.length}/15</b> slots equipped</div>${items}`;}
async function submitScore(){if(!lbOn())return {ok:false,reason:"off"};if(!S.raidBest)return {ok:false,reason:"notrial"};
 const body={name:String(S.name).slice(0,24),score:S.raidBest,level:levelInfo().l,readiness:Math.round(readiness()*100),gear:gearSnapshot()};
 try{const r=await fetch(lbBase()+"/rest/v1/scores",{method:"POST",headers:lbHeaders({"Content-Type":"application/json","Prefer":"return=minimal"}),body:JSON.stringify(body)});
  return {ok:r.ok,status:r.status};}catch(e){return {ok:false,reason:String(e)};}}
async function fetchScores(){if(!lbOn())return null;
 try{const r=await fetch(lbBase()+"/rest/v1/scores?select=name,score,level,readiness,gear&order=score.desc&limit=300",{headers:lbHeaders()});
  if(!r.ok)return {error:r.status};const rows=await r.json();
  const best={};for(const x of rows){const k=(x.name||"?").toLowerCase();if(!best[k]||x.score>best[k].score)best[k]=x;}
  return Object.values(best).sort((a,b)=>b.score-a.score||(b.readiness||0)-(a.readiness||0)).slice(0,25);}
 catch(e){return {error:String(e)};}}
function leaderboardScreen(fromRaid){M=null;
 if(!lbOn()){app(`<h1>🏆 Leaderboard</h1><div class="sub">Not set up yet</div>
  <div class="panel lore"><p>The online leaderboard isn't configured on this copy of the game. If you host it yourself, add your free Supabase project's URL and anon key to the <b>LEADERBOARD</b> block near the top of the file, and it lights up automatically.</p></div>
  <div class="center"><button class="btn" onclick="town()">⬅ Back to town</button></div>`);return;}
 app(`<h1>🏆 Leaderboard</h1><div class="sub">Top developers of Anthropia — ranked by best Trial score</div>
  <div class="panel center" id="lbbody"><p class="small">Loading the hall of fame…</p></div>
  <div class="center"><button class="btn" onclick="town()">⬅ Back to town</button></div>`);
 fetchScores().then(rows=>{const el=$("lbbody");if(!el)return;
  if(!rows||rows.error){el.innerHTML=`<p class="small">Couldn't reach the leaderboard right now${rows&&rows.error?" (error "+rows.error+")":""}. Try again in a moment.</p>`;return;}
  if(!rows.length){el.innerHTML=`<p class="small">No scores yet — be the first! Take the Trial of the Proctor, then submit your score.</p>${lbSubmitBtn()}`;return;}
  const me=String(S.name).toLowerCase();
  el.innerHTML=`<div style="text-align:left">${rows.map((x,i)=>{const mine=(x.name||"").toLowerCase()===me;const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":("#"+(i+1));
     const ng=(x.gear&&x.gear.length)||0;
     return `<div style="border-top:1px dashed #2a2242;padding:8px 2px;${mine?"background:#16241b;border-radius:6px":""}">
      <div style="display:flex;align-items:center;gap:8px">
       <span style="width:34px;color:var(--dim);text-align:center">${medal}</span>
       <b style="flex:1;color:${mine?"var(--ok)":"var(--gold2)"}">${esc(x.name||"?")}${mine?" (you)":""}</b>
       <span style="font-weight:bold;color:${x.score>=720?"var(--ok)":"var(--text)"}">${x.score}</span>
       <span class="small" style="width:104px;text-align:right">Lv ${x.level||"—"} · ${x.readiness!=null?x.readiness+"%":"—"}</span></div>
      <details style="margin:2px 0 0 34px"><summary style="cursor:pointer;color:var(--dim);font-size:.8em;list-style:none">🎒 loadout${ng?" ("+ng+" items)":""}</summary>${gearPanel(x.gear)}</details>
     </div>`;}).join("")}</div>
   <div class="center" style="margin-top:12px">${lbSubmitBtn()}</div>`;});}
function lbSubmitBtn(){if(!S.raidBest)return `<p class="small">Take the 🏛️ Trial of the Proctor to earn a score, then come back to submit it.</p>`;
 return `<button class="btn gold" id="subbtn" onclick="doSubmit()">📤 Submit my best (${S.raidBest}/1000)</button> <span id="submsg" class="small"></span>`;}
function doSubmit(){const b=$("subbtn"),m=$("submsg");if(b)b.disabled=true;if(m)m.textContent="Submitting…";
 submitScore().then(res=>{if(res.ok){if(m)m.textContent="Posted! ✔";setTimeout(()=>leaderboardScreen(),700);}
  else{if(b)b.disabled=false;if(m)m.textContent=res.reason==="notrial"?"Take a Trial first.":"Couldn't submit — try again.";}});}

// ============================ INIT ============================
if(typeof document!=="undefined"&&document.getElementById("app")){const sv=loadAuto();if(sv){S=sv;town();cloudBoot(S.name);applyNameFx(S.name);}else renderTitle();}
</script>
</body>
</html>
