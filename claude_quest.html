// ===== CCDV-F question bank: 502 questions sourced from CertSafari (developer foundations) =====
const QUESTIONS=[{"d":"agents","diff":3,"q":"A platform support team routes every incoming ticket into one of five known categories (billing, account access, bug report, feature request, or general inquiry). Once a ticket's category is identified, the exact sequence of downstream steps -- which system to query, what template to draft, and who to notify -- is fixed and never varies for that category. The team wants an architecture that keeps this dispatch-then-fixed-path behavior explicit and predictable. Which architecture should they implement?","o":["Build an orchestrator-workers system where a central LLM decides at runtime which systems to query and which template to draft for each ticket.","Build a routing workflow that classifies each ticket into its category and then executes that category's predefined, fixed sequence of steps.","Deploy a fully autonomous agent that chooses its own tools and stopping point based on ongoing feedback from the ticketing system.","Chain five fixed LLM calls that always run in the same order for every ticket regardless of which category it belongs to."],"a":[1],"m":false,"x":"Correct -- routing directs input to specialized, predefined downstream paths, matching the fixed-path-per-category requirement exactly."},{"d":"agents","diff":3,"q":"An engineering team is building a coding assistant that modifies a codebase in response to natural-language requests. The number of files touched, which files they are, and what changes are needed cannot be known in advance -- they depend on what the request turns out to require once the assistant inspects the code. The team wants one LLM to inspect the request, decide the subtasks on the fly, delegate each to a worker, and combine the results. Which pattern does this describe?","o":["Prompt chaining, where the assistant runs the same fixed sequence of file edits every time regardless of what the request needs.","Routing, where the request is classified into one of a small set of predefined file-edit templates before anything else happens.","Orchestrator-workers, where a central LLM dynamically determines the subtasks and files, delegates them to workers, and synthesizes their output.","Parallelization by sectioning, where the request is split into a fixed set of independent subtasks known before the request arrives."],"a":[2],"m":false,"x":"Correct -- orchestrator-workers fits exactly this case: subtasks aren't predefined, a central LLM determines them at runtime, delegates to workers, and synthesizes results."},{"d":"agents","diff":3,"q":"A content team needs to produce localized marketing copy. Every request goes through the same three steps in the same order: draft the copy, run a fixed compliance check on the draft, then translate the approved draft into the target language. Each step consumes the previous step's output, and the sequence never changes. Which workflow pattern fits this process?","o":["Orchestrator-workers, where a central LLM decides which of the three steps apply based on the content of each request.","Evaluator-optimizer, where one LLM drafts copy and a second LLM iterates with it until compliance criteria are met.","Routing, where the request is classified first and then sent to one of several separate three-step pipelines.","Prompt chaining, where each LLM call processes the fixed output of the step directly before it in an unchanging sequence."],"a":[3],"m":false,"x":"Correct -- prompt chaining describes a fixed, unchanging sequence where each call processes the prior step's output, exactly matching draft, then check, then translate."},{"d":"agents","diff":3,"q":"A security team reviews every pull request by running several independent prompts against the same diff at the same time -- one focused on injection vulnerabilities, one on authentication issues, one on dependency risks -- and then combines the separate flagged findings into one report. Which pattern is this?","o":["Parallelization by sectioning, where independent subtasks examine the same input simultaneously and their separate results are aggregated.","Parallelization by voting, where the same vulnerability-scanning prompt runs several times and the majority finding is kept.","Evaluator-optimizer, where one prompt flags vulnerabilities and a second prompt critiques and refines those findings iteratively.","Orchestrator-workers, where a central LLM decides at runtime which vulnerability categories are worth reviewing for this diff."],"a":[0],"m":false,"x":"Correct -- sectioning splits the work into independent subtasks that run in parallel over the same input, with results aggregated afterward, matching the three simultaneous, differently-focused reviews."},{"d":"agents","diff":3,"q":"A team wants higher-confidence answers from a fraud-detection prompt applied to a transaction description. Rather than reviewing different angles, they run the exact same prompt against the same transaction five times and keep whichever verdict -- fraudulent or legitimate -- appears most often across the five runs. Which pattern are they using?","o":["Parallelization by sectioning, where five different prompts each examine a distinct aspect of the same transaction independently.","Parallelization by voting, where the identical task runs multiple times to produce diverse outputs and the most common result is selected.","Evaluator-optimizer, where a second LLM call critiques the first verdict and the prompt is revised until the criteria are satisfied.","Prompt chaining, where each of the five runs consumes the verdict produced by the run immediately before it."],"a":[1],"m":false,"x":"Correct -- voting runs the identical task multiple times to get diverse outputs and keeps the majority result, exactly matching five identical runs with a majority verdict."},{"d":"agents","diff":3,"q":"A publisher needs a literary translation refined until it meets a defined quality bar for tone and idiom. One LLM produces a candidate translation; a second LLM call reviews it against the quality criteria and returns specific critique; the first LLM revises based on that critique; this repeats until the reviewer is satisfied. Which pattern describes this loop?","o":["Prompt chaining, where the translation passes through a fixed number of sequential steps regardless of whether quality criteria are met.","Parallelization by voting, where several independent translations are produced at once and the most common phrasing is kept.","Evaluator-optimizer, where one LLM generates a response and a second provides iterative feedback until clear evaluation criteria are met.","Routing, where the translation request is classified and sent down one of several predefined translation pipelines."],"a":[2],"m":false,"x":"Correct -- evaluator-optimizer is exactly one LLM generating and a second providing iterative feedback, repeating until clear evaluation criteria for tone and idiom are satisfied."},{"d":"agents","diff":3,"q":"A compliance team automates generation of quarterly regulatory filings. The subtasks are always the same eight steps in the same order, and the team's top priority is that every filing follows an identical, auditable path with no step ever skipped or reordered -- even though a more flexible system might occasionally produce a filing slightly faster. Which architecture choice best matches these priorities?","o":["A workflow, because the task decomposes into fixed, predictable subtasks and the team is prioritizing consistency over the flexibility gains an agent would offer.","An agent, because agents scale well with autonomous operation even when every subtask and its order are already known in advance.","An orchestrator-workers system, because a central LLM should decide at runtime whether to skip or reorder any of the eight steps.","An evaluator-optimizer loop, because iterative critique will make the auditable path more consistent than following the same eight fixed steps."],"a":[0],"m":false,"x":"Correct -- when tasks decompose into fixed, predictable subtasks and consistency is prioritized over flexibility, a workflow is the right choice, matching the compliance team's auditability requirement."},{"d":"agents","diff":3,"q":"A developer wants to build an agent that autonomously reads files, runs shell commands, and edits code, without writing the loop that submits tool results back to the model and checks the stop reason on every turn. Which approach removes that burden, and why?","o":["Use the Client SDK's messages API directly, since it already executes tools on your behalf whenever the stop reason is tool_use.","Use an evaluator-optimizer workflow, since a second LLM call automatically executes tools for the first LLM call in that pattern.","Use the Agent SDK, since it runs the same agent loop and built-in tool execution that powers Claude Code, so tool calls are handled without custom loop code.","Use a prompt-chaining workflow, since chaining removes the need for any tool execution because each step only reads the prior step's text output."],"a":[2],"m":false,"x":"Correct -- the Agent SDK gives Claude built-in tool execution and the same agent loop and context management that power Claude Code, so the developer doesn't implement the tool loop manually."},{"d":"agents","diff":3,"q":"An engineer is debugging a CI failure and wants Claude to search through thousands of log lines to find the root cause. Pulling that much raw log output into the main conversation would consume most of the available context for the rest of the session. What should the engineer do?","o":["Paste all the log output directly into the main conversation so Claude has full visibility into every line while continuing the debugging session.","Split the logs into five equal chunks and run prompt chaining, passing each chunk's full raw text into the next chained call in sequence.","Use a routing workflow that classifies the failure type before showing the raw logs anywhere in the conversation.","Delegate the log search to a subagent, which does the searching in its own context window and returns only a summary back to the main conversation."],"a":[3],"m":false,"x":"Correct -- delegating to a subagent keeps the verbose search output in the subagent's own context window, and only the relevant summary returns to the main conversation."},{"d":"agents","diff":3,"q":"A support-ticket pipeline runs a simple sentiment classification step on every incoming ticket before the main conversation continues with more complex reasoning. This classification happens far more often than any other step and doesn't need the team's most capable model. How should the team reduce cost for this specific step?","o":["Run the classification step in the main conversation using the same model as the rest of the pipeline, since subagents cannot be configured with a different model than their caller.","Route the classification step to a dedicated subagent configured to use a faster, cheaper model, since subagents can be assigned their own model independent of the main conversation.","Convert the classification step into an evaluator-optimizer loop, since that pattern always uses a cheaper model for the evaluator half of the loop.","Convert the pipeline into an agent team, since every teammate in an agent team automatically defaults to the cheapest available model."],"a":[1],"m":false,"x":"Correct -- a subagent's model field can be set independently, letting a high-frequency, low-complexity step like sentiment classification run on a cheaper, faster model."},{"d":"agents","diff":3,"q":"A team wants to review a large pull request from three angles -- security, performance, and test coverage -- using three full, independently running Claude Code sessions that each own their own investigation, post findings to a shared task list, and let the lead pull the findings together into one report at the end. Which approach matches this, as distinct from simply firing off three parallel prompts against the same diff?","o":["Parallelization by sectioning, where three prompts run in a single request-response cycle and their raw text outputs are concatenated without any shared task list.","A single subagent invocation, since one subagent call can spawn three independent full Claude Code sessions that coordinate through its own task list.","Prompt chaining, where the security findings are fed into the performance step, which is then fed into the test-coverage step in sequence.","An agent team, where a lead spawns three teammates with their own context windows and a shared task list, and synthesizes their independently reported findings."],"a":[3],"m":false,"x":"Correct -- an agent team is exactly a lead coordinating independently running teammates through a shared task list, with the lead synthesizing their separately reported findings."},{"d":"agents","diff":3,"q":"A developer is mid-conversation, has already discussed a small bug with Claude in detail, and now wants a one-line fix applied immediately with a quick follow-up question likely afterward. Delegating this to a subagent would mean starting from a fresh context and losing the discussion so far. What should the developer do?","o":["Keep the fix in the main conversation, since the task is small, needs the shared context already built up, and subagents start fresh and add latency for quick, targeted changes.","Delegate the fix to a subagent, since subagents always share the main conversation's full history and therefore never need any extra context to be repeated.","Delegate the fix to an agent team, since agent teams are the fastest option for single-line, low-latency changes that need iterative back-and-forth.","Delegate the fix to an orchestrator-workers system, since orchestrator-workers are optimized for tasks that need frequent, iterative refinement in one exchange."],"a":[0],"m":false,"x":"Correct -- for small, targeted changes that need shared context and fast iteration, the main conversation is the better fit, since subagents start with fresh context and can add latency."},{"d":"agents","diff":3,"q":"A team is deciding whether to delegate a large, one-off dependency-audit task to a subagent instead of running it in the main conversation. The audit will read many files and produce a lot of intermediate output that won't be needed again after a summary is produced. Which of the following are genuine benefits of using a subagent for this task? (Select all that apply.)","o":["Delegating to a subagent guarantees the audit finishes faster than running the same steps in the main conversation.","The verbose intermediate output stays in the subagent's own context window, keeping the main conversation's context free for other work.","Delegating to a subagent automatically skips all permission prompts for every tool the subagent uses, regardless of configuration.","The subagent can be restricted to a specific tool allowlist, such as read-only tools, so it can't accidentally modify files during the audit.","The subagent can be configured to run on a cheaper, faster model than the main conversation if the audit doesn't need the most capable model."],"a":[1,3,4],"m":true,"x":"Correct -- this is a core benefit: verbose exploration and intermediate output stay in the subagent's own context, and only the relevant summary returns to the main conversation."},{"d":"agents","diff":3,"q":"A team is evaluating whether a new task should be built as a workflow or as an agent. Which of the following characteristics of the task would point toward choosing an agent rather than a workflow? (Select all that apply.)","o":["The task always decomposes into the same fixed set of subtasks regardless of the specific input it receives.","The steps needed to complete the task can't be fully predicted before the task starts and depend on what earlier steps discover.","The team's top priority is consistent, predictable output even if that costs some flexibility on unusual inputs.","The team wants the system to adapt its approach dynamically based on model-driven decisions rather than following one fixed path.","Latency and cost predictability matter more to the team than handling unpredictable edge cases automatically.","The task is expected to scale across many varied inputs where autonomous, self-directed operation handles that variety well."],"a":[1,3,5],"m":true,"x":"Correct -- when steps can't be predicted ahead of time and depend on what earlier steps discover, that unpredictability is a core reason to choose an agent over a workflow."},{"d":"agents","diff":3,"q":"A team is spawning an agent team to refactor three independent modules in parallel. Which of the following practices reflect the documented best practices for structuring this agent team? (Select all that apply.)","o":["Let every teammate edit any file in the codebase freely so no teammate is ever blocked waiting for a file to become available.","Assign each teammate its own distinct set of files so two teammates never edit the same file at the same time.","Maximize the number of teammates spawned at the start, since more teammates always finish the refactor proportionally faster.","Break the refactor into enough self-contained tasks that each teammate has roughly five to six tasks to work through.","Start with a small number of teammates, such as three to five, and scale up only if the work genuinely benefits from more parallel workers."],"a":[1,3,4],"m":true,"x":"Correct -- avoiding file conflicts by assigning each teammate a distinct set of files is a documented best practice for parallel agent team work."},{"d":"agents","diff":3,"q":"An engineering team is building an agent to refactor a large legacy codebase. The exact files needing changes, and how many edits are required, cannot be known until the model inspects the code and encounters each dependency. Which workflow pattern from Anthropic's agent design guidance best fits this task?","o":["Deploy an orchestrator LLM that decomposes the refactor into subtasks at runtime and delegates each one to worker LLMs, then synthesizes their combined edits","Chain a fixed sequence of LLM calls where each call edits one predetermined file and a gate checks the diff before the next file is processed","Classify each file by type first, then route it to one of several specialized prompts built for that specific file category","Run two identical refactor prompts in parallel on the whole codebase and keep whichever completed proposal receives the most agreement between the two runs"],"a":[0],"m":false,"x":"Correct — orchestrator-workers fits exactly this unpredictable, dependency-driven decomposition where subtasks emerge as the model inspects the code."},{"d":"agents","diff":3,"q":"A content team wants an agent that first drafts a product announcement in English, then, only once the draft passes a length and tone check, translates it into French, German, and Japanese. Each step should read only the previous step's validated output. Which workflow pattern matches this design?","o":["Orchestrator-workers, where a coordinating LLM decides at runtime which languages need translation based on unpredictable regional requirements","Prompt chaining, where the draft and each translation are separate LLM calls in a fixed sequence with a programmatic gate verifying the draft before translation begins","Routing, where an initial classifier LLM inspects the draft and directs it to one of several language-specific prompts","Evaluator-optimizer, where a second LLM repeatedly critiques the translations until a fixed number of refinement iterations is reached"],"a":[1],"m":false,"x":"Correct — this is prompt chaining: fixed sequential steps with a gate between the draft and translation stages."},{"d":"agents","diff":3,"q":"A support platform wants incoming tickets first classified as billing, technical, or account-access, then handled by a prompt written specifically for that category, since the resolution steps differ substantially between them. Which pattern should the team implement?","o":["Parallelization via sectioning, where the ticket is split into independent pieces that are each processed by a different prompt","Orchestrator-workers, where a coordinating LLM invents new categories at runtime as it reads each ticket","Routing, where a classifier step directs each ticket to one of three specialized downstream prompts built for its category","Prompt chaining, where the same prompt processes the ticket three times in sequence, once for each category"],"a":[2],"m":false,"x":"Correct — routing separates concerns by classifying input and sending it to a specialized prompt for that category."},{"d":"agents","diff":3,"q":"An agent must screen a user's draft email for policy violations and separately generate a suggested rewrite, where the screening and the rewrite are independent of each other and can be computed at the same time to reduce latency. Which pattern fits?","o":["Parallelization via voting, running the same rewrite prompt several times and keeping the version most other runs agree with","Evaluator-optimizer, where the rewrite is generated first and then repeatedly critiqued against policy until it passes","Orchestrator-workers, where a coordinating LLM first decides whether a policy check is even necessary for this email","Parallelization via sectioning, running the policy check and the rewrite as independent LLM calls simultaneously and combining both results"],"a":[3],"m":false,"x":"Correct — sectioning is the parallelization variant for independent subtasks like a policy check and a rewrite that don't depend on each other."},{"d":"agents","diff":3,"q":"A security team runs the same vulnerability-scanning prompt against a code diff three times independently and only flags a finding when at least two of the three runs agree, to reduce the chance any single run's mistake causes a false positive. Which pattern is this?","o":["Parallelization via voting, where multiple independent attempts at the same task are compared for consensus before a finding is accepted","Parallelization via sectioning, where the diff is split into independent pieces and each piece is scanned by a different prompt","Evaluator-optimizer, where one LLM's scan is iteratively refined by a second LLM's feedback until the findings converge","Routing, where the diff is classified by risk level and directed to one of several specialized scanning prompts"],"a":[0],"m":false,"x":"Correct — voting runs multiple independent attempts at the identical task and uses agreement between them to raise confidence."},{"d":"agents","diff":3,"q":"A publisher wants an agent to translate a poem, then have a second LLM call critique the translation's fidelity and rhythm and send that feedback back to the translator LLM, repeating for several rounds until the critic is satisfied. Which pattern fits?","o":["Parallelization via voting, where several independent translations are generated at once and the most common phrasing is kept","Evaluator-optimizer, where a generator LLM's output is iteratively refined based on a separate evaluator LLM's feedback in a loop","Prompt chaining, where the translation and critique are two fixed steps run once each with no feedback loop between them","Orchestrator-workers, where a coordinating LLM assigns each stanza of the poem to a different worker LLM to translate"],"a":[1],"m":false,"x":"Correct — evaluator-optimizer is exactly this loop where a dedicated evaluator LLM's feedback drives iterative refinement by a generator LLM."},{"d":"agents","diff":3,"q":"A developer is building a research assistant that must read dozens of files across a codebase to answer one question, but wants the main conversation to stay focused on the user's original request rather than filling up with every file's contents. Which Agent SDK subagent benefit addresses this directly?","o":["Tool restriction, since limiting which tools a subagent can call keeps its file reads from being logged in the parent's history","Parallelization, since running several subagents at once reduces the total wall-clock time spent reading files","Specialized instructions, since giving the subagent a tailored system prompt prevents it from reading irrelevant files","Context isolation, since each subagent runs in its own fresh conversation and only its final message returns to the parent"],"a":[3],"m":false,"x":"Correct — context isolation means the subagent's intermediate tool calls and file contents stay inside its own conversation, and only the final summary returns to the parent."},{"d":"agents","diff":3,"q":"A team is deciding whether to run a code review as three separate subagents — style-checker, security-scanner, and test-coverage — invoked from one parent agent, instead of handling all three checks inline in the main conversation. Which of the following are genuine benefits of this subagent-based design, according to the Agent SDK documentation? (Select all that apply.)","o":["Subagents automatically share a single combined context window with the parent, so tool results from all three checks are visible to each other in real time","The three subagents can run concurrently, so the review finishes in roughly the time of the slowest check rather than the sum of all three","Subagents guarantee that the underlying model will produce a lower rate of factual errors on each individual check than the main agent would alone","Each subagent can be restricted to only the tools it needs, such as giving the security-scanner read-only access while denying it Edit or Bash","Each subagent can carry specialized instructions and domain knowledge, such as detailed security best practices, without adding that noise to the main agent's prompt","Subagents remove the need for the parent agent to define a system prompt, since subagent instructions replace it entirely for the duration of the review"],"a":[1,3,4],"m":true,"x":"Correct — parallel subagents let independent subtasks finish in the time of the slowest one instead of running sequentially."},{"d":"agents","diff":3,"q":"A documentation team wants a subagent that can analyze markdown files and suggest edits in its response text, but must never be able to modify the files on disk or run shell commands, even by mistake. Which subagent configuration achieves this?","o":["Set the subagent's tools field to only Read and Grep, omitting Edit, Write, and Bash from its allowed tool set","Set the subagent's model field to a smaller model, since smaller models are inherently unable to call Edit or Bash tools","Omit the tools field entirely so the subagent inherits every tool from the parent, then instruct it in the prompt never to use Edit or Bash","Set the subagent's permissionMode to require manual approval for every tool call, including Read and Grep, so a human can block any action"],"a":[0],"m":false,"x":"Correct — explicitly listing only Read and Grep in the tools field restricts the subagent to read-only actions by construction."},{"d":"agents","diff":3,"q":"A team defines a performance-optimizer subagent with the description 'Performance optimization specialist for query tuning' but never mentions the subagent by name in prompts. A user then asks the main agent to 'speed up this slow database query.' What determines whether the main agent delegates to this subagent?","o":["The subagent is invoked only if the user's prompt contains the exact subagent name, so this request would be handled by the main agent directly","Claude compares the task to each defined subagent's description field and automatically delegates when the task matches, without the user naming the subagent","The subagent is invoked automatically whenever the Bash tool is present in the parent's allowed tool list, regardless of the task's subject matter","The subagent is chosen at random among all defined subagents whenever the main agent's context window approaches its token limit"],"a":[1],"m":false,"x":"Correct — Claude decides whether to invoke a subagent based on how well the task matches that subagent's description field, enabling automatic delegation without naming it."},{"d":"agents","diff":3,"q":"A developer is configuring the clear_tool_uses_20250919 context editing strategy for an agent that makes heavy use of a web_search tool and wants to: (1) never clear the web_search tool's results, (2) keep only the 3 most recent tool use/result pairs after clearing, and (3) only trigger clearing once input tokens exceed 30,000. Which parameters, set to which values, achieve this? (Select all that apply.)","o":["clear_tool_inputs set to true, which is required in order for exclude_tools to have any effect on which results are preserved","exclude_tools set to [\"web_search\"], so web_search results are never removed during clearing","keep set to {\"type\": \"tool_uses\", \"value\": 3}, so the 3 most recent tool use/result pairs are preserved","clear_at_least set to {\"type\": \"input_tokens\", \"value\": 30000}, which is the parameter that determines when clearing first activates","trigger set to {\"type\": \"input_tokens\", \"value\": 30000}, so clearing activates once input tokens exceed that threshold"],"a":[1,2,4],"m":true,"x":"Correct — exclude_tools names tools whose results are never cleared, matching the requirement to always preserve web_search results."},{"d":"agents","diff":3,"q":"An agent using both the memory tool and the clear_tool_uses context editing strategy is about to have its oldest tool results cleared as the conversation grows. The team wants to guarantee important findings already written to memory files are never themselves wiped out by the clearing process. What should they configure?","o":["Disable clear_tool_inputs, since that setting alone controls whether memory tool results can ever be cleared","Add the memory tool's name to exclude_tools, so its results are never removed during context clearing","Lower the trigger threshold so clearing happens more frequently, which prevents any single clearing event from touching memory results","Increase the keep value to the maximum allowed, since keep determines which specific tool names are protected from clearing"],"a":[1],"m":false,"x":"Correct — exclude_tools lets a team name the memory tool so its results are preserved specifically, regardless of when clearing runs."},{"d":"agents","diff":3,"q":"A team building a long-running agentic application wants context management with minimal client-side bookkeeping and doesn't need fine-grained control over which specific tool results are cleared or preserved. Which approach does Anthropic recommend as the primary strategy for this case?","o":["The clear_tool_uses_20250919 context editing strategy, since it is Anthropic's recommended default over server-side compaction for all agentic workloads","The memory tool alone, since it is designed to replace both compaction and context editing for any conversation that grows beyond the context window","Server-side compaction, which automatically summarizes older context as the conversation approaches the context window limit, requiring less integration complexity than manual context editing","Disabling context management entirely and relying on the model's context window being large enough for any realistically long agentic task"],"a":[2],"m":false,"x":"Correct — Anthropic recommends server-side compaction over manual context editing when less integration complexity and automatic handling is preferred, exactly this team's stated priorities."},{"d":"agents","diff":3,"q":"A team is building a multi-agent Python system where several branches update a shared piece of state concurrently, they need precise control over how conflicting concurrent updates to the same state key are resolved, and they need to pause execution at a specific node for human approval before resuming from that exact point. Which framework's documented capabilities best fit these requirements?","o":["Pydantic AI, which is stateless by default between runs and relies on the developer to serialize and pass message history manually for any continuity","Strands Agents SDK, which emphasizes a model-driven agentic loop with minimal hard-coded logic and OpenTelemetry-based observability across model providers","The Claude Agent SDK's built-in general-purpose subagent, which spawns a fresh, isolated conversation for each invocation with no shared mutable state between branches","LangGraph, whose reducer-based state management defines how concurrent updates to the same key are resolved and whose interrupt primitive pauses and resumes execution at a specific node"],"a":[3],"m":false,"x":"Correct — LangGraph's reducer-based approach explicitly resolves concurrent updates to shared state keys, and its interrupt primitive pauses execution at a node for human approval before resuming."},{"d":"agents","diff":3,"q":"A platform team is building an internal code-fixing bot. Their first prototype calls the Messages API directly: it sends the prompt, checks whether stop_reason is \"tool_use\", executes the tool locally, and manually appends the tool result before calling the API again to continue the loop. They want to eliminate this hand-written loop and get tool execution, permission handling, and context management out of the box, while keeping the bot running inside their own Kubernetes cluster. Which approach should they adopt?","o":["Replace the hand-rolled loop with calls to the Managed Agents REST endpoint, since Anthropic runs the agent loop and streams events back over the wire.","Keep calling the Client SDK's messages.create endpoint but wrap the response parsing in a retry decorator to handle tool_use stop reasons more reliably.","Adopt the Claude Agent SDK's query() interface, which runs the same agent loop, tool execution, and context management that power Claude Code inside their own process.","Switch to the Claude Code CLI in headless mode and shell out to it from Kubernetes jobs, parsing its JSON output, instead of maintaining Python or TypeScript integration code."],"a":[2],"m":false,"x":"Correct. The Agent SDK is a library that runs Claude Code's agent loop, tool execution, and context management inside the caller's own process and infrastructure, exactly matching the self-hosted Kubernetes requirement."},{"d":"agents","diff":3,"q":"A startup wants to offer an AI teammate feature that runs long, asynchronous multi-hour sessions for its customers, but the small engineering team does not want to build or operate any sandboxing, container orchestration, or session-storage infrastructure themselves. Which deployment model best fits their constraints?","o":["Run the Claude Agent SDK inside AWS Lambda functions and rely on Lambda's execution environment and per-invocation isolation to separate customer sessions automatically.","Adopt Managed Agents, Anthropic's hosted REST API, so Anthropic runs the agent and a per-session sandbox while the team's application sends events and streams results.","Run the Claude Agent SDK on a single long-lived EC2 instance and build a custom queue to track which customer session is currently active.","Use the Claude Agent SDK with permission_mode set to bypassPermissions so sessions never pause for approval and can run unattended for hours."],"a":[1],"m":false,"x":"Correct. Managed Agents is described as a hosted REST API where Anthropic runs the agent and a managed sandbox per session and hosts the event log, which is specifically positioned for production agents without operating sandbox or session infrastructure, including long-running asynchronous sessions."},{"d":"agents","diff":3,"q":"An SRE wants an autonomous Claude Code agent to never modify secrets files. Regardless of what the system prompt tells the model, any attempt to write to a file named .env anywhere in the working tree must be rejected before it executes, and the block must hold even if a teammate later runs the same session in bypassPermissions mode. Which implementation satisfies this?","o":["Add an instruction to the system prompt telling Claude never to write to files named .env, relying on the model to follow that written policy during every session.","Register a PreToolUse hook matched to Write|Edit that inspects tool_input.file_path and returns permissionDecision \"deny\" whenever the file name is .env.","Add \"Bash(rm .env)\" to disallowed_tools so the agent cannot delete or overwrite the file through that specific shell command invocation.","Set permission_mode to \"plan\" so Claude explores the codebase and proposes edits to .env without ever applying any change automatically."],"a":[1],"m":false,"x":"Correct. Hooks run before permission-mode evaluation and a hook's deny decision is enforced regardless of the active permission mode, including bypassPermissions, so a PreToolUse deny on the .env file name blocks the write deterministically."},{"d":"agents","diff":3,"q":"A team wants every Write tool call the agent makes to be transparently redirected into a /sandbox subdirectory, without the model being told about the redirection or being asked to approve each individual write. Which hook return value accomplishes this?","o":["hookSpecificOutput with permissionDecision \"ask\" and updatedInput containing the rewritten file_path, so a human reviews the redirected path before it is applied.","hookSpecificOutput with permissionDecision \"allow\" and updatedInput containing the file_path rewritten to prepend /sandbox, so the modified input is auto-approved.","A top-level systemMessage describing the sandbox policy, with hookSpecificOutput left empty so the default permission flow decides whether to apply the rewritten path.","hookSpecificOutput with permissionDecision \"defer\" and updatedInput containing the rewritten path, so the query pauses until the session is resumed with the new path."],"a":[1],"m":false,"x":"Correct. updatedInput must be paired with permissionDecision \"allow\" to auto-approve the modified arguments; this rewrites file_path to the sandboxed path and executes it without prompting or informing the model of the substitution."},{"d":"agents","diff":3,"q":"For every Bash tool call, three independent PreToolUse hooks run in parallel: an authorization check, an input validator, and an audit logger. On one call, the authorization check returns permissionDecision \"allow\", the input validator returns \"deny\" because the command matches a blocked pattern, and the audit logger returns an empty object. What happens to the tool call?","o":["The call is blocked, because when multiple hooks return different decisions for the same event, a deny from any hook overrides allow decisions from the others.","The call proceeds, because a majority of the hooks, two votes to one, did not explicitly deny the command when the SDK tallies the results.","The call is blocked only if the audit logger is also updated to return \"deny\", since hooks that return an empty object are excluded from the final decision.","The call proceeds, because the authorization check was registered first in the hooks array and its \"allow\" decision takes precedence over hooks registered later."],"a":[0],"m":false,"x":"Correct. When multiple hooks or permission rules apply, deny takes priority over defer, which takes priority over ask, which takes priority over allow, and a single deny blocks the tool call regardless of what the other hooks return."},{"d":"agents","diff":3,"q":"A CI pipeline runs Claude Code with permission_mode set to \"bypassPermissions\" for speed, but the team also configured an explicit ask rule in settings.json for any Bash command containing \"git push --force\". During a run, the agent attempts exactly that command. What happens?","o":["The command runs immediately without any prompt, because bypassPermissions approves every tool call that reaches the permission-mode step.","The command is denied outright and logged, because any configured deny rule always takes precedence over the bypassPermissions mode entirely.","The command falls through to the canUseTool callback for confirmation, because the ask rule is checked before permission mode and still forces a prompt.","The command is silently rewritten to drop the --force flag before execution, because bypassPermissions only applies to non-destructive Bash invocations."],"a":[2],"m":false,"x":"Correct. Ask rules from settings.json are evaluated before the permission-mode step, and the documentation states this holds \"even in bypassPermissions mode\", so the matching command is routed to canUseTool for confirmation instead of running automatically."},{"d":"agents","diff":3,"q":"An agent running with permission_mode \"acceptEdits\" is asked to update a shared library file that lives outside the current working directory and outside any configured additionalDirectories. The agent issues an Edit call targeting that external path. What should the team expect?","o":["The edit is auto-approved like any other Edit call, because acceptEdits auto-approves every file edit no matter where the target path lives on disk.","The edit still prompts through canUseTool, because acceptEdits only auto-approves edits and filesystem commands scoped to the working directory or additionalDirectories.","The edit is denied outright, because acceptEdits treats any path outside the working directory as a protected path that can never be written.","acceptEdits, since it removes prompts for the two most common tool categories, file edits and filesystem commands, across the entire filesystem without any path restriction."],"a":[1],"m":false,"x":"Correct. Auto-approved file edits and filesystem commands under acceptEdits apply only to paths inside the working directory or additionalDirectories; paths outside that scope still prompt through the normal approval flow."},{"d":"agents","diff":3,"q":"A team is deploying a headless agent that must never block waiting for human input, and any tool call that is not explicitly pre-approved should fail closed rather than silently hang. They also configure allowed_tools with the specific tools the agent needs. Which permission_mode choice matches this requirement?","o":["\"default\", since unmatched calls always fall through to a callback that denies immediately without ever waiting for a response.","\"plan\" mode, since plan mode never executes file edits or shell-write tools regardless of any approval state Claude reaches during exploration.","\"dontAsk\", since unmatched tool calls are denied outright instead of being routed to a canUseTool callback that could block waiting for a response.","\"acceptEdits\", since it removes prompts for the two most common tool categories, file edits and common filesystem commands, within the working directory."],"a":[2],"m":false,"x":"Correct. \"dontAsk\" converts what would otherwise be a prompt into an immediate denial and skips the canUseTool callback entirely, so unmatched calls fail closed without ever blocking on human input."},{"d":"agents","diff":3,"q":"An agent needs the Bash tool available so it can run linters and tests, and the team configures disallowed_tools=[\"Bash(rm *)\"] to block deletions. What is the accurate behavior of this specific configuration?","o":["Bash stays fully visible to Claude; only calls matching the rm pattern are denied, and every other Bash call still follows normal permission-mode handling.","Bash is removed from Claude's context entirely, since any disallowed_tools entry that references Bash removes the tool's whole definition from the request.","The scoped rule has no effect, because disallowed_tools only accepts bare tool names rather than command patterns, so every Bash call stays unrestricted.","Claude can no longer request any Bash command at all, because one scoped deny entry causes the SDK to drop the whole tool from its available tool list."],"a":[0],"m":false,"x":"Correct. A scoped deny rule like Bash(rm *) keeps the Bash tool definition in Claude's context; only calls matching the rm pattern are denied in every permission mode, and other Bash calls continue to follow the active permission mode as usual."},{"d":"agents","diff":3,"q":"A code-review agent needs to read through 40 files, but the team wants the main conversation to stay short so later turns aren't paying for tokens spent on every file that was opened during the review. Which architecture keeps the main agent's context lean?","o":["Delegate the review to a subagent defined with an AgentDefinition; its tool calls and file contents stay in its own context, and only a final summary returns to the parent.","Increase max_turns on the main query so Claude has enough budget to read all 40 files directly in the main conversation without the loop stopping early.","Set effort to \"low\" on the main query so each turn that reads a file consumes fewer reasoning tokens, even though all 40 files still load fully into the shared main conversation.","Enable include_partial_messages so file contents stream back to the main conversation incrementally as text deltas instead of arriving all at once."],"a":[0],"m":false,"x":"Correct. A subagent starts with a fresh context; intermediate tool calls and file contents stay inside the subagent, and only its final message returns to the parent, so the main conversation's context does not grow by the full subtask transcript."},{"d":"agents","diff":3,"q":"A team defines a doc-reviewer subagent that should be able to read and search documentation files but must never be able to edit or delete anything, even if a later prompt tries to convince it to \"just fix the typo directly.\" How should the AgentDefinition be configured?","o":["Set tools=[\"Read\", \"Grep\"] on the AgentDefinition so only those two tools are available to the subagent, regardless of what its prompt says.","Omit the tools field entirely and add a strongly worded instruction in the subagent's own prompt telling it never to use Edit or Write.","Set disallowedTools=[\"Edit\", \"Write\"] on the parent query's own top-level options so that restriction applies to the main agent's own tool set.","Set permissionMode to \"plan\" on the AgentDefinition so any edit attempt made by the subagent is silently discarded after being planned."],"a":[0],"m":false,"x":"Correct. Specifying tools on an AgentDefinition restricts that subagent to exactly the listed tools, so Edit and Write are structurally unavailable no matter what the subagent's prompt or a later request tries to argue."},{"d":"agents","diff":3,"q":"A main agent session is configured with permission_mode \"bypassPermissions\" for a fully autonomous overnight run, and it also invokes a general-purpose subagent to handle a subtask. A security reviewer is concerned the subagent might have a more permissive posture than intended. What is actually true about the subagent's permission behavior in this setup?","o":["The subagent automatically inherits bypassPermissions from the parent and this cannot be overridden per subagent, so it also gets full tool access without prompts, aside from any explicit ask rule.","The subagent defaults back to \"default\" permission mode unless permissionMode is explicitly set on its own AgentDefinition, so it prompts through canUseTool for anything not covered by allow rules.","The subagent always runs under whichever of the parent's mode and its own configured mode is more restrictive, so it effectively operates under \"default\" mode here.","Subagents never execute tools directly; they only return recommendations that the parent agent must separately approve and execute, so the parent's permission mode does not apply to them."],"a":[0],"m":false,"x":"Correct. The documentation states that when the parent uses bypassPermissions, acceptEdits, or auto, all subagents inherit that mode and it cannot be overridden per subagent, though an explicit ask rule still forces a prompt."},{"d":"agents","diff":3,"q":"A developer wraps a get_temperature function in an in-process MCP server named \"weather\" using create_sdk_mcp_server, then passes it via mcp_servers to query(). They want the tool to run without a permission prompt, but calls to it are being denied by the default permission flow. What is most likely missing from their ClaudeAgentOptions?","o":["allowed_tools=[\"mcp__weather__get_temperature\"], since MCP tools use the name mcp__{server}__{tool} and need that full name listed to auto-approve.","allowed_tools=[\"get_temperature\"], since auto-approval rules match against a tool's bare function name regardless of which server registered it.","disallowed_tools=[], since an empty deny list is required to clear any tool that was previously denied in some earlier, unrelated session.","permission_mode=\"bypassPermissions\", since custom MCP tools can only run automatically once permission checks are bypassed for the whole session entirely."],"a":[0],"m":false,"x":"Correct. MCP tools are exposed to Claude with the fully qualified name mcp__{server_name}__{tool_name}, so the allow rule must list mcp__weather__get_temperature, not just the bare function name, for it to auto-approve."},{"d":"agents","diff":3,"q":"A custom fetch_data tool calls an external API. When the API returns a non-200 status, the current handler lets the underlying HTTP exception propagate uncaught. The team wants Claude to receive a message that clearly states which endpoint failed and that it was an HTTP error, so Claude can decide whether to retry or report the failure, rather than a bare exception string. What should the handler do differently?","o":["Catch the failure inside the handler and return isError: true with a composed message describing the failed endpoint, since an uncaught exception only returns the raw text.","Let the exception propagate as before, since the SDK's in-process MCP server automatically enriches uncaught exceptions with the endpoint name and status code.","Return a normal, non-error content block containing the raw exception text, so Claude treats the response as a successful result and parses the failure itself.","Raise a custom exception subclass instead of the built-in one, since the SDK is documented to inspect the exception's class name to decide how much extra context to add to the result."],"a":[0],"m":false,"x":"Correct. Catching the error and returning isError: true lets the handler compose a message with context the raw exception lacks, such as which endpoint failed and that it was an HTTP error, so Claude reads exactly that instead of a bare exception string."},{"d":"agents","diff":3,"q":"An open-ended prompt like \"improve this codebase\" is run against the Agent SDK without any turn or budget limits, and the session runs far longer and costs far more than expected. For their next production deployment, the team wants the loop to stop automatically once either a turn count or a dollar amount is exceeded, and to be able to tell which limit was hit from the final message. What should they configure and check?","o":["Set max_turns and max_budget_usd in ClaudeAgentOptions, then check the ResultMessage subtype, error_max_turns or error_max_budget_usd, to see which limit fired.","Set effort to \"low\", since lower reasoning effort automatically caps the number of turns a session can take before the agent loop terminates on its own.","Set permission_mode to \"dontAsk\", since denying every unmatched tool call causes the loop to terminate once no further tools remain available to try.","Poll total_cost_usd after every turn and manually call an abort method once a threshold is crossed, since the SDK offers no built-in way to cap turns or spend at all."],"a":[0],"m":false,"x":"Correct. max_turns and max_budget_usd are the documented options for capping the loop, and when either limit is hit the SDK returns a ResultMessage whose subtype is error_max_turns or error_max_budget_usd so the caller can tell which one fired."},{"d":"agents","diff":3,"q":"A long-running agent session is approaching its context window limit. The team wants two things: a full, unabridged copy of the conversation saved before the SDK summarizes older history, and a guarantee that a specific formatting rule survives every compaction event without being paraphrased away. Which combination of mechanisms addresses both needs?","o":["Register a PreCompact hook to archive the full transcript first, and put the formatting rule in CLAUDE.md so it reloads on every request instead of living only in the initial prompt.","Increase max_turns so compaction never triggers, and repeat the formatting rule at the start of every single user message sent throughout the session.","Rely on the automatic compaction summary alone to preserve both the transcript and the formatting rule, since summaries are designed to retain conversation details verbatim.","Register a PostToolUse hook to archive the transcript after each tool call completes, and place the formatting rule inside a subagent's AgentDefinition prompt instead of the main session."],"a":[0],"m":false,"x":"Correct. A PreCompact hook fires before compaction and is the documented mechanism for archiving the full transcript first, and CLAUDE.md is reloaded and re-injected on every request, so a rule placed there survives compaction rather than being paraphrased away as an early-conversation instruction would be."},{"d":"agents","diff":3,"q":"A team is designing PreToolUse hooks for their Agent SDK deployment and needs to understand what a hook's return value can actually do before a tool executes. Which of the following are accurate statements about PreToolUse hook behavior? (Select all that apply.)","o":["A hook can set permissionDecision to \"defer\", which ends the query so the session can be resumed later once a longer-running approval process completes.","A hook can set updatedInput together with permissionDecision \"allow\" to auto-approve a modified version of the tool's arguments before it executes.","A hook can set async: true so the agent continues immediately without waiting, and this async hook can still block or modify the tool call it responded to.","When multiple PreToolUse hooks match the same call, the SDK resolves conflicts by matcher specificity, so more specific patterns always override less specific ones.","A hook can return permissionDecisionReason to explain a deny to the model, so it can adjust its approach instead of blindly retrying the same call.","A hook's permissionDecision of \"allow\" always causes the tool to execute immediately, skipping any deny or ask rules configured in settings.json."],"a":[0,1,4],"m":true,"x":"Correct. Returning \"defer\" ends the current query so it can be resumed later, which is the documented pattern for deferring a tool call until a longer-running approval process finishes."},{"d":"agents","diff":3,"q":"Which of the following statements about Claude Agent SDK permission modes are accurate? (Select all that apply.)","o":["In \"bypassPermissions\" mode, hooks still execute and can block an operation even though the mode itself approves every tool call that reaches the permission-mode step.","\"acceptEdits\" mode auto-approves filesystem commands like mkdir, touch, mv, and cp anywhere on the filesystem, even outside the working directory or additionalDirectories.","\"plan\" mode auto-approves file edits once Claude finishes exploring, so a finalized plan can be applied to the working directory without further prompts.","\"bypassPermissions\" mode cannot be used at all when the agent process itself is running as root on Unix-based operating systems, per the documented restriction.","allowed_tools fully constrains \"bypassPermissions\" mode, so listing only [\"Read\"] in allowed_tools means Bash and Write remain blocked even under bypassPermissions.","\"auto\" mode uses a model classifier to approve or deny each individual tool call rather than relying purely on static allow and deny rules."],"a":[0,3,5],"m":true,"x":"Correct. Hooks still execute under bypassPermissions and can block operations, even though the mode itself auto-approves calls that reach the permission-mode evaluation step."},{"d":"agents","diff":3,"q":"Which of the following statements about subagents in the Claude Agent SDK are accurate? (Select all that apply.)","o":["Claude invokes subagents through the Agent tool, so Agent should be included in allowedTools to auto-approve subagent invocations without a permission prompt.","A subagent automatically receives the parent's full conversation history, including every prior tool call and result, so it can continue exactly where the parent left off.","As of Claude Code v2.1.172, a subagent five levels below the main agent cannot spawn further subagents, regardless of whether it runs in the foreground or background.","Subagent transcripts are stored inside the parent's session file, so when the main conversation compacts, the subagent's transcript is summarized along with it.","Omitting the tools field on an AgentDefinition means the subagent inherits all tools available to the parent, while specifying tools restricts it to that list.","Every subagent invocation blocks the parent's execution until the subagent completes, since background execution for subagents was removed in Claude Code v2.1.198."],"a":[0,2,4],"m":true,"x":"Correct. Subagents are invoked via the Agent tool, and including Agent in allowedTools auto-approves those invocations so they don't trigger a permission prompt."},{"d":"agents","diff":3,"q":"Which of the following statements about context management and compaction in the Claude Agent SDK are accurate? (Select all that apply.)","o":["Automatic compaction summarizes older conversation history to free space while keeping the most recent exchanges and key decisions intact.","Once compaction occurs, the SDK yields a message with subtype \"compact_boundary\" so applications can detect that a summarization event happened.","MCP tool schemas are always loaded fully on every single request no matter the tool search settings, so adding more MCP servers never affects context usage at all.","Delegating a subtask to a subagent keeps context lean because only the subagent's final response returns to the parent, not its full intermediate transcript.","Prompt caching does not apply to the system prompt or tool definitions in SDK sessions, since only conversation history is eligible for caching.","Sending \"/compact\" as a prompt string has no effect in SDK applications, since manual compaction is only available through the Claude Code CLI."],"a":[0,1,3],"m":true,"x":"Correct. Automatic compaction is described as summarizing older history to free space while keeping the most recent exchanges and key decisions intact."},{"d":"apps","diff":3,"q":"A team is building a high-volume, cost-sensitive customer support chatbot that must respond within a tight latency budget while still handling everyday support reasoning competently. Which model should the team use to start prototyping?","o":["Claude Opus 4.8","Claude Haiku 4.5","Claude Fable 5","Claude Sonnet 5"],"a":[1],"m":false,"x":"Haiku 4.5 is the fastest model with near-frontier intelligence at the lowest price point, matching the tight latency, high volume, and cost sensitivity described."},{"d":"apps","diff":3,"q":"An enterprise needs a coding agent capable of running autonomously for multiple hours to perform a large-scale refactor across a complex codebase, prioritizing accuracy over cost. Which model best fits this requirement?","o":["Claude Haiku 4.5","Claude Sonnet 5","Claude Opus 4.8","Claude Opus 4.1"],"a":[2],"m":false,"x":"Opus 4.8 is described as the model for complex agentic coding and enterprise work, including multi-hour autonomous coding agents and large-scale refactoring, matching the accuracy-first requirement."},{"d":"apps","diff":3,"q":"A product team needs frontier-level intelligence for code generation, data analysis, and agentic tool use across a large user base, and wants the best balance of speed "],"a":[0],"m":false,"x":"Prompt caching lets Claude reuse previously processed background content, such as a repeated system prompt, across turns to reduce cost and latency for the unchanged portion."},{"d":"apps","diff":3,"q":"An agent needs to retrieve and analyze the full content of specific web pages and PDF documents referenced during a conversation, using a platform-run tool rather than infrastructure the customer hosts. Which built-in tool satisfies this functional requirement?","o":["Web search tool","Web fetch tool","Code execution tool","MCP connector"],"a":[1],"m":false,"x":"The web fetch tool retrieves the full content from specified web pages and PDF documents for in-depth analysis, matching the requirement to pull specific referenced content."},{"d":"apps","diff":3,"q":"A regulated healthcare customer's compliance requirement states that Anthropic must not retain any prompt or output content from their API traffic. Which architectural property must the solution be built around?","o":["Standard 5-minute prompt caching","Zero Data Retention (ZDR) eligible features only","Standard batch processing","Extended thinking"],"a":[1],"m":false,"x":"Restricting the architecture to Zero Data Retention eligible features ensures no prompt or output content is retained, matching the strict no-retention compliance requirement."},{"d":"apps","diff":3,"q":"A team wants Claude to operate a legacy desktop application that exposes no API, by taking screenshots and issuing mouse and keyboard actions. Which tool fits this functional requirement?","o":["Text editor tool","Bash tool","Computer use tool","Code execution tool"],"a":[2],"m":false,"x":"The computer use tool controls computer interfaces by taking screenshots and issuing mouse and keyboard commands, directly matching the requirement to operate a GUI-only legacy application."},{"d":"apps","diff":3,"q":"Using Claude Opus 4.8, an architecture team wants Claude to automatically decide how much internal reasoning to perform per request, ranging from quick answers to deep multi-step analysis, without maintaining separate prompts for each depth level. Which capability, tuned by the effort parameter, satisfies this requirement?","o":["Extended thinking with a fixed token budget","Adaptive thinking","Prompt caching","Structured outputs"],"a":[1],"m":false,"x":"Adaptive thinking is the only thinking mode on Claude Opus 4.8, letting Claude dynamically decide when and how much to think, tuned through the effort parameter."},{"d":"apps","diff":3,"q":"A downstream billing system requires that every Claude response parse as valid JSON matching an exact schema, with zero tolerance for malformed output that would require manual repair. Which feature should the integration use?","o":["Extended thinking","Structured outputs","Prompt caching","Context editing"],"a":[1],"m":false,"x":"Structured outputs guarantee schema conformance for JSON responses, directly satisfying the requirement that every response parse as valid JSON matching an exact schema."},{"d":"apps","diff":3,"q":"A legal research assistant must let reviewers verify that each answer is grounded in the exact sentences of source contract PDFs uploaded directly in the request, not just a general summary. Which feature satisfies this auditability requirement?","o":["Citations","Search results","Structured outputs","Files API"],"a":[0],"m":false,"x":"Citations grounds Claude's responses in provided source documents, letting Claude give detailed references to the exact sentences and passages used, matching this auditability requirement."},{"d":"apps","diff":3,"q":"Before sending a large batch of prompts, a finance team wants to estimate token usage precisely to stay within a fixed monthly budget, without incurring the cost of actually generating a response for each estimate. Which capability should they use?","o":["Token counting","Batch processing discount","Extended thinking preview","Effort parameter"],"a":[0],"m":false,"x":"Token counting determines the number of tokens in a message before sending it to Claude, letting the team estimate usage against a budget without generating an actual response."},{"d":"apps","diff":3,"q":"An enterprise agent platform has thousands of internal tool definitions registered, but including every definition in the model's context on each request is prohibitively expensive and hurts tool-selection accuracy. Which infrastructure feature addresses this at scale?","o":["Fine-grained tool streaming","Tool search tool","MCP connector","Programmatic tool calling"],"a":[1],"m":false,"x":"The tool search tool lets Claude scale to thousands of tools by dynamically discovering and loading only relevant ones on demand using regex-based search, optimizing context usage and selection accuracy."},{"d":"apps","diff":3,"q":"A document-heavy workflow repeatedly references the same set of reference PDFs across many separate API requests over several weeks, and the team wants to avoid re-uploading the full file content with every call. Which feature should the architecture use?","o":["Files API","Prompt caching","Context editing","Compaction"],"a":[0],"m":false,"x":"The Files API lets the team upload and manage files once, then reference them across many subsequent requests without re-uploading the full content each time."},{"d":"apps","diff":3,"q":"A long-running autonomous agent conversation regularly approaches the model's context window limit. The architecture needs the platform to automatically summarize earlier parts of the conversation server-side, and to clear out stale tool results as the token limit approaches, without the client managing this manually. Which two features should the architecture enable?","o":["Compaction","Context editing","Prompt caching","Token counting","Batch processing","Files API"],"a":[0,1],"m":true,"x":"Compaction provides server-side context summarization for long-running conversations, automatically summarizing earlier parts of the conversation as the window limit approaches."},{"d":"apps","diff":3,"q":"An agentic coding platform needs to stream large tool-call parameters to the client without buffering delay, and also let Claude dynamically discover the right tool from a registry of thousands of available tools using regex-based search while keeping context usage low. Which two features should the team enable?","o":["Fine-grained tool streaming","Tool search tool","MCP connector","Programmatic tool calling","Memory tool","Web search tool"],"a":[0,1],"m":true,"x":"Fine-grained tool streaming streams tool-use parameters without buffering or JSON validation delay, reducing latency for receiving large tool-call parameters."},{"d":"apps","diff":3,"q":"A global enterprise already has procurement and billing agreements with AWS, Google Cloud, and Microsoft Azure, and wants to deploy Claude through those existing cloud relationships rather than contracting directly with Anthropic. Which three deployment routes satisfy this requirement?","o":["Amazon Bedrock","Google Cloud (Vertex AI)","Microsoft Foundry","Claude API (direct)","Claude Platform on AWS","IBM watsonx"],"a":[0,1,2],"m":true,"x":"Amazon Bedrock is an AWS-operated route to Claude that bills through an enterprise's existing AWS relationship, satisfying the requirement to use existing cloud procurement."},{"d":"apps","diff":3,"q":"A coding assistant must retain project context and learned preferences across many separate sessions spanning weeks, and must also directly create and edit files in a workspace the customer hosts, using a built-in file-editing interface. Which two client-side tools fit these requirements?","o":["Memory tool","Text editor tool","Code execution tool","Web fetch tool","Computer use tool"],"a":[0,1],"m":true,"x":"The memory tool enables Claude to store and retrieve information across conversations, building knowledge and maintaining project context over many separate sessions."},{"d":"apps","diff":3,"q":"A platform engineering team runs a customer support application on Claude in production and wants to build a compliance policy for planning migration testing whenever a model they depend on is deprecated. Per Anthropic's stated commitment, what is the minimum notice period they can count on before a publicly released model they are actively using is retired?","o":["At least 30 days before the retirement date","At least 60 days before the retirement date","At least 90 days before the retirement date","At least 180 days before the retirement date"],"a":[1],"m":false,"x":"Correct -- Anthropic notifies customers with active deployments at least 60 days before a publicly released model's retirement date."},{"d":"apps","diff":3,"q":"A fintech company runs automated compliance workflows against Claude Opus 4.5 and must guarantee that model behavior never changes between deployments without an explicit, reviewed migration step. When specifying the model in their Messages API calls, which practice should they adopt?","o":["Specify the convenience alias, which resolves to whichever dated snapshot Anthropic currently treats as current.","Specify the exact dated snapshot ID, and update it only during a deliberate, scheduled migration you control.","Specify the model as an unpinned 'latest' pointer so requests always resolve to Anthropic's newest release.","Omit the model parameter and let the API apply its own default model selection for the account."],"a":[1],"m":false,"x":"Correct -- pinning the exact dated snapshot ID keeps behavior fixed until the team deliberately migrates to a new snapshot on their own schedule."},{"d":"apps","diff":3,"q":"Ahead of an upcoming retirement date, a platform team needs to find every place in their production traffic where a soon-to-be-retired model is still being called, broken down by API key and model, before they finalize their migration plan. Which action should they take in Claude Console?","o":["Contact Anthropic support and wait for a manually compiled traffic report for the account.","Enable extended thinking on every request so each response payload includes the model ID.","Open the Usage page in Claude Console and export a CSV broken down by API key and model.","Grep the organization's own server logs for the literal string 'deprecated' across services."],"a":[2],"m":false,"x":"Correct -- the Usage page's CSV export is the documented way to audit API usage broken down by API key and model, making it straightforward to locate deprecated-model traffic."},{"d":"apps","diff":3,"q":"A team is building a lightweight internal tool that calls the Messages API directly over HTTPS without using an official Anthropic SDK. During code review, a colleague points out a required header is missing from every request. Which header must be included, and what does poor version management risk?","o":["Include an anthropic-model-lock header pinning the exact model snapshot; omitting it risks Anthropic silently substituting a cheaper model on high-traffic days.","Include an anthropic-org-id header identifying the billing organization for usage tracking; omitting it risks requests being billed to the wrong account without any visible error.","Include an anthropic-region header specifying the inference region; omitting it risks requests being routed to a data center outside the required residency zone.","Include the anthropic-version header; omitting proper version pinning risks unexpected shifts in response format as Anthropic evolves the API over time."],"a":[3],"m":false,"x":"Correct -- the anthropic-version header (e.g., anthropic-version: 2023-06-01) is required on direct API calls, and official SDKs set it automatically; omitting or failing to manage it risks being affected by changes the version pin would otherwise guard against."},{"d":"apps","diff":3,"q":"A product manager drafts this success criterion for a new Claude-powered ticket triage feature: 'The model should triage tickets well.' A prompt engineer reviews it before evaluation work begins and flags it as unusable for building a test suite. Which revised criterion best fixes the problem using the SMART framework?","o":["'Achieve at least 90% category accuracy on a held-out set of 5,000 tickets, a 10-point gain over the current rule-based system.'","'The triage model should feel accurate and trustworthy to the support team when they review its category assignments each week.'","'The triage model should use the most recent Claude model available so it stays state-of-the-art as new releases ship.'","'The triage model should be reviewed by a senior engineer before every deployment to confirm the categories look reasonable.'"],"a":[0],"m":false,"x":"Correct -- this criterion is specific, measurable, achievable, and relevant: it names a concrete metric, a target threshold, a test set size, and a baseline comparison."},{"d":"apps","diff":3,"q":"An evaluation lead is building automated grading for two different Claude features: one classifies support tickets into a fixed set of categories, and the other drafts customer-facing replies that must sound empathetic. The team wants the fastest reliable automated grading method for each. Which pairing is most appropriate?","o":["Use an LLM-based Likert scale for the ticket-category classifier, and exact-match string comparison for empathetic tone in the drafted replies.","Use cosine similarity against reference embeddings to grade both the ticket-category classifier and the empathetic tone of the drafted replies.","Use exact-match string comparison for the ticket-category classifier, and an LLM-based Likert scale rating for empathetic tone in the drafted replies.","Use ROUGE-L summarization-overlap scoring to grade both the ticket-category classifier and the empathetic tone of the drafted replies."],"a":[2],"m":false,"x":"Correct -- exact match suits a categorical task with a fixed, known correct label, while an LLM-based Likert scale suits grading a subjective quality like empathetic tone."},{"d":"apps","diff":3,"q":"A team wants to build a production billing pipeline's core logic entirely around a platform capability currently labeled Beta in Anthropic's feature-availability table. A tech lead raises a concern before approving the design. What is the most accurate basis for that concern?","o":["Beta features are billed at a 50% premium compared to generally available features, making them unsuitable for cost-sensitive billing pipelines.","Beta features cannot be used together with prompt caching or batch processing, which would prevent the pipeline from scaling cost-effectively.","Beta features are capped at 200k tokens of context regardless of the underlying model, which would limit the pipeline's document processing.","Beta features may change significantly or be discontinued based on feedback and are not guaranteed for ongoing production use, unlike GA features."],"a":[3],"m":false,"x":"Correct -- by definition, Beta features may change significantly or be discontinued based on feedback and are not guaranteed for ongoing production use, which is exactly the risk of anchoring core billing logic to one."},{"d":"apps","diff":3,"q":"A team prototyped an autonomous research agent locally using the Claude Agent SDK, storing session state as JSONL files on a developer's laptop. They are now ready to launch it as a long-running, asynchronous production service for external customers and do not want to operate their own sandbox or session infrastructure. What should they do?","o":["Move the agent to Managed Agents, a hosted REST API where Anthropic runs the agent loop and sandbox and the application streams events and results.","Keep running the Agent SDK exactly as prototyped, since the SDK already runs sandboxing and session storage as a fully managed cloud service.","Rewrite the agent using the Claude Code CLI in interactive mode, since the CLI is the recommended way to serve long-running external customer traffic.","Switch the agent to the Client SDK and manually implement a custom tool-execution loop, since that removes the need for any session infrastructure."],"a":[0],"m":false,"x":"Correct -- Managed Agents is the hosted option built for production agents that don't want to operate their own sandbox or session infrastructure, which matches this team's stated need exactly."},{"d":"apps","diff":3,"q":"A DevOps engineer needs to run an automated code-review agent as a step in the company's CI/CD pipeline, triggered on every pull request with no human present to interact with a terminal session. Which tool is the better fit for this specific use case, per Anthropic's own guidance on the two interfaces?","o":["The Claude Code CLI, since it is positioned for production automation and CI/CD pipelines, while the SDK is best suited to interactive development.","Either tool works identically for this purpose, since the CLI and SDK share no capabilities and differ only in installation method.","The Claude Agent SDK, since it is positioned for production automation and CI/CD pipelines, while the CLI is best suited to interactive development.","Neither tool is appropriate for unattended CI/CD use; both require an interactive terminal session with a human present to complete a run."],"a":[2],"m":false,"x":"Correct -- Anthropic's own comparison lists CI/CD pipelines and production automation as SDK use cases, while interactive development and one-off tasks are listed as CLI use cases."},{"d":"apps","diff":3,"q":"A startup is building a high-volume feature that tags incoming support emails with a short label, expects tight latency requirements, and has a limited development budget. Following Anthropic's guidance for choosing a starting model, what is the recommended approach?","o":["Begin implementation with Claude Opus 4.8, the most capable model, and plan to migrate to a cheaper model only after the feature reaches full scale.","Begin implementation with Claude Haiku 4.5, test the use case thoroughly, and upgrade only if performance fall
