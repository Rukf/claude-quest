<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Quest — The CCDV-F Chronicles</title>
<style>
:root{
  --bg:#0a0812;
  --panel:#191228cc; --panel2:#1d1533; --panel3:#241a40;
  --surface:#191228; --surface2:#221936;
  --border:#3a2c5c; --line2:#54417e;
  --gold:#e8c35a; --gold2:#ffdd82; --gold3:#b98a1f;
  --text:#efe9fb; --dim:#ab9fce; --faint:#7d729b;
  --hp:#e74c3c; --hp2:#8e2318; --xp:#e8c35a; --mastery:#2dd4bf; --teal:#2dd4bf;
  --ok:#5fe08a; --bad:#f87171;
  --common:#b9b4c6; --uncommon:#5fe08a; --rare:#5aa8ff; --epic:#c98bff; --legend:#ffab52;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{color:var(--text); min-height:100%;
  font-family:'Avenir Next','Segoe UI','Trebuchet MS',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  /* ---- cozy tavern backdrop (all original CSS: wood walls, hearth, lanterns) ---- */
  background:
   radial-gradient(200px 240px at 10% 7%, #f0a03a2e, transparent 70%),        /* left lantern glow */
   radial-gradient(200px 240px at 90% 7%, #f0a03a2e, transparent 70%),        /* right lantern glow */
   radial-gradient(80% 48% at 50% 116%, #8a4413aa, transparent 62%),          /* hearth glow (bottom) */
   radial-gradient(60% 40% at 50% -14%, #4a30169e, transparent 60%),          /* warm ceiling light */
   radial-gradient(125% 125% at 50% 42%, transparent 50%, #000000a8 100%),    /* vignette */
   repeating-linear-gradient(0.5deg, #ffffff06 0 2px, transparent 2px 6px),   /* faint wood grain */
   repeating-linear-gradient(90deg, #26190a 0 64px, #150c04 64px 68px, #2c1e0d 68px 132px, #150c04 132px 136px), /* vertical planks */
   #1a120b;
  background-attachment:fixed;}
#shell{display:flex; gap:18px; max-width:1160px; margin:0 auto; align-items:flex-start; justify-content:center; position:relative; z-index:1;}
#app{flex:0 1 860px; max-width:860px; min-width:0; margin:0; padding:20px 14px 60px;}
code{font-family:'SF Mono',ui-monospace,'Cascadia Mono',Consolas,monospace; font-size:.86em;
  background:#0c0a17; border:1px solid #3d2f63; color:#7ff0dc; padding:1px 6px; border-radius:5px;}
/* ---------- PERSISTENT GEAR RAIL ---------- */
#rail{flex:0 0 250px; position:sticky; top:0; align-self:flex-start; max-height:100vh; overflow-y:auto; padding:20px 8px 24px; scrollbar-width:thin;}
#rail[hidden]{display:none;}
.railpanel{border:1px solid var(--border); border-radius:12px; overflow:hidden;
  background:linear-gradient(180deg,#1c142f,#130d22); box-shadow:0 6px 20px #00000055;}
.railhead{font-family:'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif; color:var(--gold2); font-size:.98em; font-weight:700; line-height:1.2; text-align:center;
  padding:12px 10px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,#271c44,#1a1330); text-shadow:0 0 14px #e8c35a44;}
.railhead .rlv{display:block; color:var(--dim); font-size:.76em; font-weight:500; font-family:'Avenir Next',sans-serif; margin-top:2px; text-shadow:none;}
.railstats{display:grid; grid-template-columns:1fr 1fr; gap:1px; margin:0; background:var(--border); border-bottom:1px solid var(--border);}
.rst{background:linear-gradient(180deg,#1b1430,#150f26); border:none; border-radius:0; padding:8px 6px; font-size:.78em; text-align:center;}
.rst b{color:var(--gold2); font-weight:700;}
.raillist{display:flex; flex-direction:column; gap:2px; padding:6px 8px 8px;}
.rslot{display:flex; align-items:center; gap:8px; border:none; border-left:3px solid transparent; border-radius:0 6px 6px 0; padding:6px; background:transparent; cursor:pointer; transition:background .12s,transform .12s;}
.rslot:hover{background:var(--surface2); transform:translateX(2px);}
.rslot.empty{opacity:.4; border-style:solid; cursor:default;}
.rslot.empty:hover{background:none; transform:none;}
.rslot .ri{font-size:1.02em; width:18px; text-align:center; flex:none;}
.rslot .rn{flex:1; min-width:0; font-size:.74em; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rslot .rb{font-size:.68em; color:var(--dim); flex:none; font-family:'SF Mono',ui-monospace,monospace;}
.q-common.rslot{border-left-color:var(--common);} .q-uncommon.rslot{border-left-color:var(--uncommon);}
.q-rare.rslot{border-left-color:var(--rare);} .q-epic.rslot{border-left-color:var(--epic);}
.q-legend.rslot{border-left-color:var(--legend); box-shadow:inset 8px 0 16px -8px #ffab5266; animation:legendglow 2.2s ease-in-out infinite;}
@keyframes legendglow{50%{box-shadow:inset 10px 0 20px -8px #ffab52aa;}}
.railtitle{padding:9px 12px 2px; font-size:.66em; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:700;}
@media(max-width:900px){ #rail{display:none;} }
/* ---------- HEADINGS ---------- */
h1,h2,h3{font-family:'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif; letter-spacing:.4px; font-weight:700;}
h1{color:var(--gold2); text-shadow:0 0 22px #e8c35a55; text-align:center; font-size:2em; margin:12px 0 2px;}
.sub{color:var(--dim); text-align:center; margin-bottom:18px; font-size:.98em;}
.panel{background:linear-gradient(180deg,var(--panel2),#140e24); border:1px solid var(--border);
  border-radius:12px; padding:16px; margin:12px 0; box-shadow:0 6px 22px #00000055, inset 0 1px 0 #ffffff0a;}
.panel.gold{border-color:#8a6d1f; box-shadow:0 6px 22px #00000055, 0 0 22px #e8c35a1f, inset 0 1px 0 #ffffff10;}
.panel.center{text-align:center;}
/* ---------- BUTTONS ---------- */
.btn{display:inline-block; background:linear-gradient(180deg,#2c2148,#1d1533); color:var(--text);
  border:1px solid var(--line2); border-radius:10px; padding:10px 18px; font-size:1em; cursor:pointer;
  transition:all .14s; font-family:inherit; font-weight:600; margin:4px 4px 4px 0; box-shadow:inset 0 1px 0 #ffffff10;}
.btn:hover{border-color:var(--gold); color:var(--gold2); box-shadow:0 0 16px #e8c35a33, inset 0 1px 0 #ffffff18; transform:translateY(-1px);}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}
.btn.gold{background:linear-gradient(180deg,#6a531a,#40310c); border-color:var(--gold); color:var(--gold2); text-shadow:0 0 10px #e8c35a55;}
.btn.gold:hover{background:linear-gradient(180deg,#8a6c22,#54400f); box-shadow:0 0 22px #e8c35a55;}
.btn.danger{background:linear-gradient(180deg,#63202d,#38141d); border-color:#7c4455;}
.btn.danger:hover{border-color:#f87171; color:#ffd9dc; box-shadow:0 0 16px #f8717133;}
.btn.small{padding:6px 12px; font-size:.85em;}
.btn.block{display:block; width:100%; text-align:left; margin:8px 0;}
input[type=text],textarea{background:#0f0b1c; color:var(--text); border:1px solid var(--border);
  border-radius:8px; padding:10px; font-size:1em; width:100%; font-family:inherit;}
input[type=text]:focus,textarea:focus{outline:none; border-color:var(--gold);}
textarea{font-family:'SF Mono',ui-monospace,monospace; font-size:.8em; min-height:90px;}
.row{display:flex; gap:12px; flex-wrap:wrap;}
.row>*{flex:1; min-width:200px;}
/* ---------- BARS ---------- */
.bar{background:#0b0817; border:1px solid var(--border); border-radius:7px; height:18px; overflow:hidden; position:relative;}
.bar>i{display:block; height:100%; position:relative; transition:width .5s;}
.bar>i::after{content:""; position:absolute; inset:0; background:linear-gradient(100deg,transparent 20%,#ffffff55 50%,transparent 80%); background-size:220% 100%; animation:shimmer 2.6s linear infinite; mix-blend-mode:screen;}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.bar.hp>i{background:linear-gradient(90deg,var(--hp2),var(--hp));}
.bar.xp>i{background:linear-gradient(90deg,#b98a1f,var(--gold),var(--gold2));}
.bar.mast>i{background:linear-gradient(90deg,#0f766e,var(--mastery),#7ff0dc);}
.bar.boss>i{background:linear-gradient(90deg,#6d28d9,#c98bff);}
.bar span{position:absolute; inset:0; text-align:center; font-size:.72em; line-height:18px; color:#fff; text-shadow:0 1px 2px #000; z-index:1;}
/* ---------- HUD ---------- */
.hud{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
  background:linear-gradient(180deg,#221a3a,#160f28); border:1px solid var(--border); border-radius:12px; padding:12px 16px; margin-bottom:12px; box-shadow:0 6px 22px #00000044, inset 0 1px 0 #ffffff0d;}
.hud .who{font-family:'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif; color:var(--gold2); font-weight:700; text-shadow:0 0 14px #e8c35a44;}
.hud .meta{color:var(--dim); font-size:.85em;}
/* ---------- ZONES ---------- */
.zonegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(244px,1fr)); gap:12px;}
.zone{position:relative; border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer; min-height:214px;
  display:flex; flex-direction:column; box-shadow:0 4px 16px #00000044, inset 0 1px 0 #ffffff0d; transition:transform .16s,border-color .16s,box-shadow .16s;}
.zone:hover{transform:translateY(-3px); border-color:#6b5299; box-shadow:0 12px 28px #00000077,0 0 22px #7a5cc040, inset 0 1px 0 #ffffff12;}
.zone .zbg{position:absolute; inset:0; width:100%; height:100%; z-index:0; transition:transform .3s;}
.zone:hover .zbg{transform:scale(1.05);}
.zone .zshade{position:absolute; inset:0; z-index:1; background:linear-gradient(180deg,#0c0a18a8 0%,#0c0a1866 34%,#0c0a18cc 74%,#0c0a18f2 100%);}
.zone .zbody{position:relative; z-index:2; display:flex; flex-direction:column; flex:1; padding:13px 14px;}
.zone .ztop{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.zone .ztop h3{color:var(--gold2); font-size:1.04em; font-weight:700; line-height:1.15; text-shadow:0 1px 4px #000, 0 0 12px #0009;}
.zone .zicon{font-size:1.9em; flex:none; filter:drop-shadow(0 2px 5px #000c);}
.zone .zdesc{color:#d8cff0; font-size:.8em; line-height:1.4; margin:7px 0 8px; text-shadow:0 1px 3px #000a; flex:1;}
.zone .zfoot{margin-top:auto;}
.wtag{display:inline-block; background:#0f0b1ccc; border:1px solid var(--border); color:var(--gold2);
  font-size:.66em; font-weight:700; letter-spacing:.06em; text-transform:uppercase; border-radius:20px; padding:2px 9px; margin-bottom:7px;}
/* ---------- MONSTERS ---------- */
.monsterbox{text-align:center; padding:8px 0 4px;}
.monster{font-size:4.2em; display:inline-block; filter:drop-shadow(0 6px 14px #000);}
.monster.die{animation:die .7s forwards;} .monster.hit{animation:shake .4s;}
@keyframes die{to{transform:rotate(90deg) translateY(30px) scale(.6); opacity:0;}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.dmgfloat{position:absolute; font-weight:bold; font-size:1.5em; color:var(--gold2); text-shadow:0 2px 4px #000; animation:floatup 1s forwards; pointer-events:none;}
@keyframes floatup{to{transform:translateY(-56px); opacity:0;}}
.mname{font-family:'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif; color:var(--gold2); font-size:1.12em; font-weight:700;}
.mlevel{color:var(--dim); font-size:.8em;}
/* ---------- QUESTIONS ---------- */
.qtext{font-size:1.06em; line-height:1.55; margin:12px 0; color:#f4eeff;}
.opt{display:block; width:100%; text-align:left; background:linear-gradient(180deg,#211936,#191228);
  border:1px solid var(--border); color:var(--text); border-radius:10px; padding:12px 15px; margin:8px 0;
  font-size:.97em; cursor:pointer; font-family:inherit; transition:all .12s; line-height:1.45;}
.opt:hover{border-color:var(--gold); background:#271d42; transform:translateX(2px);}
.opt.sel{border-color:var(--mastery); background:#123230; box-shadow:0 0 10px #2dd4bf33;}
.opt.correct{border-color:var(--ok); background:#123322; color:#d9fbe4;}
.opt.wrong{border-color:var(--bad); background:#301418; color:#ffd9dc;}
.opt .key{color:var(--gold); font-weight:800; margin-right:9px;}
.explain{border-left:3px solid var(--gold); background:#140e24; padding:12px 15px; border-radius:0 10px 10px 0; margin:12px 0; color:#ded6f2; font-size:.95em; line-height:1.55;}
.explain b{color:var(--gold2);}
.verdict{font-family:'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif; font-size:1.25em; font-weight:700; margin:10px 0 2px;}
.verdict.win{color:var(--ok);} .verdict.lose{color:var(--bad);}
.streak{color:var(--legend); font-weight:bold; animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.6}}
.statline{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #2a2242; font-size:.93em;}
.statline b{color:var(--gold2);}
.loot{border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin:6px 0; background:#140e24;}
.r-common{color:var(--common);} .r-uncommon{color:var(--uncommon);} .r-rare{color:var(--rare);}
.r-epic{color:var(--epic);} .r-legend{color:var(--legend);}
/* ---------- LEGACY DOLL ---------- */
.doll{display:flex; align-items:stretch; justify-content:center; gap:12px; flex-wrap:wrap; padding:12px 0;}
.avatar{font-size:4.6em; align-self:center; filter:drop-shadow(0 0 14px #e8c35a66) drop-shadow(0 8px 12px #000);}
.slot{width:158px; border:2px solid var(--border); border-radius:10px; padding:10px 8px; text-align:center; background:linear-gradient(180deg,#140e24,#0f0b1c); display:flex; flex-direction:column; justify-content:center; gap:3px;}
.slot .sicon{font-size:2.1em; filter:drop-shadow(0 3px 6px #000);}
.slot .sname{font-size:.88em; font-weight:bold; line-height:1.25;}
.slot .stag{font-size:.66em; text-transform:uppercase; letter-spacing:1.5px;}
.slot .sbonus{font-size:.78em; color:var(--dim);}
.slot.empty{opacity:.5; border-style:dashed;}
/* ---------- RARITY BORDERS + GLOW ---------- */
.q-common{border-color:#8a8a99;}
.q-uncommon{border-color:var(--uncommon); box-shadow:0 0 8px #5fe08a22;}
.q-rare{border-color:var(--rare); box-shadow:0 0 10px #5aa8ff33;}
.q-epic{border-color:var(--epic); box-shadow:0 0 14px #c98bff55; animation:glowE 2.2s ease-in-out infinite;}
.q-legend{border-color:var(--legend); box-shadow:0 0 18px #ffab5266; animation:glowL 1.8s ease-in-out infinite;}
@keyframes glowE{50%{box-shadow:0 0 22px #c98bff88;}}
@keyframes glowL{50%{box-shadow:0 0 30px #ffab52aa;}}
.rtag{display:inline-block; border:1px solid; border-radius:20px; padding:1px 8px; font-size:.68em; font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin-right:6px;}
/* ---------- MAP ---------- */
.maphud{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; background:linear-gradient(180deg,#221a3a,#160f28); border:1px solid var(--border); border-radius:12px; padding:9px 14px; margin-bottom:10px; box-shadow:inset 0 1px 0 #ffffff0d;}
.maphud .who{font-family:'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif; color:var(--gold2); font-size:1em; font-weight:700;}
.maphud .meta{color:var(--dim); font-size:.82em;}
.gridwrap{display:flex; justify-content:center;}
.grid{display:grid; gap:4px; background:#0b0817; padding:10px; border:1px solid var(--border); border-radius:14px; width:100%; max-width:470px; box-shadow:inset 0 2px 12px #00000066;}
.cell{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:1.5em; border-radius:8px; background:#1a1330; border:1px solid #2a2144; user-select:none; transition:transform .08s,box-shadow .1s; position:relative;}
.cell.wall{background:repeating-linear-gradient(45deg,#241a40,#241a40 4px,#1a1330 4px,#1a1330 8px); border-color:#2a2144; filter:brightness(.8);}
.cell.floor{background:linear-gradient(160deg,#221a3c,#161028);}
.cell.adj{cursor:pointer; box-shadow:inset 0 0 0 2px #e8c35a66; background:linear-gradient(160deg,#2c2150,#1c1436);}
.cell.adj:hover{transform:scale(1.06); box-shadow:inset 0 0 0 2px var(--gold),0 0 12px #e8c35a55;}
.cell.here{background:linear-gradient(160deg,#3a2d63,#241d45); box-shadow:inset 0 0 0 2px var(--mastery),0 0 14px #2dd4bf55;}
.cell.done{opacity:.42; filter:grayscale(.5);}
.cell .drop{position:absolute; top:1px; right:3px; font-size:.5em;}
.cell.boss{box-shadow:inset 0 0 0 2px #c98bff77; animation:glowE 2s ease-in-out infinite;}
.legend{display:flex; flex-wrap:wrap; gap:4px 12px; justify-content:center; color:var(--dim); font-size:.78em; margin:8px 0;}
.dpad{display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,44px); gap:5px; justify-content:center; margin:12px auto;}
.dpad button{font-size:1.2em; background:linear-gradient(180deg,#2c2148,#1d1533); border:1px solid var(--line2); color:var(--gold2); border-radius:10px; cursor:pointer; transition:all .12s;}
.dpad button:hover{border-color:var(--gold); box-shadow:0 0 10px #e8c35a33;}
.dpad button:active{transform:translateY(1px);}
.dpad .sp{visibility:hidden;}
/* ---------- PAPERDOLL ---------- */
.paperdoll{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:start; margin:6px 0;}
.pcol{display:flex; flex-direction:column; gap:6px;}
.pslot{display:flex; align-items:center; gap:7px; border:1.5px solid var(--border); border-radius:9px; padding:6px 8px; background:linear-gradient(180deg,#191228,#130d20); min-height:42px; transition:filter .12s,transform .12s;}
.pslot.empty{opacity:.5; border-style:dashed;}
.pslot .pi{font-size:1.35em; width:24px; text-align:center; flex:none;}
.pslot .pinfo{min-width:0;}
.pslot .pn{font-size:.76em; font-weight:bold; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pslot .ps{font-size:.68em; color:var(--dim);}
.pcenter{display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:6px; padding-top:6px;}
.pcenter .pav{font-size:3.4em; filter:drop-shadow(0 0 14px #e8c35a66) drop-shadow(0 6px 10px #000);}
.statchip{background:#0f0b1c; border:1px solid var(--border); border-radius:9px; padding:5px 9px; font-size:.78em; text-align:center; width:100%;}
.statchip b{color:var(--gold2);}
.q-common.pslot{border-color:#8a8a99;} .q-uncommon.pslot{border-color:var(--uncommon);}
.q-rare.pslot{border-color:var(--rare);} .q-epic.pslot{border-color:var(--epic); box-shadow:0 0 8px #c98bff44;}
.q-legend.pslot{border-color:var(--legend); box-shadow:0 0 10px #ffab5255;}
.q-common.pslot,.q-uncommon.pslot,.q-rare.pslot,.q-epic.pslot,.q-legend.pslot{cursor:pointer;}
.q-common.pslot:hover,.q-uncommon.pslot:hover,.q-rare.pslot:hover,.q-epic.pslot:hover,.q-legend.pslot:hover{filter:brightness(1.18); transform:translateY(-1px);}
.pslot .ps .rtag{transform:scale(.86); transform-origin:left center; margin-right:2px;}
@media(max-width:560px){.paperdoll{grid-template-columns:1fr 1fr;} .pcenter{grid-column:1/3; order:-1; flex-direction:row; flex-wrap:wrap;} .pcenter .statchip{width:auto;}}
/* ---------- LOOT CARDS ---------- */
.lootcard{border:2px solid var(--border); border-radius:12px; padding:10px 14px; margin:10px 0; background:linear-gradient(180deg,#1b1330,#140e24); display:flex; align-items:center; gap:12px;}
.lootcard .li{font-size:2.2em; flex:none;}
.lootcard .lmeta{font-size:.82em; color:var(--dim); margin:2px 0;}
.lootcard .lmeta b{color:var(--gold2);}
.lcmp{font-size:.82em; margin-top:4px; padding:5px 9px; border-radius:7px; line-height:1.3;}
.lcmp.up{color:#8dffb0; background:#0f2417; border:1px solid #2f6b45;}
.lcmp.up b{color:#adffc6;}
.lcmp.new{color:var(--gold2); background:#241d0f; border:1px solid #6b5a2f;}
.lcmp.keep{color:var(--dim); background:#161320; border:1px solid var(--border);}
/* ---------- ITEM DETAIL OVERLAY ---------- */
.ovl{position:fixed; inset:0; background:rgba(6,4,14,.82); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; animation:ovlin .18s ease;}
@keyframes ovlin{from{opacity:0}to{opacity:1}}
.itemcard{position:relative; width:100%; max-width:340px; background:linear-gradient(180deg,#241a40,#160f28); border:2px solid var(--line2); border-radius:14px; padding:16px 18px; box-shadow:0 18px 50px #000, inset 0 1px 0 #ffffff12;}
.itemcard .ovx{position:absolute; top:8px; right:10px; background:none; border:none; color:var(--dim); font-size:1.1em; cursor:pointer; padding:2px 6px;}
.itemcard .ovx:hover{color:var(--gold2);}
.itemcard .itop{display:flex; gap:12px; align-items:center;}
.itemcard .ibig{font-size:2.8em; filter:drop-shadow(0 4px 10px #000); flex:none;}
.itemcard .iname{font-family:'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif; font-weight:700; font-size:1.12em; line-height:1.15; margin:2px 0;}
.itemcard .idivider{height:1px; background:linear-gradient(90deg,transparent,var(--line2),transparent); margin:12px 0 8px;}
.itemcard .iflavor{margin-top:10px; font-size:.84em; color:var(--dim); line-height:1.45; border-left:2px solid var(--gold); padding-left:10px;}

#ruhaScene .rz-roadband{position:absolute; top:45%; left:0; right:0; height:17%; background:linear-gradient(180deg,#3a3552,#211c33); overflow:hidden;}
#ruhaScene .rz-roadband .rz-lane{position:absolute; left:50%; top:0; bottom:0; width:16px; margin-left:-8px; background:repeating-linear-gradient(180deg,#f2d878 0 20px,transparent 20px 46px); background-size:100% 66px; animation:rzLane .5s linear infinite;}
@keyframes rzLane{from{background-position-y:0}to{background-position-y:66px}}
/* the dashboard fills the lower half; the car is the star */
#ruhaScene .rz-dash{position:absolute; left:-6%; right:-6%; bottom:0; height:56%; background:linear-gradient(180deg,#2b2338 0%,#161022 58%,#0a0713 100%); border-top-left-radius:52% 74px; border-top-right-radius:52% 74px; box-shadow:inset 0 10px 30px #0009, 0 -14px 36px #0007;}
#ruhaScene .rz-dash::before{content:""; position:absolute; top:18px; left:8%; right:8%; height:2px; background:linear-gradient(90deg,transparent,#ffffff16,transparent);}
#ruhaScene .rz-vent{position:absolute; top:40px; width:88px; height:22px; border-radius:7px; background:repeating-linear-gradient(90deg,#0c0913 0 5px,#241d30 5px 10px); box-shadow:inset 0 1px 3px #000;}
#ruhaScene .rz-plaque{position:absolute; bottom:14px; left:50%; transform:translateX(-50%); color:#d4af37; font-weight:800; letter-spacing:4px; font-size:.78em; opacity:.8;}
.rz-wheel{position:fixed; bottom:-120px; left:15%; width:300px; height:300px; z-index:4; pointer-events:none; animation:rzTilt 4.5s ease-in-out infinite;}
@keyframes rzTilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.rz-speedo{position:fixed; bottom:40px; right:13%; width:118px; height:118px; z-index:4; pointer-events:none;}
.rz-badge{position:fixed; top:14px; left:14px; z-index:6; pointer-events:none; background:#0f0b1ccc; border:1px solid #d4af37; border-radius:12px; padding:6px 12px; color:#ffdd82; font-weight:700; font-size:.85em;}
/* the interactive site, shrunk onto the center console */
body.ruha #shell{position:fixed; z-index:5; left:50%; top:39%; transform:translateX(-50%); width:min(400px,88vw); height:min(340px,44vh); overflow:auto; -webkit-overflow-scrolling:touch;
  background:#0b0912; border-radius:16px; padding:8px 6px; box-shadow:0 0 0 6px #15121c, 0 0 0 9px #d4af37cc, 0 20px 44px #000c, inset 0 0 30px #000; animation:rzBob 2.8s ease-in-out infinite; scrollbar-width:thin;}
@keyframes rzBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
body.ruha #app{padding:10px 8px 34px;}
body.ruha #app h1{font-size:1.4em;}
@media(max-width:700px){ body.ruha #shell{top:37%; height:46vh;} .rz-wheel{left:5%;width:230px;height:230px;bottom:-96px;} .rz-speedo{right:7%;width:88px;height:88px;} }
/* ---------- TAVERN PROPS (fireplace, tables, lanterns) ---------- */
#tavern{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
body.ruha #tavern{display:none;}
#tavern .tv-bg{position:absolute; inset:0; background-position:center; background-size:cover; background-repeat:no-repeat;}
#tavern .tv-flick{position:absolute; inset:0; background:radial-gradient(38% 42% at 14% 60%, #ff8a2e30, transparent 62%); animation:tvGlow 3s ease-in-out infinite;}
#tavern .tv-shade{position:absolute; inset:0; background:
  radial-gradient(135% 100% at 50% 42%, transparent 40%, #08060eb8 100%),
  linear-gradient(180deg, #08060e5c 0%, #08060e1f 28%, #08060e33 55%, #08060e9e 100%);}
.tv-fireamb{position:absolute; left:-90px; top:46%; width:440px; height:440px; transform:translateY(-50%); border-radius:50%;
  background:radial-gradient(circle, #ff8a2e3a 0%, #ff6a1e18 40%, transparent 68%); animation:tvGlow 3.2s ease-in-out infinite;}
.tv-fire{position:absolute; left:min(2.5vw,26px); top:50%; transform:translateY(-47%); width:172px;}
.tv-fire svg{width:100%; height:auto;}
.tv-fire .flame{transform-origin:50% 100%; animation:tvFlick 1.05s ease-in-out infinite;}
.tv-fire .f2{animation-duration:.78s; animation-delay:.18s;} .tv-fire .f3{animation-duration:1.35s; animation-delay:.36s;}
.tv-fire .tv-fireglow{animation:tvGlow 2.3s ease-in-out infinite; transform-origin:50% 70%;}
@keyframes tvFlick{0%,100%{transform:scaleY(1) scaleX(1); opacity:.94} 50%{transform:scaleY(1.13) scaleX(.93) translateY(-3px); opacity:1}}
@keyframes tvGlow{0%,100%{opacity:.68} 50%{opacity:1}}
.tv-lantern{position:absolute; top:-2px; width:52px;}
.tv-lantern svg{width:100%; height:auto;}
.tv-lantern .tv-lflame{filter:drop-shadow(0 0 7px #ffb43a); animation:tvFlick 1.4s ease-in-out infinite; transform-origin:50% 60%;}
.tv-l1{left:8%;} .tv-l2{right:8%; top:6px;}
.tv-floor{position:absolute; left:0; right:0; bottom:0; height:96px; background:linear-gradient(180deg,#1a0f07 0%,#0d0805 100%); box-shadow:inset 0 10px 22px #0007;}
.tv-table{position:absolute; bottom:20px; width:150px;}
.tv-table svg{width:100%; height:auto;}
.tv-table .tv-candle{filter:drop-shadow(0 0 6px #ffcf5e); animation:tvFlick 1.2s ease-in-out infinite; transform-origin:50% 80%;}
.tv-t1{left:6%;} .tv-t2{right:6%; width:132px;}
@media(max-width:820px){ .tv-fire{opacity:.5;} .tv-table,.tv-lantern{display:none;} }
</style>
